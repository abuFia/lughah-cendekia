1:{goal:"Mengenal 28 huruf hijaiyah dan membaca harakat dasar.",more:"<b>Bentuk huruf:</b> huruf berubah menurut posisinya (awal, tengah, akhir, atau sendiri), misalnya ب: بـ ـبـ ـب ب. <b>Huruf yang tidak bersambung</b> dengan huruf sesudahnya ada enam: ا د ذ ر ز و. <b>Tanwin</b> (ـً ـٍ ـٌ) adalah harakat ganda yang dibaca an, in, un. <b>Mad (bunyi panjang)</b> dibaca dua ketukan: alif setelah fathah (بَا = baa), ya sukun setelah kasrah (بِي = bii), wawu sukun setelah dhammah (بُو = buu). <b>Latihan:</b> baca كَتَبَ (ka-ta-ba), lalu baca dengan sukun: مَكْتَبٌ (mak-ta-bun).",body:"Huruf hijaiyah ada 28 dan dibaca dari kanan ke kiri. Harakat adalah tanda baca: fathah (garis miring di atas) dibaca 'a', kasrah (di bawah) dibaca 'i', dhammah (seperti wawu kecil) dibaca 'u', sukun (bulat kecil) berarti huruf mati, dan syaddah menandakan huruf dibaca dobel/ditekan.",

2:{goal:"Menguasai kosakata benda sehari-hari.",more:"<b>Tanpa dan dengan ال:</b> kata tanpa ال berarti 'sebuah ...' (كِتَابٌ = sebuah buku), dengan ال berarti '... itu' (الْكِتَابُ = buku itu). Saat ada ال, tanwin hilang. <b>Kelompokkan kosakata</b> agar mudah dihafal. Benda sekolah: كِتَابٌ، قَلَمٌ، مِسْطَرَةٌ (penggaris). Benda rumah: بَيْتٌ، بَابٌ، نَافِذَةٌ (jendela)، كُرْسِيٌّ (kursi)، طَاوِلَةٌ (meja). Alam: مَاءٌ، شَمْسٌ (matahari)، قَمَرٌ (bulan).",body:"Mulailah dari benda yang terlihat di sekitar. Kebanyakan kata benda ditulis dengan tanwin (ـٌ) bila belum ditentukan, misalnya كِتَابٌ 'sebuah buku'.",

4:{goal:"Memahami isim (kata benda) dan ciri-cirinya.",more:"<b>Nakirah dan ma'rifah:</b> isim nakirah bersifat umum dan biasanya bertanwin (رَجُلٌ = seorang laki-laki). Isim ma'rifah bersifat tertentu: memakai ال (الرَّجُلُ = laki-laki itu), nama diri (مُحَمَّدٌ), atau dhamir. <b>Jenis isim:</b> mudzakkar (كِتَابٌ) dan muannats yang sering berakhiran ta marbuthah (مَدْرَسَةٌ، طَالِبَةٌ). <b>Ciri isim:</b> bisa bertanwin, bisa diberi ال, bisa didahului huruf jar, dan bisa menjadi mubtada atau fa'il.",body:"Isim adalah kata yang menunjukkan nama orang, benda, tempat, atau sifat tanpa terikat waktu. Ciri umumnya: bertanwin, diawali alif-lam (ال), atau didahului huruf jar.",

5:{goal:"Memahami fi'il (kata kerja) dan tiga bentuk dasarnya.",more:"<b>Akar kata:</b> kebanyakan fi'il berakar tiga huruf; dari ك-ت-ب lahir كَتَبَ (madhi), يَكْتُبُ (mudhari'), اُكْتُبْ (amr). <b>Ciri fi'il:</b> bisa didahului قَدْ (sudah) atau سَـ/سَوْفَ (akan), dan fi'il madhi bisa berakhiran ta ta'nits sukun (كَتَبَتْ = dia pr telah menulis). <b>Awalan mudhari':</b> أ ن ي ت menunjukkan pelaku: أَكْتُبُ (saya menulis), نَكْتُبُ (kami menulis), يَكْتُبُ (dia lk menulis), تَكْتُبُ (kamu atau dia pr menulis).",body:"Fi'il adalah kata yang menunjukkan perbuatan dan terikat waktu. Madhi = lampau (كَتَبَ), mudhari' = sekarang/akan datang (يَكْتُبُ), amr = perintah (اُكْتُبْ).",

6:{goal:"Menggunakan kata tunjuk untuk menunjuk benda dekat dan jauh.",body:"Isim isyarah menunjuk sesuatu. Untuk benda dekat: هٰذَا (laki-laki/mudzakkar) dan هٰذِهِ (perempuan/muannats). Untuk benda jauh: ذٰلِكَ (mudzakkar) dan تِلْكَ (muannats). Pilih sesuai jenis benda yang ditunjuk.",vocab:[["هٰذَا","ini (mudzakkar)"],["هٰذِهِ","ini (muannats)"],["ذٰلِكَ","itu (mudzakkar)"],["تِلْكَ","itu (muannats)"],["هٰؤُلَاءِ","mereka ini (jamak)"]],ex:[["هٰذَا قَلَمٌ","Ini sebuah pena."],["هٰذِهِ مَدْرَسَةٌ","Ini sebuah sekolah."],["ذٰلِكَ بَيْتٌ","Itu sebuah rumah."]],quiz:[q("هٰذَا artinya…",["Ini (mudzakkar)","Itu (muannats)","Mereka"],0,"هٰذَا = ini untuk mudzakkar."),q("Untuk benda perempuan yang dekat, gunakan…",["هٰذَا","هٰذِهِ","ذٰلِكَ"],1,"هٰذِهِ = ini (muannats)."),q("ذٰلِكَ digunakan untuk benda yang…",["Dekat","Jauh","Banyak saja"],1,"ذٰلِكَ = itu (jauh)."),q("تِلْكَ artinya…",["Itu (muannats)","Ini (mudzakkar)","Dia"],0,"تِلْكَ = itu untuk muannats."),q("Pilih yang tepat: ___ قَلَمٌ (Ini pena)",["هٰذِهِ","هٰذَا","تِلْكَ"],1,"قَلَمٌ mudzakkar, jadi هٰذَا.")]},
7:{goal:"Mengenal kata tanya dan cara membuat pertanyaan sederhana.",body:"Istifham adalah kata tanya yang biasanya ada di awal kalimat. Jawaban diawali dengan jawaban langsung, misalnya مَا هٰذَا؟ dijawab هٰذَا قَلَمٌ.",vocab:[["مَا","apa"],["مَنْ","siapa"],["أَيْنَ","di mana"],["مَتَى","kapan"],["كَيْفَ","bagaimana"],["كَمْ","berapa"],["لِمَاذَا","mengapa"]],ex:[["مَا هٰذَا؟","Apa ini?"],["مَنْ هُوَ؟","Siapa dia?"],["أَيْنَ الْكِتَابُ؟","Di mana bukunya?"]],quiz:[q("مَنْ artinya…",["Apa","Siapa","Kapan"],1,"مَنْ = siapa."),q("أَيْنَ artinya…",["Di mana","Mengapa","Berapa"],0,"أَيْنَ = di mana."),q("Untuk menanyakan jumlah, gunakan…",["كَمْ","مَتَى","مَا"],0,"كَمْ = berapa."),q("كَيْفَ artinya…",["Bagaimana","Kapan","Siapa"],0,"كَيْفَ = bagaimana."),q("لِمَاذَا digunakan untuk menanyakan…",["Alasan","Waktu","Tempat"],0,"لِمَاذَا = mengapa (alasan).")]},
8:{goal:"Mengenal huruf jar dan pengaruhnya pada kata sesudahnya.",body:"Harf jar adalah kata depan. Isim sesudahnya menjadi majrur, ditandai kasrah di akhir kata, misalnya فِي الْبَيْتِ (di dalam rumah).",vocab:[["فِي","di / di dalam"],["مِنْ","dari"],["إِلَى","ke"],["عَلَى","di atas / pada"],["عَنْ","tentang / dari"],["حَقِيبَةٌ","tas"]],ex:[["الْكِتَابُ فِي الْحَقِيبَةِ","Bukunya di dalam tas."],["ذَهَبَ إِلَى الْمَدْرَسَةِ","Ia pergi ke sekolah."]],quiz:[q("إِلَى artinya…",["Dari","Ke","Di atas"],1,"إِلَى = ke."),q("مِنْ artinya…",["Dari","Ke","Di dalam"],0,"مِنْ = dari."),q("فِي artinya…",["Di atas","Di dalam","Tentang"],1,"فِي = di/di dalam."),q("Isim setelah harf jar berharakat akhir…",["Kasrah","Fathah","Sukun"],0,"Isim setelah harf jar majrur (kasrah)."),q("عَلَى artinya…",["Di atas","Dari","Mengapa"],0,"عَلَى = di atas/pada.")]},
9:{goal:"Memakai kata sifat dan lawan katanya.",body:"Kata sifat (na'at) diletakkan setelah kata yang disifati dan menyesuaikan jenisnya: بَيْتٌ كَبِيرٌ (rumah besar), مَدْرَسَةٌ كَبِيرَةٌ (sekolah besar). Hafalkan sepasang lawan kata sekaligus.",vocab:[["كَبِيرٌ","besar"],["صَغِيرٌ","kecil"],["طَوِيلٌ","panjang / tinggi"],["قَصِيرٌ","pendek"],["جَدِيدٌ","baru"],["قَدِيمٌ","lama"],["سَهْلٌ","mudah"],["صَعْبٌ","sulit"]],ex:[["بَيْتٌ كَبِيرٌ","Rumah yang besar."],["مَدْرَسَةٌ جَدِيدَةٌ","Sekolah yang baru."]],quiz:[q("Lawan kata كَبِيرٌ adalah…",["صَغِيرٌ","جَدِيدٌ","سَهْلٌ"],0,"كَبِيرٌ (besar) >< صَغِيرٌ (kecil)."),q("جَدِيدٌ artinya…",["Lama","Baru","Sulit"],1,"جَدِيدٌ = baru."),q("Lawan kata سَهْلٌ adalah…",["صَعْبٌ","قَصِيرٌ","قَدِيمٌ"],0,"سَهْلٌ (mudah) >< صَعْبٌ (sulit)."),q("قَصِيرٌ artinya…",["Panjang","Pendek","Besar"],1,"قَصِيرٌ = pendek."),q("Kata sifat diletakkan…",["Sebelum yang disifati","Sesudah yang disifati","Di akhir paragraf"],1,"Na'at diletakkan setelah man'ut.")]},
10:{goal:"Menyusun kalimat sederhana dari kosakata yang sudah dipelajari.",body:"Ada dua pola dasar. Kalimat ismiyah dimulai dengan isim: الْبَيْتُ كَبِيرٌ. Kalimat fi'liyah dimulai dengan fi'il: ذَهَبَ مُحَمَّدٌ إِلَى الْمَدْرَسَةِ.",vocab:[["جُمْلَةٌ","kalimat"],["طَالِبٌ","siswa"],["مُعَلِّمٌ","guru"],["فَصْلٌ","kelas"]],ex:[["الْكِتَابُ جَدِيدٌ","Bukunya baru."],["ذَهَبَ الطَّالِبُ إِلَى الْفَصْلِ","Siswa itu pergi ke kelas."]],quiz:[q("Kalimat yang dimulai dengan isim disebut…",["Ismiyah","Fi'liyah","Istifham"],0,"Dimulai isim = jumlah ismiyah."),q("Kalimat yang dimulai dengan fi'il disebut…",["Ismiyah","Fi'liyah","Isyarah"],1,"Dimulai fi'il = jumlah fi'liyah."),q("الْكِتَابُ جَدِيدٌ artinya…",["Bukunya baru","Bukunya besar","Ia membaca buku"],0,"Buku itu baru."),q("ذَهَبَ الطَّالِبُ إِلَى الْفَصْلِ termasuk…",["Ismiyah","Fi'liyah","Pertanyaan"],1,"Dimulai dengan fi'il ذَهَبَ."),q("Pilih yang tepat: هٰذِهِ ___ (ini sekolah)",["كِتَابٌ","مَدْرَسَةٌ","قَلَمٌ"],1,"هٰذِهِ untuk muannats, مَدْرَسَةٌ muannats.")]},
11:{goal:"Memahami jumlah ismiyah (kalimat yang diawali isim).",body:"Jumlah ismiyah dimulai dengan isim dan terdiri dari dua unsur: mubtada (yang dibicarakan) dan khabar (keterangannya). Keduanya marfu', ditandai dhammah atau tanwin dhammah. Mubtada biasanya isim ma'rifah (tertentu), sedangkan khabar boleh nakirah. Contoh: الْبَيْتُ كَبِيرٌ = rumah itu besar.",more:"<b>Pola:</b> mubtada + khabar. Kalimat ismiyah tidak memakai kata 'adalah' dalam bahasa Arab, jadi الطَّالِبُ مُجْتَهِدٌ langsung berarti 'siswa itu rajin'.",vocab:[["جُمْلَةٌ اِسْمِيَّةٌ","kalimat nominal"],["مُبْتَدَأٌ","yang dibicarakan (subjek)"],["خَبَرٌ","keterangan / predikat"],["مَرْفُوعٌ","berharakat dhammah"],["مُجْتَهِدٌ","rajin"]],ex:[["الْمَدْرَسَةُ جَدِيدَةٌ","Sekolah itu baru."],["الطَّالِبُ مُجْتَهِدٌ","Siswa itu rajin."],["مُحَمَّدٌ فِي الْفَصْلِ","Muhammad ada di kelas."]],quiz:[q("Jumlah ismiyah adalah kalimat yang diawali…",["Fi'il","Isim","Huruf jar"],1,"Ismiyah = diawali isim."),q("Dua unsur utama jumlah ismiyah adalah…",["Fi'il dan fa'il","Mubtada dan khabar","Na'at dan man'ut"],1,"Mubtada dan khabar."),q("الْبَيْتُ كَبِيرٌ artinya…",["Rumah itu besar","Ia pergi ke rumah","Rumah baru"],0,"الْبَيْتُ = rumah itu, كَبِيرٌ = besar."),q("Mubtada biasanya berupa isim yang…",["Ma'rifah (tertentu)","Selalu jamak","Selalu fi'il"],0,"Mubtada umumnya ma'rifah."),q("Harakat akhir mubtada dan khabar (tunggal) adalah…",["Dhammah / tanwin dhammah","Fathah","Kasrah"],0,"Keduanya marfu' (dhammah).")]},
12:{goal:"Memahami mubtada dan khabar serta kesesuaian keduanya.",body:"Khabar harus sesuai dengan mubtada dalam jenis (mudzakkar atau muannats) dan jumlah. Mubtada mudzakkar memakai khabar mudzakkar, mubtada muannats memakai khabar muannats (biasanya berakhiran ta marbuthah). Khabar juga boleh berupa harf jar dan majrur, seperti فِي الْحَقِيبَةِ.",more:"<b>Contoh kesesuaian:</b> الْوَلَدُ مُجْتَهِدٌ (anak lk rajin), الْبِنْتُ مُجْتَهِدَةٌ (anak pr rajin). <b>Khabar berupa keterangan tempat:</b> الْكِتَابُ فِي الْحَقِيبَةِ (bukunya di dalam tas).",vocab:[["وَلَدٌ","anak laki-laki"],["بِنْتٌ","anak perempuan"],["مُجْتَهِدَةٌ","rajin (perempuan)"],["نَشِيطٌ","aktif (laki-laki)"],["نَشِيطَةٌ","aktif (perempuan)"]],ex:[["الْمُعَلِّمَةُ نَشِيطَةٌ","Guru perempuan itu aktif."],["الْبِنْتُ مُجْتَهِدَةٌ","Anak perempuan itu rajin."],["الْكِتَابُ فِي الْحَقِيبَةِ","Bukunya di dalam tas."]],quiz:[q("Pada الطَّالِبَةُ مُجْتَهِدَةٌ, khabarnya adalah…",["الطَّالِبَةُ","مُجْتَهِدَةٌ","Tidak ada"],1,"مُجْتَهِدَةٌ adalah khabar."),q("Khabar harus sesuai dengan mubtada dalam…",["Jenis dan jumlah","Warna","Panjang kata"],0,"Sesuai jenis dan jumlah."),q("مُجْتَهِدَةٌ digunakan untuk…",["Laki-laki","Perempuan","Jamak laki-laki"],1,"Ta marbuthah menandakan muannats."),q("Contoh khabar berupa harf jar dan majrur adalah…",["الْكِتَابُ فِي الْحَقِيبَةِ","ذَهَبَ الْوَلَدُ","اُكْتُبْ"],0,"فِي الْحَقِيبَةِ menjadi khabar."),q("Pilih yang benar: الْمُعَلِّمَةُ ___",["نَشِيطٌ","نَشِيطَةٌ","نَشِيطُونَ"],1,"Mubtada muannats, khabar muannats.")]},
13:{goal:"Memahami jumlah fi'liyah (kalimat yang diawali fi'il).",body:"Jumlah fi'liyah dimulai dengan fi'il, lalu fa'il (pelaku) yang marfu'. Kadang ada maf'ul bih (objek) dan keterangan. Jika pelakunya perempuan, fi'il madhi diberi ta ta'nits sukun: جَلَسَتِ الطَّالِبَةُ. Fi'il tetap bentuk tunggal meski fa'il-nya jamak: ذَهَبَ الطُّلَّابُ.",more:"<b>Bandingkan:</b> الطَّالِبُ ذَهَبَ (ismiyah, diawali isim) dan ذَهَبَ الطَّالِبُ (fi'liyah, diawali fi'il). Artinya sama-sama 'siswa itu pergi', tetapi jenis kalimatnya berbeda.",vocab:[["جَلَسَ","telah duduk"],["دَخَلَ","telah masuk"],["خَرَجَ","telah keluar"],["فَتَحَ","telah membuka"],["فَاعِلٌ","pelaku"]],ex:[["جَلَسَ الْمُعَلِّمُ","Guru itu telah duduk."],["دَخَلَ الطَّالِبُ الْفَصْلَ","Siswa itu masuk kelas."],["جَلَسَتِ الطَّالِبَةُ","Siswi itu telah duduk."]],quiz:[q("Jumlah fi'liyah diawali dengan…",["Isim","Fi'il","Harf"],1,"Fi'liyah diawali fi'il."),q("جَلَسَ الْمُعَلِّمُ artinya…",["Guru itu duduk","Guru itu masuk","Guru itu baru"],0,"جَلَسَ = duduk."),q("Pelaku dalam jumlah fi'liyah disebut…",["Fa'il","Khabar","Mubtada"],0,"Pelaku = fa'il."),q("Jika pelakunya perempuan, fi'il madhi diberi…",["Ta ta'nits sukun (ـَتْ)","Tanwin","Syaddah"],0,"Contoh: جَلَسَتِ الطَّالِبَةُ."),q("دَخَلَ artinya…",["Keluar","Masuk","Membuka"],1,"دَخَلَ = masuk.")]},
14:{goal:"Mengenali fi'il, fa'il, dan maf'ul bih dalam satu kalimat.",body:"Pola dasar: fi'il + fa'il + maf'ul bih. Fa'il adalah pelaku dan marfu' (dhammah). Maf'ul bih adalah objek yang dikenai perbuatan dan manshub (fathah). Contoh: فَتَحَ الْوَلَدُ الْبَابَ = anak itu membuka pintu; الْوَلَدُ fa'il (dhammah), الْبَابَ maf'ul bih (fathah).",more:"<b>Cara menemukan:</b> tanyakan 'siapa yang melakukan?' untuk fa'il, dan 'apa yang dikenai?' untuk maf'ul bih.",vocab:[["شَرِبَ","telah minum"],["مَفْعُولٌ بِهِ","objek"],["مَنْصُوبٌ","berharakat fathah"],["فَتَحَ","telah membuka"]],ex:[["فَتَحَ الْوَلَدُ الْبَابَ","Anak itu membuka pintu."],["قَرَأَ الطَّالِبُ الْكِتَابَ","Siswa itu membaca buku."],["شَرِبَ مُحَمَّدٌ الْمَاءَ","Muhammad minum air."]],quiz:[q("Fa'il berharakat akhir…",["Dhammah","Fathah","Kasrah"],0,"Fa'il marfu' (dhammah)."),q("Maf'ul bih berharakat akhir…",["Dhammah","Fathah","Kasrah"],1,"Maf'ul bih manshub (fathah)."),q("Fa'il dalam فَتَحَ الْوَلَدُ الْبَابَ adalah…",["الْوَلَدُ","الْبَابَ","فَتَحَ"],0,"الْوَلَدُ yang membuka."),q("Maf'ul bih dalam kalimat itu adalah…",["الْبَابَ","الْوَلَدُ","فَتَحَ"],0,"الْبَابَ yang dibuka."),q("شَرِبَ مُحَمَّدٌ الْمَاءَ artinya…",["Muhammad minum air","Muhammad pergi","Muhammad membaca"],0,"شَرِبَ = minum, الْمَاءَ = air.")]},
15:{goal:"Membedakan mufrad (satu), mutsanna (dua), dan jamak (tiga atau lebih).",body:"Mufrad untuk satu: طَالِبٌ. Mutsanna untuk dua, akhiran ـَانِ (rafa') atau ـَيْنِ (nashab/jar): طَالِبَانِ. Jamak untuk tiga atau lebih: jamak mudzakkar salim berakhiran ـُونَ (rafa') / ـِينَ (nashab/jar), jamak muannats salim berakhiran ـَاتٌ, dan jamak taksir (tidak beraturan) seperti كِتَابٌ menjadi كُتُبٌ.",more:"<b>Tips:</b> jamak taksir harus dihafal satu per satu, sedangkan jamak salim mengikuti pola akhiran yang tetap.",vocab:[["طَالِبٌ","seorang siswa"],["طَالِبَانِ","dua siswa"],["طُلَّابٌ","para siswa (jamak taksir)"],["مُعَلِّمُونَ","para guru (jamak salim lk)"],["مُعَلِّمَاتٌ","para guru perempuan"],["كُتُبٌ","buku-buku"]],ex:[["هٰذَانِ طَالِبَانِ","Ini dua orang siswa."],["الْمُعَلِّمُونَ فِي الْفَصْلِ","Para guru ada di kelas."],["الْكُتُبُ جَدِيدَةٌ","Buku-buku itu baru."]],quiz:[q("Mutsanna menunjukkan jumlah…",["Satu","Dua","Tiga atau lebih"],1,"Mutsanna = dua."),q("طَالِبَانِ artinya…",["Satu siswa","Dua siswa","Banyak siswa"],1,"Akhiran ـَانِ = dua."),q("Jamak mudzakkar salim (rafa') berakhiran…",["ـُونَ","ـَاتٌ","ـَانِ"],0,"Contoh: مُعَلِّمُونَ."),q("Jamak muannats salim berakhiran…",["ـَاتٌ","ـُونَ","ـَيْنِ"],0,"Contoh: مُعَلِّمَاتٌ."),q("Jamak taksir dari كِتَابٌ adalah…",["كُتُبٌ","كِتَابَانِ","كِتَابُونَ"],0,"كُتُبٌ = buku-buku.")]},
16:{goal:"Membedakan isim mudzakkar dan muannats serta mengubahnya.",body:"Isim mudzakkar untuk laki-laki atau benda bergender maskulin, muannats untuk perempuan atau benda bergender feminin. Ciri muannats yang paling umum adalah ta marbuthah (ـَةٌ): طَالِبٌ menjadi طَالِبَةٌ, مُعَلِّمٌ menjadi مُعَلِّمَةٌ, كَبِيرٌ menjadi كَبِيرَةٌ. Sebagian kata muannats tidak memakai ta marbuthah, misalnya أُمٌّ (ibu).",more:"<b>Ingat:</b> kata sifat dan khabar harus mengikuti jenis kata yang diterangkan: مَدْرَسَةٌ كَبِيرَةٌ, bukan مَدْرَسَةٌ كَبِيرٌ.",vocab:[["أَبٌ","ayah"],["أُمٌّ","ibu"],["أَخٌ","saudara laki-laki"],["أُخْتٌ","saudara perempuan"],["مُعَلِّمَةٌ","guru perempuan"]],ex:[["الْأَبُ مُعَلِّمٌ وَالْأُمُّ مُعَلِّمَةٌ","Ayah seorang guru dan ibu seorang guru."],["هٰذَا أَخٌ وَهٰذِهِ أُخْتٌ","Ini saudara laki-laki dan ini saudara perempuan."],["الْمَدْرَسَةُ كَبِيرَةٌ","Sekolah itu besar."]],quiz:[q("Ciri muannats yang paling umum adalah…",["Ta marbuthah (ـَةٌ)","Tanwin","Sukun"],0,"Ta marbuthah menandakan muannats."),q("Bentuk muannats dari طَالِبٌ adalah…",["طَالِبَةٌ","طَالِبَانِ","طُلَّابٌ"],0,"Tambahkan ta marbuthah."),q("أُمٌّ artinya…",["Ayah","Ibu","Saudari"],1,"أُمٌّ = ibu."),q("Pilih yang benar: مَدْرَسَةٌ ___",["كَبِيرٌ","كَبِيرَةٌ","كَبِيرُونَ"],1,"Muannats memakai sifat muannats."),q("أُخْتٌ artinya…",["Saudara laki-laki","Saudara perempuan","Ibu"],1,"أُخْتٌ = saudara perempuan.")]},
17:{goal:"Mengenal kata kerja madhi dan perubahannya menurut pelaku.",body:"Fi'il madhi menunjukkan perbuatan yang sudah terjadi. Akhirnya berubah menurut pelaku. Dari كَتَبَ: كَتَبَ (dia lk), كَتَبَتْ (dia pr), كَتَبْتَ (kamu lk), كَتَبْتِ (kamu pr), كَتَبْتُ (saya), كَتَبْنَا (kami), كَتَبُوا (mereka lk).",more:"<b>Perhatikan:</b> كَتَبْتَ dan كَتَبْتِ hanya berbeda pada harakat huruf ت, yaitu fathah untuk laki-laki dan kasrah untuk perempuan.",vocab:[["كَتَبَ","dia (lk) telah menulis"],["كَتَبَتْ","dia (pr) telah menulis"],["كَتَبْتُ","saya telah menulis"],["كَتَبْنَا","kami telah menulis"],["كَتَبُوا","mereka (lk) telah menulis"]],ex:[["كَتَبْتُ الدَّرْسَ","Saya telah menulis pelajaran."],["ذَهَبْنَا إِلَى الْمَسْجِدِ","Kami telah pergi ke masjid."],["قَرَأَتْ هِيَ الْكِتَابَ","Dia (pr) telah membaca buku."]],quiz:[q("كَتَبْتُ artinya…",["Saya telah menulis","Kami telah menulis","Dia telah menulis"],0,"Akhiran تُ = saya."),q("كَتَبْنَا artinya…",["Saya telah menulis","Kami telah menulis","Mereka telah menulis"],1,"Akhiran نَا = kami."),q("كَتَبَتْ digunakan untuk…",["Dia (pr)","Dia (lk)","Kamu (lk)"],0,"Ta sukun = dia perempuan."),q("Akhiran تِ pada كَتَبْتِ menunjukkan…",["Kamu (pr)","Kamu (lk)","Saya"],0,"Kasrah pada ت = kamu perempuan."),q("كَتَبُوا artinya…",["Mereka (lk) telah menulis","Ia menulis","Tulislah"],0,"Akhiran وا = mereka laki-laki.")]},
18:{goal:"Mengenal kata kerja mudhari' (sekarang dan akan datang).",body:"Fi'il mudhari' diawali salah satu huruf أ ن ي ت. Contoh dari كَتَبَ: أَكْتُبُ (saya menulis), نَكْتُبُ (kami menulis), يَكْتُبُ (dia lk), تَكْتُبُ (kamu lk atau dia pr), تَكْتُبِينَ (kamu pr), يَكْتُبُونَ (mereka lk). Mudhari' menunjukkan perbuatan sekarang atau akan datang.",more:"<b>Pasangan madhi dan mudhari':</b> ذَهَبَ - يَذْهَبُ, قَرَأَ - يَقْرَأُ, دَرَسَ - يَدْرُسُ.",vocab:[["أَذْهَبُ","saya pergi"],["يَدْرُسُ","dia (lk) belajar"],["يَقْرَأُ","dia (lk) membaca"],["نَكْتُبُ","kami menulis"],["يَذْهَبُونَ","mereka (lk) pergi"]],ex:[["أَنَا أَذْهَبُ إِلَى الْمَدْرَسَةِ","Saya pergi ke sekolah."],["هُمْ يَذْهَبُونَ إِلَى الْمَسْجِدِ","Mereka (lk) pergi ke masjid."],["نَحْنُ نَدْرُسُ الْعَرَبِيَّةَ","Kami belajar bahasa Arab."]],quiz:[q("أَذْهَبُ artinya…",["Saya pergi","Kami pergi","Dia pergi"],0,"Awalan أ = saya."),q("Awalan نـ pada mudhari' berarti…",["Kami","Saya","Mereka"],0,"Awalan ن = kami."),q("يَدْرُسُونَ artinya…",["Mereka (lk) belajar","Dia belajar","Kami belajar"],0,"Akhiran ونَ = mereka laki-laki."),q("تَكْتُبِينَ ditujukan kepada…",["Perempuan","Laki-laki","Banyak orang"],0,"Akhiran ينَ = kamu perempuan."),q("Mudhari' menunjukkan waktu…",["Lampau","Sekarang atau akan datang","Hanya perintah"],1,"Mudhari' = kini atau akan datang.")]},
19:{goal:"Mengenal kata kerja amr (perintah) dan cara membentuknya.",body:"Fi'il amr adalah perintah. Dari mudhari' yang ditujukan kepada lawan bicara (تَكْتُبُ), buang awalan ت dan akhiri dengan sukun; jika awalnya sukun, tambahkan hamzah di depan: اُكْتُبْ (tulislah), اِفْتَحْ (bukalah), اُدْخُلْ (masuklah), اِجْلِسْ (duduklah). Untuk perempuan tambahkan ـِي: اُكْتُبِي.",more:"<b>Harakat hamzah:</b> ikuti huruf ketiga mudhari'. Jika dhammah (يَدْخُلُ) maka اُدْخُلْ, jika fathah atau kasrah (يَفْتَحُ، يَجْلِسُ) maka اِفْتَحْ، اِجْلِسْ.",vocab:[["اُكْتُبْ","tulislah"],["اِقْرَأْ","bacalah"],["اُدْخُلْ","masuklah"],["اِذْهَبْ","pergilah"],["اِجْلِسْ","duduklah"],["اُكْتُبِي","tulislah (untuk perempuan)"]],ex:[["اِقْرَأِ الْكِتَابَ","Bacalah buku itu."],["اُدْخُلِ الْفَصْلَ","Masuklah ke kelas."],["اِجْلِسْ يَا مُحَمَّدُ","Duduklah, wahai Muhammad."]],quiz:[q("Fi'il amr menunjukkan…",["Perintah","Masa lampau","Pertanyaan"],0,"Amr = perintah."),q("اِقْرَأْ artinya…",["Bacalah","Tulislah","Pergilah"],0,"اِقْرَأْ = bacalah."),q("اُدْخُلْ artinya…",["Keluarlah","Masuklah","Duduklah"],1,"اُدْخُلْ = masuklah."),q("اِذْهَبْ artinya…",["Pergilah","Bacalah","Bukalah"],0,"اِذْهَبْ = pergilah."),q("اُكْتُبِي ditujukan kepada…",["Laki-laki","Perempuan","Banyak laki-laki"],1,"Akhiran ـِي = perempuan.")]},
21:{goal:"Memahami arti i'rab dan tiga keadaan dasarnya.",body:"I'rab adalah perubahan harakat akhir kata sesuai kedudukannya dalam kalimat. Ada tiga keadaan dasar: rafa' (dhammah ـُ), nashab (fathah ـَ), dan jar (kasrah ـِ). Contoh pada kata الطَّالِبُ: جَاءَ الطَّالِبُ (rafa'), رَأَيْتُ الطَّالِبَ (nashab), ذَهَبْتُ إِلَى الطَّالِبِ (jar).",more:"<b>Intinya:</b> huruf kata tidak berubah, yang berubah hanya harakat akhirnya. Tidak semua kata berubah dengan cara yang sama; pelajari satu keadaan per satu.",vocab:[["رَفْعٌ","rafa' (dhammah)"],["نَصْبٌ","nashab (fathah)"],["جَرٌّ","jar (kasrah)"],["جَاءَ","telah datang"],["رَأَى","telah melihat"]],ex:[["جَاءَ الطَّالِبُ","Siswa itu datang."],["رَأَيْتُ الطَّالِبَ","Saya melihat siswa itu."],["ذَهَبْتُ إِلَى الطَّالِبِ","Saya pergi kepada siswa itu."]],quiz:[q("I'rab adalah perubahan…",["Harakat akhir kata","Huruf pertama kata","Arti kata"],0,"I'rab = perubahan harakat akhir sesuai kedudukan."),q("Tanda rafa' dasar adalah…",["Dhammah","Fathah","Kasrah"],0,"Rafa' = dhammah."),q("Tanda nashab dasar adalah…",["Dhammah","Fathah","Kasrah"],1,"Nashab = fathah."),q("Tanda jar dasar adalah…",["Dhammah","Fathah","Kasrah"],2,"Jar = kasrah."),q("الطَّالِبَ pada رَأَيْتُ الطَّالِبَ berkeadaan…",["Rafa'","Nashab","Jar"],1,"Sebagai objek, harakatnya fathah (nashab).")]},
22:{goal:"Mengenali kata-kata yang berkeadaan rafa' (marfu'at) dasar.",body:"Yang berkeadaan rafa' pada tahap dasar: mubtada, khabar, dan fa'il. Tanda aslinya dhammah. Pada mutsanna, rafa' ditandai alif (ـَانِ), dan pada jamak mudzakkar salim ditandai wawu (ـُونَ).",more:"<b>Contoh:</b> الْمُعَلِّمُ حَاضِرٌ (mubtada dan khabar rafa'), جَاءَ الْوَلَدُ (fa'il rafa').",vocab:[["حَاضِرٌ","hadir"],["غَائِبٌ","tidak hadir"],["حَاضِرَانِ","dua orang hadir"],["حَاضِرُونَ","mereka (lk) hadir"]],ex:[["الْمُعَلِّمُ حَاضِرٌ","Guru itu hadir."],["الطَّالِبَانِ حَاضِرَانِ","Kedua siswa itu hadir."],["الْمُعَلِّمُونَ حَاضِرُونَ","Para guru itu hadir."]],quiz:[q("Tanda rafa' asli adalah…",["Dhammah","Fathah","Kasrah"],0,"Rafa' = dhammah."),q("Fa'il berkeadaan…",["Rafa'","Nashab","Jar"],0,"Fa'il selalu marfu'."),q("Mubtada dan khabar berkeadaan…",["Rafa'","Nashab","Jar"],0,"Keduanya marfu'."),q("Rafa' pada mutsanna ditandai…",["Alif (ـَانِ)","Ya (ـَيْنِ)","Kasrah"],0,"Mutsanna rafa' dengan alif."),q("Rafa' pada jamak mudzakkar salim ditandai…",["Wawu (ـُونَ)","Ya (ـِينَ)","Fathah"],0,"Jamak mudzakkar salim rafa' dengan wawu.")]},
23:{goal:"Mengenali kata-kata yang berkeadaan nashab (manshubat) dasar.",body:"Pada tahap dasar, yang manshub antara lain maf'ul bih dan isim setelah إِنَّ (sesungguhnya). Tanda aslinya fathah. Pada mutsanna dan jamak mudzakkar salim, nashab ditandai ya (ـَيْنِ dan ـِينَ).",more:"<b>Contoh:</b> قَرَأْتُ الْكِتَابَ (maf'ul bih manshub), إِنَّ الْعِلْمَ نُورٌ (الْعِلْمَ manshub, khabarnya نُورٌ tetap rafa').",vocab:[["إِنَّ","sesungguhnya"],["عِلْمٌ","ilmu"],["نُورٌ","cahaya"],["مُعَلِّمِينَ","para guru (nashab/jar)"]],ex:[["قَرَأْتُ الْكِتَابَ","Saya telah membaca buku itu."],["إِنَّ الْعِلْمَ نُورٌ","Sesungguhnya ilmu adalah cahaya."],["رَأَيْتُ الْمُعَلِّمِينَ","Saya melihat para guru."]],quiz:[q("Tanda nashab asli adalah…",["Fathah","Dhammah","Kasrah"],0,"Nashab = fathah."),q("Maf'ul bih berkeadaan…",["Nashab","Rafa'","Jar"],0,"Objek = manshub."),q("Isim setelah إِنَّ berkeadaan…",["Nashab","Rafa'","Jar"],0,"Isim إِنَّ manshub."),q("إِنَّ artinya…",["Sesungguhnya","Kemudian","Dan"],0,"إِنَّ = sesungguhnya."),q("Nashab pada jamak mudzakkar salim ditandai…",["Ya (ـِينَ)","Wawu (ـُونَ)","Alif (ـَانِ)"],0,"Nashab dan jar jamak salim dengan ya.")]},
24:{goal:"Mengenali kata-kata yang berkeadaan jar (majrurat) dasar.",body:"Yang majrur pada tahap dasar: isim setelah harf jar (فِي، مِنْ، إِلَى، عَلَى، مَعَ) dan isim kedua dalam susunan kepemilikan (mudhaf ilaih). Tanda aslinya kasrah.",more:"<b>Contoh:</b> فِي الْبَيْتِ (di rumah), كِتَابُ الطَّالِبِ (buku siswa itu). Susunan kedua akan dibahas lebih dalam di Modul 26.",vocab:[["مَعَ","bersama"],["مَجْرُورٌ","berharakat kasrah"],["كِتَابُ الطَّالِبِ","buku siswa itu"]],ex:[["ذَهَبْتُ إِلَى الْمَدْرَسَةِ","Saya pergi ke sekolah."],["جَلَسْتُ مَعَ الْمُعَلِّمِ","Saya duduk bersama guru itu."],["كِتَابُ الطَّالِبِ جَدِيدٌ","Buku siswa itu baru."]],quiz:[q("Isim setelah harf jar berkeadaan…",["Jar","Rafa'","Nashab"],0,"Majrur setelah harf jar."),q("Tanda jar asli adalah…",["Kasrah","Fathah","Dhammah"],0,"Jar = kasrah."),q("مَعَ artinya…",["Bersama","Dari","Ke"],0,"مَعَ = bersama."),q("كِتَابُ الطَّالِبِ artinya…",["Buku siswa itu","Siswa itu membaca","Di buku"],0,"Kata kedua majrur karena kepemilikan."),q("Pada فِي الْبَيْتِ, kata الْبَيْتِ adalah…",["Majrur","Marfu'","Manshub"],0,"Setelah فِي, majrur.")]},
25:{goal:"Memahami na'at (sifat) dan man'ut (yang disifati).",body:"Na'at menerangkan man'ut dan mengikutinya dalam empat hal: harakat i'rab, jenis (mudzakkar/muannats), jumlah, serta ma'rifah/nakirah. Contoh: جَاءَ الطَّالِبُ الْمُجْتَهِدُ (siswa yang rajin datang); رَأَيْتُ الطَّالِبَ الْمُجْتَهِدَ (nashab keduanya).",more:"<b>Bedakan:</b> الطَّالِبُ الْمُجْتَهِدُ = 'siswa yang rajin' (frasa), الطَّالِبُ مُجْتَهِدٌ = 'siswa itu rajin' (kalimat).",vocab:[["نَعْتٌ","sifat"],["مَنْعُوتٌ","yang disifati"],["الْمُجْتَهِدُ","yang rajin"]],ex:[["جَاءَ الطَّالِبُ الْمُجْتَهِدُ","Siswa yang rajin telah datang."],["رَأَيْتُ الطَّالِبَ الْمُجْتَهِدَ","Saya melihat siswa yang rajin."],["ذَهَبْتُ إِلَى الْمَدْرَسَةِ الْكَبِيرَةِ","Saya pergi ke sekolah yang besar."]],quiz:[q("Man'ut adalah…",["Yang disifati","Sifatnya","Kata kerja"],0,"Man'ut = yang disifati."),q("Na'at mengikuti man'ut dalam…",["I'rab, jenis, jumlah, ma'rifah/nakirah","Hanya jenis","Tidak ada"],0,"Empat hal itu."),q("الْبِنْتُ الْمُجْتَهِدَةُ artinya…",["Anak perempuan yang rajin","Anak laki-laki rajin","Guru yang aktif"],0,"Na'at muannats mengikuti man'ut muannats."),q("الطَّالِبُ مُجْتَهِدٌ berarti…",["Siswa itu rajin (kalimat)","Siswa yang rajin (frasa)","Siswa-siswa"],0,"Tanpa ال pada kata kedua = kalimat."),q("Pilih yang benar: رَأَيْتُ الطَّالِبَ ___",["الْمُجْتَهِدَ","الْمُجْتَهِدُ","الْمُجْتَهِدِ"],0,"Mengikuti man'ut yang manshub.")]},
26:{goal:"Memahami idhafah (susunan kepemilikan).",body:"Idhafah terdiri dari mudhaf (kata pertama) dan mudhaf ilaih (kata kedua). Mudhaf tidak bertanwin dan tidak memakai ال, harakat akhirnya mengikuti kedudukannya dalam kalimat. Mudhaf ilaih selalu majrur (kasrah). Contoh: كِتَابُ الطَّالِبِ = buku siswa itu.",more:"<b>Dengan dhamir:</b> كِتَابُهُ (bukunya) juga idhafah; dhamir هُ berfungsi sebagai mudhaf ilaih. <b>Perhatikan:</b> katakan بَيْتُ الْمُعَلِّمِ, bukan الْبَيْتُ الْمُعَلِّمِ.",vocab:[["مُضَافٌ","kata pertama idhafah"],["مُضَافٌ إِلَيْهِ","kata kedua idhafah"],["حَقِيبَةُ الْوَلَدِ","tas anak itu"],["بَابُ الْمَدْرَسَةِ","pintu sekolah"]],ex:[["بَيْتُ الْمُعَلِّمِ كَبِيرٌ","Rumah guru itu besar."],["بَابُ الْمَدْرَسَةِ جَدِيدٌ","Pintu sekolah itu baru."],["حَقِيبَةُ الْوَلَدِ جَدِيدَةٌ","Tas anak itu baru."]],quiz:[q("Idhafah terdiri dari…",["Mudhaf dan mudhaf ilaih","Fi'il dan fa'il","Mubtada dan khabar"],0,"Dua unsur: mudhaf dan mudhaf ilaih."),q("Mudhaf tidak boleh memakai…",["ال dan tanwin","Dhammah","Fathah"],0,"Mudhaf tanpa ال dan tanwin."),q("Mudhaf ilaih berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih selalu majrur."),q("بَابُ الْمَدْرَسَةِ artinya…",["Pintu sekolah","Sekolah besar","Ke sekolah"],0,"Pintu milik sekolah."),q("Pilih yang benar: بَيْتُ ___",["الْمُعَلِّمِ","الْمُعَلِّمُ","الْمُعَلِّمَ"],0,"Mudhaf ilaih majrur (kasrah).")]},
27:{goal:"Mengenal isim maushul (kata sambung 'yang').",body:"Isim maushul menyambung kata dengan keterangan (shilah). Bentuknya menyesuaikan jenis dan jumlah: الَّذِي (yang, mudzakkar), الَّتِي (yang, muannats), الَّذِينَ (yang, jamak mudzakkar), اللَّاتِي (yang, jamak muannats). Setelah isim maushul biasanya ada kalimat sebagai shilah.",more:"<b>Contoh:</b> الطَّالِبُ الَّذِي دَرَسَ (siswa yang belajar). Kata sebelum isim maushul memakai ال (ma'rifah).",vocab:[["الَّذِي","yang (mudzakkar)"],["الَّتِي","yang (muannats)"],["الَّذِينَ","yang (jamak mudzakkar)"],["اللَّاتِي","yang (jamak muannats)"]],ex:[["جَاءَ الطَّالِبُ الَّذِي دَرَسَ","Siswa yang belajar telah datang."],["هٰذِهِ الْبِنْتُ الَّتِي قَرَأَتِ الْكِتَابَ","Ini anak perempuan yang telah membaca buku."],["الطُّلَّابُ الَّذِينَ يَدْرُسُونَ مُجْتَهِدُونَ","Para siswa yang belajar itu rajin."]],quiz:[q("الَّذِي artinya…",["Yang","Ini","Siapa"],0,"الَّذِي = yang."),q("Untuk muannats tunggal digunakan…",["الَّتِي","الَّذِي","الَّذِينَ"],0,"الَّتِي = yang (muannats)."),q("الَّذِينَ digunakan untuk…",["Jamak mudzakkar","Muannats tunggal","Mudzakkar tunggal"],0,"الَّذِينَ = jamak mudzakkar."),q("Setelah isim maushul biasanya ada…",["Shilah (kalimat penjelas)","Huruf jar saja","Tanwin"],0,"Shilah menjelaskan isim maushul."),q("Pilih yang benar: الْمُعَلِّمَةُ ___ جَلَسَتْ",["الَّتِي","الَّذِي","الَّذِينَ"],0,"Guru perempuan memakai الَّتِي.")]},
28:{goal:"Membedakan fi'il lazim dan fi'il muta'addi.",body:"Fi'il lazim tidak membutuhkan objek: جَلَسَ (duduk), ذَهَبَ (pergi), نَامَ (tidur), حَضَرَ (hadir). Fi'il muta'addi membutuhkan objek (maf'ul bih): كَتَبَ الدَّرْسَ, قَرَأَ الْكِتَابَ, فَتَحَ الْبَابَ.",more:"<b>Tips:</b> tanyakan 'melakukan apa?'. Jika jawabannya ada (menulis apa? menulis pelajaran), fi'il itu muta'addi. Beberapa fi'il bisa lazim dengan harf jar, misalnya ذَهَبَ إِلَى.",vocab:[["نَامَ","telah tidur"],["حَضَرَ","telah hadir"],["لَازِمٌ","tidak butuh objek"],["مُتَعَدٍّ","butuh objek"]],ex:[["نَامَ الْوَلَدُ","Anak itu telah tidur."],["فَتَحَ الْوَلَدُ الْبَابَ","Anak itu membuka pintu."],["ذَهَبَ الطَّالِبُ إِلَى الْمَدْرَسَةِ","Siswa itu pergi ke sekolah."]],quiz:[q("Fi'il lazim adalah fi'il yang…",["Tidak butuh objek","Butuh objek","Selalu perintah"],0,"Lazim tidak membutuhkan maf'ul bih."),q("نَامَ termasuk…",["Lazim","Muta'addi","Amr"],0,"Tidur tidak butuh objek."),q("كَتَبَ termasuk…",["Muta'addi","Lazim","Isim"],0,"Menulis butuh objek."),q("فَتَحَ membutuhkan…",["Maf'ul bih","Khabar","Na'at"],0,"Membuka sesuatu = ada objek."),q("جَلَسَ artinya…",["Duduk","Membuka","Membaca"],0,"جَلَسَ = duduk (lazim).")]},
29:{goal:"Mengenal sharaf (perubahan bentuk kata) dan wazan dasar.",body:"Sharaf mempelajari perubahan bentuk kata dari satu akar. Akar ك-ت-ب membentuk banyak kata dengan pola (wazan) berbeda: كَاتِبٌ (penulis, pola فَاعِلٌ), مَكْتُوبٌ (yang ditulis, pola مَفْعُولٌ), مَكْتَبٌ (tempat menulis, pola مَفْعَلٌ).",more:"<b>Contoh pola فَاعِلٌ:</b> قَارِئٌ (pembaca), ذَاهِبٌ (yang pergi), دَارِسٌ (yang belajar).",vocab:[["كَاتِبٌ","penulis"],["مَكْتُوبٌ","yang ditulis"],["مَكْتَبٌ","tempat menulis / meja tulis / kantor"],["قَارِئٌ","pembaca"],["ذَاهِبٌ","yang pergi"]],ex:[["الْكَاتِبُ فِي الْمَكْتَبِ","Penulis itu ada di kantor."],["الْدَّرْسُ مَكْتُوبٌ","Pelajaran itu tertulis."],["الْقَارِئُ مُجْتَهِدٌ","Pembaca itu rajin."]],quiz:[q("Sharaf mempelajari…",["Perubahan bentuk kata","Harakat akhir kalimat","Tanda baca"],0,"Sharaf = bentuk kata; nahwu = harakat akhir."),q("كَاتِبٌ artinya…",["Penulis","Yang ditulis","Tempat menulis"],0,"كَاتِبٌ = penulis."),q("مَكْتُوبٌ artinya…",["Yang ditulis","Penulis","Menulis"],0,"Pola مَفْعُولٌ = objek."),q("Akar kata dari كَاتِبٌ adalah…",["ك-ت-ب","ق-ر-أ","د-ر-س"],0,"Akar ك-ت-ب."),q("قَارِئٌ artinya…",["Pembaca","Yang dibaca","Penulis"],0,"قَارِئٌ = pembaca.")]},
30:{goal:"Melihat satu akar kata berubah menjadi beberapa bentuk.",body:"Satu akar bisa menghasilkan bentuk madhi, mudhari', amr, isim fa'il (pelaku), isim maf'ul (objek), dan mashdar (kata benda perbuatan). Dari akar ك-ت-ب: كَتَبَ, يَكْتُبُ, اُكْتُبْ, كَاتِبٌ, مَكْتُوبٌ, كِتَابَةٌ (kegiatan menulis).",more:"<b>Contoh akar د-ر-س:</b> دَرَسَ, يَدْرُسُ, اُدْرُسْ, دَارِسٌ, مَدْرُوسٌ, دِرَاسَةٌ.",vocab:[["كِتَابَةٌ","menulis (kegiatan)"],["دِرَاسَةٌ","belajar (kegiatan)"],["مَصْدَرٌ","kata benda perbuatan"],["مُفِيدٌ","bermanfaat"],["مُهِمٌّ","penting"]],ex:[["الْكِتَابَةُ مُفِيدَةٌ","Menulis itu bermanfaat."],["الدِّرَاسَةُ مُهِمَّةٌ","Belajar itu penting."],["الطَّالِبُ كَاتِبٌ","Siswa itu seorang penulis."]],quiz:[q("كِتَابَةٌ termasuk…",["Mashdar","Isim fa'il","Fi'il amr"],0,"Mashdar = nama perbuatan."),q("مَكْتُوبٌ termasuk…",["Isim maf'ul","Isim fa'il","Fi'il madhi"],0,"Pola مَفْعُولٌ."),q("كَاتِبٌ termasuk…",["Isim fa'il","Isim maf'ul","Mashdar"],0,"Pola فَاعِلٌ = pelaku."),q("Dari akar د-ر-س, bentuk 'yang belajar' adalah…",["دَارِسٌ","مَدْرُوسٌ","دِرَاسَةٌ"],0,"دَارِسٌ = pelaku belajar."),q("دِرَاسَةٌ artinya…",["Belajar (kegiatan)","Pelajar","Yang dipelajari"],0,"Mashdar = kegiatan belajar.")]},
31:{goal:"Memperkenalkan diri dan menyapa dalam Bahasa Arab.",body:"Percakapan perkenalan diawali salam: السَّلَامُ عَلَيْكُمْ, dijawab وَعَلَيْكُمُ السَّلَامُ. Lalu tanyakan nama (مَا اسْمُكَ؟), asal (مِنْ أَيْنَ أَنْتَ؟), dan kabar (كَيْفَ حَالُكَ؟).",more:"<b>Kepada perempuan:</b> ganti akhiran كَ menjadi كِ, misalnya مَا اسْمُكِ؟, كَيْفَ حَالُكِ؟, مِنْ أَيْنَ أَنْتِ؟",vocab:[["مَرْحَبًا","halo / selamat datang"],["اسْمِي","namaku"],["مِنْ أَيْنَ أَنْتَ؟","kamu (lk) dari mana?"],["كَيْفَ حَالُكَ؟","apa kabarmu (lk)?"],["بِخَيْرٍ","baik-baik saja"]],ex:[["السَّلَامُ عَلَيْكُمْ","Semoga keselamatan atas kalian."],["مَا اسْمُكَ؟ اسْمِي أَحْمَدُ","Siapa namamu? Namaku Ahmad."],["مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنْ إِنْدُونِيسِيَا","Kamu dari mana? Saya dari Indonesia."],["كَيْفَ حَالُكَ؟ أَنَا بِخَيْرٍ","Apa kabarmu? Saya baik-baik saja."]],quiz:[q("Jawaban salam السَّلَامُ عَلَيْكُمْ adalah…",["وَعَلَيْكُمُ السَّلَامُ","مَا اسْمُكَ","كَتَبَ"],0,"Dijawab وَعَلَيْكُمُ السَّلَامُ."),q("مَا اسْمُكَ؟ artinya…",["Siapa namamu?","Kamu dari mana?","Apa kabar?"],0,"مَا = apa, اسْمُكَ = namamu."),q("مِنْ أَيْنَ أَنْتَ؟ artinya…",["Kamu dari mana?","Kamu siapa?","Kamu kapan?"],0,"أَيْنَ = di mana."),q("بِخَيْرٍ artinya…",["Baik-baik saja","Sakit","Besar"],0,"بِخَيْرٍ = baik-baik saja."),q("Kepada perempuan, 'namamu' adalah…",["اسْمُكِ","اسْمُكَ","اسْمُهُ"],0,"Akhiran كِ untuk perempuan.")]},
32:{goal:"Menyebut anggota keluarga dan bagian rumah.",body:"Anggota keluarga: أَبٌ, أُمٌّ, أَخٌ, أُخْتٌ, جَدٌّ (kakek), جَدَّةٌ (nenek). Bagian rumah: غُرْفَةٌ (kamar), مَطْبَخٌ (dapur), حَدِيقَةٌ (taman). Untuk 'milikku', tambahkan ِي: أَبِي, أُمِّي, أَخِي, أُخْتِي.",more:"<b>Pola kalimat:</b> orang + فِي + tempat, misalnya أُمِّي فِي الْمَطْبَخِ.",vocab:[["أُسْرَةٌ","keluarga"],["جَدٌّ","kakek"],["جَدَّةٌ","nenek"],["غُرْفَةٌ","kamar"],["مَطْبَخٌ","dapur"],["حَدِيقَةٌ","taman"]],ex:[["أُمِّي فِي الْمَطْبَخِ","Ibuku di dapur."],["جَدِّي فِي الْحَدِيقَةِ","Kakekku di taman."],["هٰذِهِ غُرْفَتِي","Ini kamarku."]],quiz:[q("جَدٌّ artinya…",["Kakek","Nenek","Ayah"],0,"جَدٌّ = kakek."),q("مَطْبَخٌ artinya…",["Dapur","Kamar","Taman"],0,"مَطْبَخٌ = dapur."),q("أُمِّي artinya…",["Ibuku","Ibumu","Ibunya"],0,"ِي = milikku."),q("غُرْفَةٌ artinya…",["Kamar","Rumah","Pintu"],0,"غُرْفَةٌ = kamar."),q("جَدَّةٌ artinya…",["Nenek","Kakek","Ibu"],0,"جَدَّةٌ = nenek.")]},
33:{goal:"Menyebut tempat dan benda di sekolah dan pesantren.",body:"Kosakata: مَعْهَدٌ (pesantren/institut), فَصْلٌ (kelas), سَبُّورَةٌ (papan tulis), مَكْتَبَةٌ (perpustakaan), مَسْجِدٌ (masjid), دَرْسٌ (pelajaran). Perhatikan مَكْتَبٌ (meja/kantor) dan مَكْتَبَةٌ (perpustakaan) mirip tetapi artinya berbeda.",more:"<b>Pola yang berguna:</b> أَدْرُسُ فِي + tempat (saya belajar di ...), أَنَا طَالِبٌ فِي + tempat.",vocab:[["مَعْهَدٌ","pesantren / institut"],["فَصْلٌ","kelas"],["سَبُّورَةٌ","papan tulis"],["مَكْتَبَةٌ","perpustakaan"],["دَرْسٌ","pelajaran"]],ex:[["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."],["الْمَكْتَبَةُ كَبِيرَةٌ","Perpustakaan itu besar."],["الطُّلَّابُ فِي الْفَصْلِ","Para siswa ada di kelas."]],quiz:[q("مَكْتَبَةٌ artinya…",["Perpustakaan","Meja tulis","Papan tulis"],0,"مَكْتَبَةٌ = perpustakaan."),q("فَصْلٌ artinya…",["Kelas","Pesantren","Masjid"],0,"فَصْلٌ = kelas."),q("سَبُّورَةٌ artinya…",["Papan tulis","Pensil","Buku"],0,"سَبُّورَةٌ = papan tulis."),q("أَدْرُسُ فِي الْمَعْهَدِ artinya…",["Saya belajar di pesantren","Saya pergi ke pasar","Dia membaca buku"],0,"أَدْرُسُ = saya belajar."),q("دَرْسٌ artinya…",["Pelajaran","Kelas","Guru"],0,"دَرْسٌ = pelajaran.")]},
34:{goal:"Menyebut waktu dan kegiatan sehari-hari.",body:"Waktu: صَبَاحٌ (pagi), ظُهْرٌ (siang), مَسَاءٌ (sore), لَيْلٌ (malam), يَوْمٌ (hari). Kegiatan: أَذْهَبُ (saya pergi), أَدْرُسُ (saya belajar), أَنَامُ (saya tidur). Gunakan فِي untuk 'pada': فِي الصَّبَاحِ (pada pagi hari).",more:"<b>Menanyakan jam:</b> كَمِ السَّاعَةُ؟ (jam berapa?). Jawab: السَّاعَةُ الْوَاحِدَةُ (jam satu), السَّاعَةُ الثَّانِيَةُ (jam dua).",vocab:[["صَبَاحٌ","pagi"],["مَسَاءٌ","sore"],["لَيْلٌ","malam"],["يَوْمٌ","hari"],["أَنَامُ","saya tidur"]],ex:[["أَذْهَبُ إِلَى الْمَدْرَسَةِ فِي الصَّبَاحِ","Saya pergi ke sekolah pada pagi hari."],["أَدْرُسُ فِي الْمَسَاءِ","Saya belajar pada sore hari."],["أَنَامُ فِي اللَّيْلِ","Saya tidur pada malam hari."]],quiz:[q("صَبَاحٌ artinya…",["Pagi","Malam","Siang"],0,"صَبَاحٌ = pagi."),q("لَيْلٌ artinya…",["Malam","Pagi","Hari"],0,"لَيْلٌ = malam."),q("أَنَامُ artinya…",["Saya tidur","Saya makan","Saya pergi"],0,"أَنَامُ = saya tidur."),q("كَمِ السَّاعَةُ؟ artinya…",["Jam berapa?","Di mana?","Siapa?"],0,"كَمِ السَّاعَةُ = jam berapa."),q("فِي الصَّبَاحِ artinya…",["Pada pagi hari","Dari pagi","Ke pagi"],0,"فِي = pada/di.")]},
35:{goal:"Berbelanja dan menawar dengan kalimat sederhana.",body:"Kosakata pasar: سُوقٌ (pasar), بَائِعٌ (penjual), ثَمَنٌ (harga), رَخِيصٌ (murah), غَالٍ (mahal). Ungkapan: بِكَمْ هٰذَا؟ (berapa harga ini?), أُرِيدُ (saya ingin), خُذْ (ambillah).",more:"<b>Contoh dialog:</b> pembeli: بِكَمْ هٰذَا الْكِتَابُ؟ penjual menjawab dengan harga, lalu pembeli: هٰذَا غَالٍ أو هٰذَا رَخِيصٌ.",vocab:[["سُوقٌ","pasar"],["بَائِعٌ","penjual"],["ثَمَنٌ","harga"],["رَخِيصٌ","murah"],["غَالٍ","mahal"],["أُرِيدُ","saya ingin"]],ex:[["بِكَمْ هٰذَا الْكِتَابُ؟","Berapa harga buku ini?"],["هٰذَا رَخِيصٌ","Ini murah."],["أُرِيدُ قَلَمًا","Saya ingin sebuah pena."]],quiz:[q("بِكَمْ هٰذَا؟ artinya…",["Berapa harga ini?","Ini apa?","Ini milik siapa?"],0,"بِكَمْ = dengan harga berapa."),q("رَخِيصٌ artinya…",["Murah","Mahal","Besar"],0,"رَخِيصٌ = murah."),q("غَالٍ artinya…",["Mahal","Murah","Baru"],0,"غَالٍ = mahal."),q("أُرِيدُ artinya…",["Saya ingin","Saya pergi","Saya tahu"],0,"أُرِيدُ = saya ingin."),q("سُوقٌ artinya…",["Pasar","Sekolah","Rumah"],0,"سُوقٌ = pasar.")]},
36:{goal:"Menyebut makanan dan minuman serta kegiatan makan dan minum.",body:"Kosakata: طَعَامٌ (makanan), شَرَابٌ (minuman), خُبْزٌ (roti), لَحْمٌ (daging), سَمَكٌ (ikan), فَاكِهَةٌ (buah), حَلِيبٌ (susu), شَايٌ (teh). Kata kerja: أَكَلَ - أَنَا آكُلُ (saya makan), شَرِبَ - أَنَا أَشْرَبُ (saya minum).",more:"<b>Pola:</b> pelaku + fi'il mudhari' + objek manshub, misalnya هُوَ يَأْكُلُ الْخُبْزَ (dia makan roti). <b>Meminta:</b> أُرِيدُ كُوبًا مِنَ الشَّايِ (saya ingin segelas teh).",vocab:[["طَعَامٌ","makanan"],["شَرَابٌ","minuman"],["خُبْزٌ","roti"],["سَمَكٌ","ikan"],["حَلِيبٌ","susu"],["كُوبٌ","gelas"]],ex:[["أَنَا أَشْرَبُ الْمَاءَ","Saya minum air."],["هُوَ يَأْكُلُ الْخُبْزَ","Dia makan roti."],["أُرِيدُ كُوبًا مِنَ الشَّايِ","Saya ingin segelas teh."]],quiz:[q("خُبْزٌ artinya…",["Roti","Ikan","Susu"],0,"خُبْزٌ = roti."),q("سَمَكٌ artinya…",["Ikan","Daging","Buah"],0,"سَمَكٌ = ikan."),q("أَشْرَبُ artinya…",["Saya minum","Saya makan","Saya tidur"],0,"أَشْرَبُ = saya minum."),q("يَأْكُلُ artinya…",["Dia (lk) makan","Saya makan","Kami makan"],0,"Awalan ي = dia laki-laki."),q("حَلِيبٌ artinya…",["Susu","Teh","Air"],0,"حَلِيبٌ = susu.")]},
37:{goal:"Menyebut hal tentang kesehatan dan kebersihan.",body:"Kosakata: صِحَّةٌ (kesehatan), مَرِيضٌ (sakit), طَبِيبٌ (dokter), دَوَاءٌ (obat), نَظِيفٌ (bersih), وَسِخٌ (kotor). Kata penghubung waktu: قَبْلَ (sebelum), بَعْدَ (sesudah); kata sesudahnya majrur.",more:"<b>Contoh kebiasaan:</b> أَغْسِلُ الْيَدَيْنِ قَبْلَ الْأَكْلِ (saya mencuci kedua tangan sebelum makan).",vocab:[["مَرِيضٌ","sakit"],["طَبِيبٌ","dokter"],["دَوَاءٌ","obat"],["نَظِيفٌ","bersih"],["قَبْلَ","sebelum"],["بَعْدَ","sesudah"]],ex:[["أَنَا مَرِيضٌ","Saya sakit."],["الْبَيْتُ نَظِيفٌ","Rumah itu bersih."],["أَغْسِلُ الْيَدَيْنِ قَبْلَ الْأَكْلِ","Saya mencuci kedua tangan sebelum makan."]],quiz:[q("مَرِيضٌ artinya…",["Sakit","Sehat","Bersih"],0,"مَرِيضٌ = sakit."),q("طَبِيبٌ artinya…",["Dokter","Guru","Penjual"],0,"طَبِيبٌ = dokter."),q("نَظِيفٌ artinya…",["Bersih","Kotor","Murah"],0,"نَظِيفٌ = bersih."),q("قَبْلَ artinya…",["Sebelum","Sesudah","Bersama"],0,"قَبْلَ = sebelum."),q("دَوَاءٌ artinya…",["Obat","Air","Makanan"],0,"دَوَاءٌ = obat.")]},
38:{goal:"Menanyakan tempat dan arah dalam perjalanan.",body:"Kosakata: سَفَرٌ (perjalanan), مَطَارٌ (bandara), مَحَطَّةٌ (stasiun), سَيَّارَةٌ (mobil), حَافِلَةٌ (bus), قِطَارٌ (kereta), طَرِيقٌ (jalan), يَمِينٌ (kanan), يَسَارٌ (kiri). Gunakan أَيْنَ untuk menanyakan tempat dan بِ untuk 'dengan' kendaraan.",more:"<b>Contoh:</b> أَذْهَبُ بِالْقِطَارِ (saya pergi naik kereta), اِذْهَبْ إِلَى الْيَمِينِ (pergilah ke kanan).",vocab:[["مَطَارٌ","bandara"],["مَحَطَّةٌ","stasiun"],["قِطَارٌ","kereta"],["طَرِيقٌ","jalan"],["يَمِينٌ","kanan"],["يَسَارٌ","kiri"]],ex:[["أَيْنَ الْمَحَطَّةُ؟","Di mana stasiunnya?"],["أَذْهَبُ بِالْقِطَارِ","Saya pergi naik kereta."],["اِذْهَبْ إِلَى الْيَمِينِ","Pergilah ke kanan."]],quiz:[q("مَطَارٌ artinya…",["Bandara","Stasiun","Pasar"],0,"مَطَارٌ = bandara."),q("قِطَارٌ artinya…",["Kereta","Bus","Mobil"],0,"قِطَارٌ = kereta."),q("يَمِينٌ artinya…",["Kanan","Kiri","Jalan"],0,"يَمِينٌ = kanan."),q("أَيْنَ الْمَحَطَّةُ؟ artinya…",["Di mana stasiunnya?","Kapan kereta tiba?","Siapa penjualnya?"],0,"أَيْنَ = di mana."),q("طَرِيقٌ artinya…",["Jalan","Perjalanan","Bus"],0,"طَرِيقٌ = jalan.")]},
39:{goal:"Mengenal ungkapan adab dan akhlak dalam percakapan.",body:"Ungkapan santun: شُكْرًا (terima kasih), عَفْوًا (sama-sama atau maaf), مِنْ فَضْلِكَ (tolong), لَوْ سَمَحْتَ (permisi). Nilai akhlak: صِدْقٌ (kejujuran), أَمَانَةٌ (amanah), اِحْتِرَامٌ (rasa hormat).",more:"<b>Kepada perempuan:</b> مِنْ فَضْلِكِ dan لَوْ سَمَحْتِ. <b>Contoh kalimat nilai:</b> الصِّدْقُ أَدَبٌ حَسَنٌ.",vocab:[["شُكْرًا","terima kasih"],["مِنْ فَضْلِكَ","tolong"],["صِدْقٌ","kejujuran"],["أَمَانَةٌ","amanah"],["حَسَنٌ","baik"]],ex:[["شُكْرًا لَكَ","Terima kasih untukmu."],["مِنْ فَضْلِكَ، اِفْتَحِ الْبَابَ","Tolong, bukalah pintu."],["الصِّدْقُ أَدَبٌ حَسَنٌ","Kejujuran adalah adab yang baik."]],quiz:[q("شُكْرًا artinya…",["Terima kasih","Tolong","Permisi"],0,"شُكْرًا = terima kasih."),q("مِنْ فَضْلِكَ artinya…",["Tolong","Selamat pagi","Sampai jumpa"],0,"مِنْ فَضْلِكَ = tolong."),q("صِدْقٌ artinya…",["Kejujuran","Amanah","Hormat"],0,"صِدْقٌ = kejujuran."),q("أَمَانَةٌ artinya…",["Amanah","Kejujuran","Hadiah"],0,"أَمَانَةٌ = amanah."),q("حَسَنٌ artinya…",["Baik","Buruk","Besar"],0,"حَسَنٌ = baik.")]},
40:{goal:"Mengenal kosakata dasar ibadah dan kehidupan Muslim.",body:"Kosakata: صَلَاةٌ (shalat), صَوْمٌ (puasa), زَكَاةٌ (zakat), حَجٌّ (haji), وُضُوءٌ (wudhu), مَسْجِدٌ (masjid), الْقُرْآنُ (Al-Qur'an). Kata kerja: أُصَلِّي (saya shalat), أَصُومُ (saya berpuasa), أَقْرَأُ (saya membaca).",more:"<b>Catatan:</b> وُضُوءٌ (dengan dhammah pada و) berarti perbuatan berwudhu. Bagian ini hanya kosakata; hukum dan tata cara ibadah dipelajari kepada guru.",vocab:[["صَلَاةٌ","shalat"],["صَوْمٌ","puasa"],["زَكَاةٌ","zakat"],["وُضُوءٌ","wudhu"],["أُصَلِّي","saya shalat"],["رَمَضَانُ","Ramadhan"]],ex:[["أُصَلِّي فِي الْمَسْجِدِ","Saya shalat di masjid."],["أَقْرَأُ الْقُرْآنَ","Saya membaca Al-Qur'an."],["أَصُومُ فِي رَمَضَانَ","Saya berpuasa di bulan Ramadhan."]],quiz:[q("صَلَاةٌ artinya…",["Shalat","Puasa","Zakat"],0,"صَلَاةٌ = shalat."),q("صَوْمٌ artinya…",["Puasa","Haji","Wudhu"],0,"صَوْمٌ = puasa."),q("زَكَاةٌ artinya…",["Zakat","Shalat","Masjid"],0,"زَكَاةٌ = zakat."),q("أُصَلِّي artinya…",["Saya shalat","Saya puasa","Saya membaca"],0,"أُصَلِّي = saya shalat."),q("وُضُوءٌ artinya…",["Wudhu","Haji","Masjid"],0,"وُضُوءٌ = wudhu.")]},
41:{goal:"Membaca teks Arab pendek dengan urutan yang benar.",body:"Langkah membaca: (1) baca judul (عُنْوَانٌ) dan seluruh teks sekilas, (2) baca kalimat per kalimat dengan harakat, (3) tandai kata yang belum dikenal, (4) pahami isi tiap kalimat. Teks latihan di bawah terdiri dari tiga kalimat tentang Ahmad.",more:"<b>Teks:</b> هٰذَا أَحْمَدُ. هُوَ طَالِبٌ فِي الْمَعْهَدِ. يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ.",vocab:[["نَصٌّْ","teks"],["عُنْوَانٌ","judul"],["فِقْرَةٌ","paragraf"],["الْعَرَبِيَّةُ","bahasa Arab"]],ex:[["هٰذَا أَحْمَدُ","Ini Ahmad."],["هُوَ طَالِبٌ فِي الْمَعْهَدِ","Dia seorang siswa di pesantren."],["يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ","Dia belajar bahasa Arab pada pagi hari."]],quiz:[q("عُنْوَانٌ artinya…",["Judul","Paragraf","Kalimat"],0,"عُنْوَانٌ = judul."),q("فِقْرَةٌ artinya…",["Paragraf","Judul","Huruf"],0,"فِقْرَةٌ = paragraf."),q("هُوَ طَالِبٌ فِي الْمَعْهَدِ — Ahmad adalah…",["Siswa di pesantren","Guru di sekolah","Penjual di pasar"],0,"طَالِبٌ = siswa."),q("يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ — Ahmad belajar pada…",["Pagi hari","Malam hari","Sore hari"],0,"الصَّبَاح = pagi."),q("Langkah pertama membaca teks adalah…",["Membaca judul dan teks sekilas","Langsung menerjemahkan semua","Menghafal semua kata"],0,"Mulai dengan gambaran umum.")]},
42:{goal:"Memahami isi bacaan dengan menjawab pertanyaan tentang teks.",body:"Setelah membaca, temukan jawaban dengan kata tanya: مَنْ (siapa), مَاذَا (apa), أَيْنَ (di mana), مَتَى (kapan). Cari kata kuncinya di dalam teks, lalu jawab dengan kalimat sendiri.",more:"<b>Teks:</b> فَاطِمَةُ طَالِبَةٌ مُجْتَهِدَةٌ. تَذْهَبُ إِلَى الْمَكْتَبَةِ بَعْدَ الظُّهْرِ. تَقْرَأُ كِتَابًا جَدِيدًا.",vocab:[["تَذْهَبُ","dia (pr) pergi"],["تَقْرَأُ","dia (pr) membaca"],["الظُّهْرُ","waktu zhuhur / siang"],["مَاذَا","apa"]],ex:[["فَاطِمَةُ طَالِبَةٌ مُجْتَهِدَةٌ","Fatimah seorang siswi yang rajin."],["تَذْهَبُ إِلَى الْمَكْتَبَةِ بَعْدَ الظُّهْرِ","Dia pergi ke perpustakaan sesudah zhuhur."],["تَقْرَأُ كِتَابًا جَدِيدًا","Dia membaca sebuah buku baru."]],quiz:[q("تَذْهَبُ إِلَى الْمَكْتَبَةِ — Fatimah pergi ke…",["Perpustakaan","Pasar","Masjid"],0,"الْمَكْتَبَة = perpustakaan."),q("كِتَابًا جَدِيدًا artinya…",["Buku baru","Buku besar","Buku lama"],0,"جَدِيدًا = baru."),q("بَعْدَ الظُّهْرِ artinya…",["Sesudah zhuhur","Sebelum zhuhur","Pada malam"],0,"بَعْدَ = sesudah."),q("Kata tanya untuk menemukan pelaku adalah…",["مَنْ","أَيْنَ","مَتَى"],0,"مَنْ = siapa."),q("مُجْتَهِدَةٌ menjelaskan Fatimah sebagai…",["Rajin","Sakit","Besar"],0,"مُجْتَهِدَةٌ = rajin.")]},
43:{goal:"Menerjemahkan kalimat Arab sederhana ke bahasa Indonesia.",body:"Langkah: (1) cari fi'il dan fa'il, (2) cari maf'ul bih, (3) terjemahkan keterangan tempat dan waktu, (4) rapikan menjadi kalimat Indonesia yang wajar. Jangan menerjemahkan kata demi kata jika hasilnya janggal.",more:"<b>Contoh pembedahan:</b> قَرَأَ (fi'il) الطَّالِبُ (fa'il) الْكِتَابَ (maf'ul) فِي الْمَكْتَبَةِ (tempat).",vocab:[["تَرْجَمَةٌ","terjemahan"],["مَعْنَى","makna"]],ex:[["قَرَأَ الطَّالِبُ الْكِتَابَ فِي الْمَكْتَبَةِ","Siswa itu membaca buku di perpustakaan."],["ذَهَبَ الْوَلَدُ إِلَى الْبَيْتِ","Anak itu pergi ke rumah."]],quiz:[q("قَرَأَ الطَّالِبُ الْكِتَابَ artinya…",["Siswa itu membaca buku","Siswa itu menulis buku","Buku itu membaca siswa"],0,"Fi'il قَرَأَ = membaca."),q("ذَهَبَ الْوَلَدُ إِلَى الْبَيْتِ artinya…",["Anak itu pergi ke rumah","Anak itu keluar dari rumah","Rumah itu pergi"],0,"إِلَى = ke."),q("Langkah pertama menerjemahkan kalimat Arab adalah…",["Mencari fi'il dan fa'il","Menghafal semua kata","Menghapus harakat"],0,"Mulai dari inti kalimat."),q("أُصَلِّي فِي الْمَسْجِدِ artinya…",["Saya shalat di masjid","Saya pergi ke masjid","Saya membaca di masjid"],0,"أُصَلِّي = saya shalat."),q("أُمِّي فِي الْمَطْبَخِ artinya…",["Ibuku di dapur","Ayahku di kamar","Ibuku di taman"],0,"مَطْبَخٌ = dapur.")]},
44:{goal:"Menerjemahkan kalimat Indonesia sederhana ke bahasa Arab.",body:"Langkah: (1) tentukan jenis kalimat (ismiyah atau fi'liyah), (2) pilih kosakata yang sudah dikenal, (3) cocokkan jenis dan jumlah, (4) beri harakat akhir yang tepat. Mulailah dari kalimat pendek.",more:"<b>Contoh:</b> 'Saya pergi ke pasar' menjadi أَذْهَبُ إِلَى السُّوقِ. Perhatikan jenis kata: 'rajin' untuk siswi menjadi مُجْتَهِدَةٌ.",vocab:[["أَذْهَبُ إِلَى السُّوقِ","saya pergi ke pasar"],["الطَّالِبَةُ مُجْتَهِدَةٌ","siswi itu rajin"]],ex:[["أَذْهَبُ إِلَى السُّوقِ","Saya pergi ke pasar."],["الْمُعَلِّمُ يَقْرَأُ الْكِتَابَ","Guru itu membaca buku."]],quiz:[q("'Saya pergi ke pasar' dalam bahasa Arab adalah…",["أَذْهَبُ إِلَى السُّوقِ","أَنَامُ فِي السُّوقِ","هُوَ فِي السُّوقِ"],0,"أَذْهَبُ = saya pergi."),q("'Siswi itu rajin' dalam bahasa Arab adalah…",["الطَّالِبَةُ مُجْتَهِدَةٌ","الطَّالِبَةُ مُجْتَهِدٌ","الطَّالِبُ مُجْتَهِدَةٌ"],0,"Subjek dan khabar sama-sama muannats."),q("'Guru itu membaca buku' yang benar…",["الْمُعَلِّمُ يَقْرَأُ الْكِتَابَ","الْمُعَلِّمُ يَقْرَأُ الْكِتَابُ","الْمُعَلِّمُ يَقْرَأُ الْكِتَابِ"],0,"Objek manshub: الْكِتَابَ."),q("Setelah memilih kosakata, langkah berikutnya adalah…",["Mencocokkan jenis dan jumlah","Menghapus harakat","Menerjemahkan kata demi kata"],0,"Cocokkan jenis dan jumlah."),q("'Rumah itu besar' dalam bahasa Arab adalah…",["الْبَيْتُ كَبِيرٌ","الْبَيْتُ كَبِيرَةٌ","بَيْتٌ الْكَبِيرُ"],0,"بَيْتٌ mudzakkar, jadi كَبِيرٌ.")]},
45:{goal:"Menulis paragraf pendek sederhana dalam bahasa Arab.",body:"Paragraf pendek terdiri dari pembuka (memperkenalkan diri atau topik), isi (2-3 kalimat kegiatan), dan penutup. Sambungkan kalimat dengan وَ (dan), ثُمَّ (kemudian), dan لَكِنْ (tetapi). Setelah menulis, periksa jenis, jumlah, harakat akhir, dan ejaan.",more:"<b>Contoh paragraf:</b> أَنَا طَالِبٌ. أَدْرُسُ فِي الْمَعْهَدِ. أَقْرَأُ الْقُرْآنَ فِي الصَّبَاحِ ثُمَّ أَذْهَبُ إِلَى الْفَصْلِ. <b>Latihan:</b> tulis tiga kalimat tentang kegiatanmu sendiri.",vocab:[["لَكِنْ","tetapi"],["ثُمَّ","kemudian"],["وَ","dan"]],ex:[["أَنَا طَالِبٌ","Saya seorang siswa."],["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."],["أَقْرَأُ ثُمَّ أَكْتُبُ","Saya membaca kemudian menulis."]],quiz:[q("ثُمَّ artinya…",["Kemudian","Tetapi","Dan"],0,"ثُمَّ = kemudian."),q("لَكِنْ artinya…",["Tetapi","Karena","Atau"],0,"لَكِنْ = tetapi."),q("Susunan paragraf pendek adalah…",["Pembuka, isi, penutup","Hanya isi","Penutup lalu pembuka"],0,"Pembuka, isi, penutup."),q("Kalimat pembuka untuk memperkenalkan diri adalah…",["أَنَا طَالِبٌ","هُمْ طُلَّابٌ","هِيَ مُعَلِّمَةٌ"],0,"أَنَا = saya."),q("Setelah menulis, yang perlu diperiksa adalah…",["Jenis, jumlah, harakat akhir, ejaan","Hanya jumlah kata","Tidak perlu diperiksa"],0,"Periksa kesesuaian dan ejaan.")]},
46:{goal:"Menulis pesan singkat dalam bahasa Arab.",body:"Pesan singkat terdiri dari salam, isi pesan, dan penutup. Panggil seseorang dengan يَا + nama (يَا أَحْمَدُ). Gunakan kalimat pendek dan kosakata yang sudah dikenal. Penutup yang umum: شُكْرًا dan مَعَ السَّلَامَةِ.",more:"<b>Contoh pesan:</b> السَّلَامُ عَلَيْكُمْ يَا أَحْمَدُ. أَيْنَ أَنْتَ الْآنَ؟ أَنَا فِي الْمَكْتَبَةِ. شُكْرًا.",vocab:[["رِسَالَةٌ","pesan / surat"],["الْآنَ","sekarang"],["يَا","wahai (memanggil)"],["مَعَ السَّلَامَةِ","sampai jumpa"]],ex:[["السَّلَامُ عَلَيْكُمْ يَا أَحْمَدُ","Salam sejahtera, wahai Ahmad."],["أَيْنَ أَنْتَ الْآنَ؟","Kamu di mana sekarang?"],["أَنَا فِي الْمَكْتَبَةِ، شُكْرًا","Saya di perpustakaan, terima kasih."]],quiz:[q("رِسَالَةٌ artinya…",["Pesan","Buku","Kelas"],0,"رِسَالَةٌ = pesan / surat."),q("الْآنَ artinya…",["Sekarang","Besok","Kemarin"],0,"الْآنَ = sekarang."),q("يَا أَحْمَدُ digunakan untuk…",["Memanggil Ahmad","Bertanya tentang Ahmad","Menolak Ahmad"],0,"يَا = wahai (memanggil)."),q("مَعَ السَّلَامَةِ digunakan sebagai…",["Penutup perpisahan","Salam pembuka","Kata tanya"],0,"Dipakai saat berpisah."),q("Susunan pesan singkat yang baik adalah…",["Salam, isi, penutup","Penutup, isi, salam","Hanya isi"],0,"Salam, isi, penutup.")]},
47:{goal:"Melakukan percakapan lanjutan dengan pertanyaan ya atau tidak.",body:"Pertanyaan ya atau tidak diawali هَلْ. Jawabannya نَعَمْ (ya) atau لَا (tidak), lalu ditambah kalimat singkat. Gunakan juga كُلَّ يَوْمٍ (setiap hari) untuk menyatakan kebiasaan.",more:"<b>Dialog:</b> هَلْ أَنْتَ طَالِبٌ؟ — نَعَمْ، أَنَا طَالِبٌ. Untuk menjawab tidak, awali dengan لَا.",vocab:[["هَلْ","apakah"],["نَعَمْ","ya"],["لَا","tidak"],["كُلَّ يَوْمٍ","setiap hari"]],ex:[["هَلْ أَنْتَ طَالِبٌ؟","Apakah kamu seorang siswa?"],["نَعَمْ، أَنَا طَالِبٌ","Ya, saya seorang siswa."],["هَلْ تَدْرُسُ الْعَرَبِيَّةَ كُلَّ يَوْمٍ؟","Apakah kamu belajar bahasa Arab setiap hari?"]],quiz:[q("هَلْ digunakan untuk…",["Pertanyaan ya atau tidak","Menanyakan tempat","Menanyakan harga"],0,"هَلْ = apakah."),q("نَعَمْ artinya…",["Ya","Tidak","Mungkin"],0,"نَعَمْ = ya."),q("لَا artinya…",["Tidak","Ya","Dan"],0,"لَا = tidak."),q("كُلَّ يَوْمٍ artinya…",["Setiap hari","Sepanjang malam","Kemarin"],0,"كُلَّ = setiap."),q("هَلْ أَنْتَ طَالِبٌ؟ artinya…",["Apakah kamu seorang siswa?","Siapa kamu?","Kamu dari mana?"],0,"هَلْ + kalimat = pertanyaan ya atau tidak.")]},
48:{goal:"Memahami teks pendek bertema pendidikan Islam.",body:"Teks pendek bertema pendidikan memakai kosakata yang sudah dipelajari: ilmu, pesantren, guru, adab. Bacalah per kalimat, cari kata kunci, lalu rangkum maknanya dengan kata sendiri.",more:"<b>Teks:</b> الْمَعْهَدُ مَكَانٌ لِطَلَبِ الْعِلْمِ. يَدْرُسُ الطُّلَّابُ الْقُرْآنَ وَالْعَرَبِيَّةَ. يَحْتَرِمُ الطَّالِبُ مُعَلِّمَهُ.",vocab:[["مَكَانٌ","tempat"],["طَلَبُ الْعِلْمِ","menuntut ilmu"],["يَحْتَرِمُ","dia menghormati"],["مُعَلِّمَهُ","gurunya"]],ex:[["الْمَعْهَدُ مَكَانٌ لِطَلَبِ الْعِلْمِ","Pesantren adalah tempat menuntut ilmu."],["يَدْرُسُ الطُّلَّابُ الْقُرْآنَ وَالْعَرَبِيَّةَ","Para siswa belajar Al-Qur'an dan bahasa Arab."],["يَحْتَرِمُ الطَّالِبُ مُعَلِّمَهُ","Siswa itu menghormati gurunya."]],quiz:[q("مَكَانٌ artinya…",["Tempat","Waktu","Guru"],0,"مَكَانٌ = tempat."),q("طَلَبُ الْعِلْمِ artinya…",["Menuntut ilmu","Menulis buku","Membaca teks"],0,"طَلَبٌ = menuntut, عِلْمٌ = ilmu."),q("يَحْتَرِمُ artinya…",["Dia menghormati","Dia membaca","Dia pergi"],0,"يَحْتَرِمُ = menghormati."),q("مُعَلِّمَهُ artinya…",["Gurunya","Gurumu","Guruku"],0,"هُ = nya."),q("Menurut teks, pesantren adalah…",["Tempat menuntut ilmu","Tempat berbelanja","Tempat bermain"],0,"Sesuai kalimat pertama teks.")]},
49:{goal:"Menyusun proyek menulis bahasa Arab pendek.",body:"Proyek ini menggabungkan semua kemampuan. Langkah: (1) pilih topik (misalnya perkenalan diri atau kegiatan harian), (2) buat kerangka, (3) tulis 5 sampai 7 kalimat, (4) periksa jenis, jumlah, dan harakat, (5) bacakan dengan lantang kepada guru atau teman.",more:"<b>Kerangka perkenalan diri:</b> اسْمِي ... أَنَا مِنْ ... أَدْرُسُ فِي ... Ganti titik dengan data Anda sendiri, lalu tambahkan kegiatan sehari-hari.",vocab:[["مَشْرُوعٌ","proyek"],["اسْمِي","namaku"],["أَنَا مِنْ","saya berasal dari"],["أَدْرُسُ فِي","saya belajar di"]],ex:[["اسْمِي أَحْمَدُ","Namaku Ahmad."],["أَنَا مِنْ إِنْدُونِيسِيَا","Saya berasal dari Indonesia."],["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."]],quiz:[q("مَشْرُوعٌ artinya…",["Proyek","Pelajaran","Tempat"],0,"مَشْرُوعٌ = proyek."),q("اسْمِي artinya…",["Namaku","Namamu","Namanya"],0,"ِي = milikku."),q("أَنَا مِنْ إِنْدُونِيسِيَا artinya…",["Saya berasal dari Indonesia","Saya pergi ke Indonesia","Saya di Indonesia"],0,"مِنْ = dari."),q("Langkah pertama proyek menulis adalah…",["Memilih topik","Membacakan hasil","Menghapus harakat"],0,"Mulai dari topik."),q("Sebelum membacakan hasil, kita perlu…",["Memeriksa jenis, jumlah, dan harakat","Menambah banyak kata sulit","Menghapus semua kalimat"],0,"Periksa dulu agar benar.")]},
50:{goal:"Mengukur pemahaman dari seluruh Akademi Bahasa dan memperoleh sertifikat internal.",body:"Ini evaluasi akhir. Kuis modul ini berisi 20 soal campuran dari seluruh tahap, dengan urutan soal dan pilihan jawaban yang diacak setiap kali. Capai nilai minimal 80%. Sertifikat internal terbuka jika Modul 1 sampai 49 sudah ditandai selesai dan nilai kuis Modul 50 minimal 80%. Sertifikat bersifat internal aplikasi, bukan sertifikasi resmi.",more:"<b>Tips:</b> ulangi modul yang terasa sulit sebelum mengerjakan evaluasi.",vocab:[["تَقْيِيمٌ","evaluasi"],["شَهَادَةٌ","sertifikat"]],ex:[["هٰذَا تَقْيِيمٌ نِهَائِيٌّ","Ini evaluasi akhir."]],quiz:[q("أَنَا artinya…",["Saya","Kami","Dia"],0,"أَنَا = saya."),q("الْبَيْتُ كَبِيرٌ termasuk…",["Jumlah ismiyah","Jumlah fi'liyah","Fi'il amr"],0,"Diawali isim."),q("اُكْتُبْ adalah fi'il…",["Amr","Madhi","Mudhari'"],0,"اُكْتُبْ = tulislah."),q("Mudhaf ilaih berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih majrur."),q("'Saya pergi ke sekolah' adalah…",["أَذْهَبُ إِلَى الْمَدْرَسَةِ","هُوَ فِي الْمَدْرَسَةِ","هِيَ تَنَامُ"],0,"أَذْهَبُ = saya pergi.")]},
20:{goal:"Menggabungkan pola yang sudah dipelajari untuk membuat kalimat.",body:"Gunakan pola fi'il + fa'il + maf'ul bih + keterangan tempat, atau mubtada + khabar. Sambungkan kalimat dengan وَ (dan) atau ثُمَّ (kemudian). Periksa kesesuaian jenis dan jumlah, lalu bacalah kalimat dengan lantang.",more:"<b>Langkah menyusun:</b> pilih pelaku, pilih fi'il dengan waktu yang tepat, tambahkan objek atau keterangan, lalu periksa harakat akhir.",vocab:[["وَ","dan"],["ثُمَّ","kemudian"],["نَعَمْ","ya"],["لَا","tidak"]],ex:[["دَخَلَ الْمُعَلِّمُ الْفَصْلَ ثُمَّ جَلَسَ","Guru itu masuk kelas kemudian duduk."],["الطَّالِبَةُ تَكْتُبُ الدَّرْسَ وَالْوَلَدُ يَقْرَأُ","Siswi itu menulis pelajaran dan anak itu membaca."],["قَرَأَ الْوَلَدُ الْكِتَابَ فِي الْفَصْلِ","Anak itu membaca buku di kelas."]],quiz:[q("ثُمَّ artinya…",["Kemudian","Dan","Tidak"],0,"ثُمَّ = kemudian."),q("نَعَمْ artinya…",["Tidak","Ya","Siapa"],1,"نَعَمْ = ya."),q("Urutan dasar jumlah fi'liyah adalah…",["Fi'il + fa'il + maf'ul","Maf'ul + fa'il + fi'il","Khabar + fi'il"],0,"Fi'il, fa'il, lalu maf'ul bih."),q("دَخَلَ الْمُعَلِّمُ الْفَصْلَ artinya…",["Guru itu masuk kelas","Guru itu keluar kelas","Guru itu membuka kelas"],0,"دَخَلَ = masuk."),q("Lengkapi: الطَّالِبَةُ ___ الدَّرْسَ",["يَكْتُبُ","تَكْتُبُ","نَكْتُبُ"],1,"Pelaku perempuan memakai تَكْتُبُ.")]}
};

const REN=["Belajar huruf adalah langkah kecil yang butuh sabar. Luruskan niat sejak awal agar ilmu yang dipelajari membawa kebaikan.","Kosakata sehari-hari mengajak kita memperhatikan sekitar. Sebutkan satu benda di dekatmu dalam bahasa Arab sambil bersyukur atas nikmat yang ada.","Mengenal kata ganti berarti memahami siapa yang diajak bicara. Berbicaralah kepada orang lain dengan hormat sesuai keadaannya.","Setiap benda punya nama, dan mengenal nama berarti mengenal dunia. Belajarlah dengan rendah hati dan jangan merasa cukup dengan yang sudah diketahui.","Perbuatan butuh pelaku dan waktu. Gunakan hari ini untuk satu perbuatan baik, sekecil apa pun.","Menunjuk dengan tepat itu penting, begitu pula menilai dengan adil. Dekat atau jauh, pandanglah sesuatu dengan jujur.","Bertanya adalah pintu ilmu. Jangan malu bertanya kepada guru, dan bertanyalah dengan adab.","Kata depan menghubungkan satu kata dengan kata lain. Jagalah hubungan baikmu dengan keluarga, guru, dan teman.","Setiap sifat punya lawannya, seperti kelebihan dan kekurangan pada diri kita. Perbaiki diri tanpa merendahkan orang lain.","Kalimat sederhana dimulai dari satu kata. Perbaikan diri pun dimulai dari satu kebiasaan baik yang dijaga terus-menerus.","Kalimat yang baik punya pokok dan keterangan. Kenali pokok tujuanmu, lalu lengkapi dengan amal yang sesuai.","Khabar menjelaskan mubtada. Usahakan ucapan dan perbuatanmu sejalan.","Kalimat ini dimulai dari perbuatan. Jangan hanya menunda; mulailah beramal lalu perbaiki sambil berjalan.","Ada pelaku, perbuatan, dan yang dikenai perbuatan. Pikirkan dampak perbuatanmu bagi orang lain.","Satu, dua, dan banyak punya bentuk yang berbeda. Hargailah setiap orang, baik sendiri maupun dalam kelompok.","Laki-laki dan perempuan punya bentuk bahasa masing-masing. Hormati perbedaan dan perlakukan semua orang dengan adab yang baik.","Yang lalu sudah berlalu. Ambil pelajaran darinya, lalu bersyukur dan melangkah dengan perbaikan.","Masa kini dan masa depan adalah kesempatan. Gunakan hari ini sebaik-baiknya tanpa menunda kebaikan.","Perintah yang baik berasal dari niat yang baik. Biasakan mengajak kepada kebaikan dengan kata-kata yang lembut.","Latihan membuat kalimat melatih ketekunan. Ketekunan kecil yang rutin lebih berharga daripada semangat besar yang sebentar.","Harakat akhir berubah menurut kedudukan kata. Belajarlah bersikap luwes sesuai keadaan tanpa meninggalkan prinsip yang benar.","Pokok kalimat harus kuat. Perkuat dasar ilmu dan akhlakmu sebelum mengejar hal-hal yang lebih tinggi.","Objek menerima dampak perbuatan. Latih dirimu menerima nasihat dengan lapang dada.","Kata setelah kata depan mengikuti aturannya. Belajarlah taat pada aturan yang baik dan menjaga adab dalam pergaulan.","Sifat memperindah yang disifati. Hiasi dirimu dengan sifat baik seperti jujur, sabar, dan rendah hati.","Kepemilikan menumbuhkan rasa tanggung jawab. Jagalah amanah yang dititipkan kepadamu, baik benda maupun kepercayaan.","Kata sambung 'yang' menyambungkan keterangan. Sambungkan juga ilmu dengan amal agar bermanfaat.","Ada perbuatan yang berdampak pada orang lain, ada yang tidak. Pilihlah perbuatan yang bermanfaat bagi sekitar.","Dari satu akar tumbuh banyak bentuk. Dari satu niat baik bisa lahir banyak kebaikan.","Satu akar kata berubah menjadi banyak bentuk. Semoga kita pun terus tumbuh menjadi pribadi yang lebih baik tanpa kehilangan akar yang kokoh.","Salam dan perkenalan membuka pintu persaudaraan. Mulailah pertemuan dengan wajah ramah dan sapaan yang baik.","Keluarga adalah tempat belajar adab yang pertama. Muliakan orang tuamu dengan ucapan dan perbuatan.","Pesantren dan sekolah adalah tempat menuntut ilmu. Hormati guru, jaga kebersihan, dan manfaatkan waktu belajar.","Waktu terus berjalan. Atur harianmu agar ada waktu untuk ibadah, belajar, dan istirahat.","Dalam jual beli, kejujuran sangat penting. Latih dirimu berkata benar dan tidak menipu.","Makan dan minum adalah nikmat. Mulailah dengan doa, makanlah secukupnya, dan syukuri rezeki.","Menjaga kebersihan dan kesehatan adalah bagian dari merawat nikmat. Biasakan hidup bersih dan teratur.","Setiap perjalanan butuh persiapan dan doa. Niatkan perjalananmu untuk kebaikan dan jagalah adab di jalan.","Akhlak yang baik terlihat dalam ucapan sehari-hari. Biasakan mengucapkan terima kasih, tolong, dan maaf.","Ibadah menjadi pusat kehidupan seorang Muslim. Perbaiki kualitas ibadahmu dan pelajari hukum-hukumnya dari guru yang terpercaya.","Membaca membuka wawasan. Bacalah dengan tenang, pelan-pelan, dan penuh perhatian.","Memahami berarti menyimak dengan sungguh-sungguh. Latih dirimu mendengarkan orang lain sebelum menjawab.","Menerjemahkan butuh ketelitian dan kejujuran. Sampaikan makna apa adanya tanpa menambah atau mengurangi.","Menyampaikan maksud dengan tepat adalah seni. Pilih kata yang baik dan jelas agar tidak menimbulkan salah paham.","Menulis melatih pikiran agar teratur. Tulislah hal-hal yang bermanfaat dan jauhi tulisan yang menyakiti.","Pesan yang sopan menjaga hubungan. Sebelum mengirim pesan, periksa isi dan adabnya.","Percakapan yang baik adalah yang saling mendengar. Jadilah pendengar yang baik sebelum menjadi pembicara.","Ilmu butuh adab. Hormati guru dan sumber ilmu, dan jangan merasa lebih pintar dari mereka.","Proyek yang selesai lahir dari konsistensi. Tetapkan target kecil setiap hari dan selesaikan sampai tuntas.","Evaluasi bukan akhir, melainkan awal perbaikan. Syukuri yang sudah dicapai, lalu teruslah belajar dan amalkan ilmu yang bermanfaat."];

const $=s=>document.querySelector(s),app=$("#app");
const today=()=>new Date().toISOString().slice(0,10);

function bumpDay(){if(S.day.d!==today())S.day={d:today(),n:0};S.day.n++}

function render(){
 $("#nav").innerHTML=menu.map(m=>`<button class="${view===m[0]||(view==='mod'&&m[0]==='akademi')||(view==='rtheme'&&m[0]==='renungan')?'on':''}" onclick="go('${m[0]}')">${m[1]}<br>${m[2]}</button>`).join("");
 const f={home,akademi,mod,lab,arena,kolab,peta,set,quiz,latihan,cert,renungan,rtheme}[view];app.innerHTML=f();if(view==="lab")labInit();const on=document.querySelector('#nav button.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
function home(){
 const p=Math.round(doneN()/50*100),ls=Object.values(S.scores).slice(-1)[0],h=new Date().getHours(),sal=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
 return `<div class="card"><h2>${sal}, Pelajar! 👋</h2><p>Mari belajar Bahasa Arab langkah demi langkah.</p><button class="gold" style="width:100%" onclick="go('mod',${S.last||1})">MULAI BELAJAR</button></div>

 <div class="card"><b>Target harian:</b> ${Math.min(S.day.d===today()?S.day.n:0,S.goal)}/${S.goal} aktivitas<div class="bar"><i style="width:${Math.min(100,(S.day.d===today()?S.day.n:0)/S.goal*100)}%"></i></div></div>
 <div class="card"><b>Materi terakhir:</b> ${S.last?`Modul ${S.last} — ${TITLES[S.last-1]}<br><button onclick="go('mod',${S.last})">Lanjutkan</button>`:"Belum ada."}</div>

function akademi(){
 const m=qry.toLowerCase();let out=`<div class="card"><input id="s" placeholder="🔍 Cari materi atau kosakata…" value="${qry}" oninput="qry=this.value;render();document.getElementById('s').focus()"></div>`;
 if(m){const hits=[];for(const k in C)if(C[k].vocab)C[k].vocab.forEach(v=>{if(v[0].includes(qry)||v[1].toLowerCase().includes(m))hits.push(`<div class="v"><span class="ar">${v[0]}</span><span>${v[1]} · M${k}</span></div>`)});
  out+=`<div class="card"><h3>Kamus & hasil</h3>${hits.join("")||"Tidak ditemukan."}</div>`}
 TITLES.forEach((t,i)=>{if(i%10===0&&i<40&&!m)out+=`<h3>${STAGES[i/10|0]}</h3>`;if(m&&!t.toLowerCase().includes(m))return;const n=i+1;
  out+=`<div class="card v" onclick="go('mod',${n})"><span>${S.done[n]?"✅":"⭕"} <b>Modul ${n}</b>: ${t}${C[n]?"":' <span class="tag">segera diisi</span>'}</span><span>${S.fav[n]?"⭐":""}</span></div>`});
 return out}
function mod(){
 const n=cur,c=C[n];if(!S.last||S.last!==n){S.last=n;save()}
 let h=`<div class="card"><button class="alt" onclick="go('home')">← Dashboard</button> <button class="alt" onclick="go('akademi')">Daftar</button><h2>Modul ${n}: ${TITLES[n-1]}</h2><small>Pilih materi (1-50):</small><select onchange="go('mod',+this.value)">${TITLES.map((t,i)=>`<option value="${i+1}" ${i+1===n?'selected':''}>#${i+1} ${t}</option>`).join('')}</select><a class="btnlink" target="_blank" rel="noopener" href="${waModUrl(n)}">📲 Kirim materi ke WhatsApp</a> <button class="alt" onclick="copyShare('mod',${n})">📋 Salin materi</button><div id="shbox"></div><span class="tag">${STAGES[Math.min(3,(n-1)/10|0)]}</span></div>`;
 if(!c)h+=`<div class="card">Modul ini masih berupa kerangka. Isi akan ditambahkan dan <b>perlu ditinjau guru</b> sebelum dipakai.<br>Struktur yang akan diisi: tujuan, materi, kosakata, contoh, latihan, 5 kuis.</div>`;
 else h+=`<div class="card"><h3>🎯 Tujuan</h3>${c.goal}</div><div class="card"><h3>📖 Materi</h3>${c.body}${c.more?'<p style="line-height:2">'+wrapAr(c.more)+'</p>':''}<p><span class="tag">Materi awal — mohon ditinjau guru bahasa Arab</span></p></div>
 <div class="card"><h3>🔤 Bedah Kosakata</h3><small>Tulisan Latin dibuat otomatis, mohon ditinjau guru.</small>${c.vocab.map(v=>`<div class="v" style="display:block;padding:8px 0"><div class="ar" style="font-size:1.8em">${v[0]}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span><i>${tl(v[0])}</i> — <b>${v[1]}</b></span><span><button class="alt" style="min-height:40px;padding:4px 12px" onclick="say('${v[0]}')" aria-label="Dengarkan">🔊</button> <button class="alt" style="min-height:40px;padding:4px 12px" onclick="cp('${v[0]}')">Salin</button></span></div></div>`).join("")}</div>
 <div class="card"><h3>💬 Contoh Kalimat</h3>${c.ex.map(v=>`<div class="ar">${v[0]}</div><div>${v[1]} <button class="alt" style="min-height:40px;padding:4px 12px" onclick="say('${v[0]}')" aria-label="Dengarkan">🔊</button></div>`).join("")}</div>
 <div class="card"><h3>✍️ Latihan</h3>Baca contoh di atas dengan lantang, lalu coba tulis ulang satu kosakata dengan harakat.<br><button onclick="startQuiz(${n})">Mulai Kuis (${c.quiz.length} soal)</button><br><b>Latihan tambahan:</b><br><button class="alt" onclick="startP(${n},'cocok')">Cocokkan</button> <button class="alt" onclick="startP(${n},'susun')">Susun Kalimat</button> <button class="alt" onclick="startP(${n},'ketik')">Ketik Arti</button></div>`;
 h+=`<div class="card row"><button class="alt" ${n<2?"disabled":""} onclick="go('mod',${n-1})">← Sebelumnya</button><button class="alt" onclick="fav(${n})">${S.fav[n]?"⭐ Favorit":"☆ Favorit"}</button><button class="alt" ${n>49?"disabled":""} onclick="go('mod',${n+1})">Berikutnya →</button></div>
 <div class="card" style="background:#eaf6f0"><h3>🌙 Renungan Ruhiyah</h3><p>${REN[n-1]}</p><small>Renungan umum, bukan dalil. Mohon ditinjau ustaz atau guru.</small></div>${n===50?certCard():''}<div class="card"><button class="gold" style="width:100%" onclick="finish(${n})">${S.done[n]?"✔ Sudah selesai (klik untuk batal)":"Tandai Selesai"}</button></div>`;return h}
function wrapAr(s){return s.replace(/[\u0600-\u06FF]+(?:\s[\u0600-\u06FF]+)*/g,m=>'<span class="ar" style="display:inline;font-size:1.3em">'+m+'</span>')}
let P=null;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function mkTok(){const w=P.items[P.i][0].split(' ');P.tok=shuf(w.map((x,k)=>k));P.sel=[]}
function startP(n,t){const c=C[n];const items=t==='susun'?c.ex.filter(e=>e[0].split(' ').length>=2):shuf(c.vocab).slice(0,5);
 if(!items.length){alert('Modul ini belum punya kalimat untuk disusun.');return}
 P={n,t,i:0,ok:0,items,fb:null,a:null,b:null,done:{},err:0,rs:null,fin:0};if(t==='susun')mkTok();view='latihan';window.scrollTo(0,0);render()}
function finP(ok){P.fin=1;P.ok=ok;P.total=P.items.length;bumpDay();log('Latihan '+P.t+' Modul '+P.n+': '+ok+'/'+P.total);save()}
function pk(s,i){P[s]=i;if(P.a!==null&&P.b!==null){if(P.a===P.b)P.done[P.a]=1;else P.err++;P.a=P.b=null;if(Object.keys(P.done).length===P.items.length)finP(Math.max(0,P.items.length-P.err))}render()}
function tk(k){P.sel.push(k);render()}
function chk(){const v=P.items[P.i];let ok=false;
 if(P.t==='ketik'){const x=document.getElementById('kt').value.toLowerCase().replace(/\(.*?\)/g,'').trim();const ps=v[1].toLowerCase().split('/').map(s=>s.replace(/\(.*?\)/g,'').trim());ok=!!x&&ps.some(s=>s===x||s.endsWith(' '+x)||s.startsWith(x+' '))}
 else{const w=v[0].split(' ');ok=P.sel.length===w.length&&P.sel.map(k=>w[k]).join(' ')===v[0]}
 if(ok)P.ok++;P.fb=(ok?'✅ Benar! ':'❌ Perlu diperbaiki. Jawaban: ')+(P.t==='ketik'?v[1]:v[0]);render()}
function nxP(){P.i++;P.fb=null;if(P.i>=P.items.length)finP(P.ok);else if(P.t==='susun')mkTok();render()}

 const nm={cocok:'Cocokkan Kosakata',susun:'Susun Kalimat',ketik:'Ketik Arti'}[p.t];let h=`<div class='card'><b>Modul ${p.n} · ${nm}</b> ${back}</div>`;
 if(p.t==='cocok'){const R=p.rs||(p.rs=shuf(p.items.map((v,i)=>[v[1],i])));

 const v=p.items[p.i];h+=`<div class='card'><small>Soal ${p.i+1}/${p.items.length}</small>`;
 if(p.t==='ketik')h+=`<div class='ar'>${v[0]}</div><input id='kt' placeholder='Ketik artinya dalam bahasa Indonesia' ${p.fb?'disabled':''}>`;
 else{const w=v[0].split(' ');h+=`<p>Susun kalimat: <b>${v[1]}</b></p><div class='ar' style='min-height:56px;border:2px dashed #cfe0d6;border-radius:12px;padding:6px'>${p.sel.map(k=>w[k]).join(' ')}</div><div class='row'>`+p.tok.filter(k=>!p.sel.includes(k)).map(k=>`<button class='alt ar' ${p.fb?'disabled':''} onclick='tk(${k})'>${w[k]}</button>`).join('')+`</div>${p.fb?'':"<button class='alt' onclick='P.sel=[];render()'>Hapus susunan</button>"}`}

const TLM={'ب':'b','ت':'t','ث':'ts','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dz','ر':'r','ز':'z','س':'s','ش':'sy','ص':'sh','ض':'dh','ط':'th','ظ':'zh','ع':"'",'غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ء':"'",'أ':"'",'إ':"'",'ؤ':"'",'ئ':"'"};
const TLV={'\u064E':'a','\u0650':'i','\u064F':'u','\u064B':'an','\u064D':'in','\u064C':'un'};
const TLMARK=new Set(['\u064E','\u0650','\u064F','\u064B','\u064D','\u064C','\u0652','\u0651','\u0670']);
const TLSUN=new Set(['ت','ث','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ن','ل']);
function tl(s){const ch=[...s];let o='',nodbl=false;const ws=()=>o===''||/[ \-]$/.test(o);
 const marksAt=k=>{const m=[];while(k<ch.length&&TLMARK.has(ch[k])){m.push(ch[k]);k++}return [m,k]};
 for(let i=0;i<ch.length;i++){const c=ch[i];
  if(c===' '){o+=' ';continue}
  if(c==='\u061F'){o+='?';continue}
  if(TLMARK.has(c)||c==='\u0640')continue;
  const [mk,j]=marksAt(i+1);const sh=mk.includes('\u0651'),vw=mk.find(m=>TLV[m]),dg=mk.includes('\u0670');
  if(c==='ا'){
   if(ws()&&!vw&&ch[j]==='ل'){const [lm,k]=marksAt(j+1);
    if(lm.every(m=>m==='\u0652')){const nx=ch[k],[nm]=marksAt(k+1);
     if(nx&&TLSUN.has(nx)&&nm.includes('\u0651')){o+='a'+TLM[nx]+'-';nodbl=true}else o+='al-';
     i=k-1;continue}}
   if(vw){o+=TLV[vw];i=j-1;continue}
   if(ws()){o+='a';continue}
   if(o.endsWith('a'))o+='a';
   continue}
  if(c==='ى'){o+='a';continue}
  if(c==='آ'){o+=ws()?'aa':"'aa";i=j-1;continue}
  if(c==='ة'){o+=vw?'t'+TLV[vw]:'h';i=j-1;continue}
  if((c==='و'||c==='ي')&&!vw&&!sh&&!dg){const lg=c==='و'?'u':'i';if(o.endsWith(lg)){o+=lg;i=j-1;continue}o+=TLM[c];i=j-1;continue}
  const base=TLM[c];if(base===undefined){o+=c;continue}
  let seg=base;if(sh&&!nodbl)seg=base.length===1?base+base:base[0]+base;nodbl=false;
  if(base==="'"&&ws())seg='';
  o+=seg+(vw?TLV[vw]:(dg?'aa':''));i=j-1}
 return o.replace(/al-lla(h[aiu])/g,'allaa$1').replace(/al-la(h[aiu])/g,'allaa$1')}
