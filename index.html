36:{goal:"Menyebut makanan dan minuman serta kegiatan makan dan minum.",body:"Kosakata: طَعَامٌ (makanan), شَرَابٌ (minuman), خُبْزٌ (roti), لَحْمٌ (daging), سَمَكٌ (ikan), فَاكِهَةٌ (buah), حَلِيبٌ (susu), شَايٌ (teh). Kata kerja: أَكَلَ - أَنَا آكُلُ (saya makan), شَرِبَ - أَنَا أَشْرَبُ (saya minum).",more:"<b>Pola:</b> pelaku + fi'il mudhari' + objek manshub, misalnya هُوَ يَأْكُلُ الْخُبْزَ (dia makan roti). <b>Meminta:</b> أُرِيدُ كُوبًا مِنَ الشَّايِ (saya ingin segelas teh). <b>Waktu makan:</b> فُطُورٌ (sarapan), غَدَاءٌ (makan siang), عَشَاءٌ (makan malam). <b>Makanan lain:</b> دَجَاجٌ (ayam), بَيْضٌ (telur), أُرْزٌ (nasi), مَوْزٌ (pisang). <b>Bentuk jamak pelaku:</b> نَحْنُ نَأْكُلُ (kami makan), هُمْ يَأْكُلُونَ (mereka makan).",vocab:[["طَعَامٌ","makanan"],["شَرَابٌ","minuman"],["خُبْزٌ","roti"],["سَمَكٌ","ikan"],["حَلِيبٌ","susu"],["كُوبٌ","gelas"],["فُطُورٌ","sarapan"],["غَدَاءٌ","makan siang"],["عَشَاءٌ","makan malam"],["دَجَاجٌ","ayam"],["بَيْضٌ","telur"],["أُرْزٌ","nasi"]],ex:[["أَنَا أَشْرَبُ الْمَاءَ","Saya minum air."],["هُوَ يَأْكُلُ الْخُبْزَ","Dia makan roti."],["أُرِيدُ كُوبًا مِنَ الشَّايِ","Saya ingin segelas teh."],["آكُلُ الْفُطُورَ فِي الصَّبَاحِ","Saya makan sarapan pada pagi hari."],["هُمْ يَأْكُلُونَ الْغَدَاءَ","Mereka makan siang."]],quiz:[q("خُبْزٌ artinya…",["Roti","Ikan","Susu"],0,"خُبْزٌ = roti."),q("سَمَكٌ artinya…",["Ikan","Daging","Buah"],0,"سَمَكٌ = ikan."),q("أَشْرَبُ artinya…",["Saya minum","Saya makan","Saya tidur"],0,"أَشْرَبُ = saya minum."),q("يَأْكُلُ artinya…",["Dia (lk) makan","Saya makan","Kami makan"],0,"Awalan ي = dia laki-laki."),q("حَلِيبٌ artinya…",["Susu","Teh","Air"],0,"حَلِيبٌ = susu."),q("غَدَاءٌ artinya…",["Makan siang","Sarapan","Makan malam"],0,"غَدَاءٌ = makan siang."),q("دَجَاجٌ artinya…",["Ayam","Ikan","Telur"],0,"دَجَاجٌ = ayam."),q("نَحْنُ نَأْكُلُ artinya…",["Kami makan","Mereka makan","Saya makan"],0,"Awalan ن = kami."),q("Pada آكُلُ الْفُطُورَ, kata الْفُطُورَ adalah…",["Maf'ul bih (manshub)","Fa'il","Majrur"],0,"Objek makan = maf'ul bih manshub.")]},
37:{goal:"Menyebut hal tentang kesehatan dan kebersihan.",body:"Kosakata: صِحَّةٌ (kesehatan), مَرِيضٌ (sakit), طَبِيبٌ (dokter), دَوَاءٌ (obat), نَظِيفٌ (bersih), وَسِخٌ (kotor). Kata penghubung waktu: قَبْلَ (sebelum), بَعْدَ (sesudah); kata sesudahnya majrur.",more:"<b>Contoh kebiasaan:</b> أَغْسِلُ الْيَدَيْنِ قَبْلَ الْأَكْلِ (saya mencuci kedua tangan sebelum makan). <b>Keluhan:</b> عِنْدِي (saya punya) + nama sakit: عِنْدِي صُدَاعٌ (saya sakit kepala; harfiah: saya punya sakit kepala). <b>Kebiasaan bersih:</b> أُنَظِّفُ أَسْنَانِي بَعْدَ الْأَكْلِ (saya membersihkan gigi sesudah makan). Kata sesudah قَبْلَ dan بَعْدَ adalah mudhaf ilaih, jadi majrur: بَعْدَ الْأَكْلِ.",vocab:[["مَرِيضٌ","sakit"],["طَبِيبٌ","dokter"],["دَوَاءٌ","obat"],["نَظِيفٌ","bersih"],["قَبْلَ","sebelum"],["بَعْدَ","sesudah"],["عِنْدِي","saya punya"],["صُدَاعٌ","sakit kepala"],["أَسْنَانٌ","gigi (jamak)"]],ex:[["أَنَا مَرِيضٌ","Saya sakit."],["الْبَيْتُ نَظِيفٌ","Rumah itu bersih."],["أَغْسِلُ الْيَدَيْنِ قَبْلَ الْأَكْلِ","Saya mencuci kedua tangan sebelum makan."],["عِنْدِي صُدَاعٌ","Saya sakit kepala."],["أُنَظِّفُ أَسْنَانِي بَعْدَ الْأَكْلِ","Saya membersihkan gigi saya sesudah makan."]],quiz:[q("مَرِيضٌ artinya…",["Sakit","Sehat","Bersih"],0,"مَرِيضٌ = sakit."),q("طَبِيبٌ artinya…",["Dokter","Guru","Penjual"],0,"طَبِيبٌ = dokter."),q("نَظِيفٌ artinya…",["Bersih","Kotor","Murah"],0,"نَظِيفٌ = bersih."),q("قَبْلَ artinya…",["Sebelum","Sesudah","Bersama"],0,"قَبْلَ = sebelum."),q("دَوَاءٌ artinya…",["Obat","Air","Makanan"],0,"دَوَاءٌ = obat."),q("عِنْدِي صُدَاعٌ artinya…",["Saya sakit kepala","Saya bersih","Saya pergi ke dokter"],0,"عِنْدِي = saya punya; صُدَاعٌ = sakit kepala."),q("بَعْدَ الْأَكْلِ artinya…",["Sesudah makan","Sebelum makan","Saat makan"],0,"بَعْدَ = sesudah."),q("Pada بَعْدَ الْأَكْلِ, kata الْأَكْلِ berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih majrur."),q("أُنَظِّفُ أَسْنَانِي artinya…",["Saya membersihkan gigi saya","Saya makan","Saya tidur"],0,"أَسْنَانِي = gigiku.")]},
38:{goal:"Menanyakan tempat dan arah dalam perjalanan.",body:"Kosakata: سَفَرٌ (perjalanan), مَطَارٌ (bandara), مَحَطَّةٌ (stasiun), سَيَّارَةٌ (mobil), حَافِلَةٌ (bus), قِطَارٌ (kereta), طَرِيقٌ (jalan), يَمِينٌ (kanan), يَسَارٌ (kiri). Gunakan أَيْنَ untuk menanyakan tempat dan بِ untuk 'dengan' kendaraan.",more:"<b>Contoh:</b> أَذْهَبُ بِالْقِطَارِ (saya pergi naik kereta), اِذْهَبْ إِلَى الْيَمِينِ (pergilah ke kanan). <b>Menanyakan cara:</b> كَيْفَ أَذْهَبُ إِلَى الْمَطَارِ؟ (bagaimana saya pergi ke bandara?). <b>Arah lurus:</b> اِذْهَبْ مُسْتَقِيمًا ثُمَّ إِلَى الْيَسَارِ (pergilah lurus, lalu ke kiri). Kendaraan lain dengan بِ: أَذْهَبُ بِالسَّيَّارَةِ (saya pergi naik mobil).",vocab:[["مَطَارٌ","bandara"],["مَحَطَّةٌ","stasiun"],["قِطَارٌ","kereta"],["طَرِيقٌ","jalan"],["يَمِينٌ","kanan"],["يَسَارٌ","kiri"],["مُسْتَقِيمًا","lurus"],["كَيْفَ أَذْهَبُ؟","bagaimana saya pergi?"]],ex:[["أَيْنَ الْمَحَطَّةُ؟","Di mana stasiunnya?"],["أَذْهَبُ بِالْقِطَارِ","Saya pergi naik kereta."],["اِذْهَبْ إِلَى الْيَمِينِ","Pergilah ke kanan."],["كَيْفَ أَذْهَبُ إِلَى الْمَطَارِ؟","Bagaimana saya pergi ke bandara?"],["اِذْهَبْ مُسْتَقِيمًا ثُمَّ إِلَى الْيَسَارِ","Pergilah lurus, lalu ke kiri."]],quiz:[q("مَطَارٌ artinya…",["Bandara","Stasiun","Pasar"],0,"مَطَارٌ = bandara."),q("قِطَارٌ artinya…",["Kereta","Bus","Mobil"],0,"قِطَارٌ = kereta."),q("يَمِينٌ artinya…",["Kanan","Kiri","Jalan"],0,"يَمِينٌ = kanan."),q("أَيْنَ الْمَحَطَّةُ؟ artinya…",["Di mana stasiunnya?","Kapan kereta tiba?","Siapa penjualnya?"],0,"أَيْنَ = di mana."),q("طَرِيقٌ artinya…",["Jalan","Perjalanan","Bus"],0,"طَرِيقٌ = jalan."),q("مُسْتَقِيمًا artinya…",["Lurus","Kanan","Jauh"],0,"مُسْتَقِيمٌ = lurus."),q("كَيْفَ أَذْهَبُ إِلَى الْمَطَارِ؟ artinya…",["Bagaimana saya pergi ke bandara?","Di mana bandaranya?","Kapan saya tiba?"],0,"كَيْفَ = bagaimana."),q("أَذْهَبُ بِالسَّيَّارَةِ artinya…",["Saya pergi naik mobil","Saya pergi naik kereta","Saya pergi jalan kaki"],0,"بِ = dengan; سَيَّارَةٌ = mobil."),q("يَسَارٌ artinya…",["Kiri","Kanan","Lurus"],0,"يَسَارٌ = kiri.")]},
39:{goal:"Mengenal ungkapan adab dan akhlak dalam percakapan.",body:"Ungkapan santun: شُكْرًا (terima kasih), عَفْوًا (sama-sama atau maaf), مِنْ فَضْلِكَ (tolong), لَوْ سَمَحْتَ (permisi). Nilai akhlak: صِدْقٌ (kejujuran), أَمَانَةٌ (amanah), اِحْتِرَامٌ (rasa hormat).",more:"<b>Kepada perempuan:</b> مِنْ فَضْلِكِ dan لَوْ سَمَحْتِ. <b>Contoh kalimat nilai:</b> الصِّدْقُ أَدَبٌ حَسَنٌ. <b>Meminta maaf dan menyambut:</b> أَنَا آسِفٌ (saya minta maaf), أَهْلًا وَسَهْلًا (selamat datang). <b>Mendoakan:</b> جَزَاكَ اللَّهُ خَيْرًا (semoga Allah membalasmu dengan kebaikan); kepada perempuan: جَزَاكِ اللَّهُ خَيْرًا. Akhiran كَ dan كِ membedakan laki-laki dan perempuan.",vocab:[["شُكْرًا","terima kasih"],["مِنْ فَضْلِكَ","tolong"],["صِدْقٌ","kejujuran"],["أَمَانَةٌ","amanah"],["حَسَنٌ","baik"],["أَنَا آسِفٌ","saya minta maaf"],["أَهْلًا وَسَهْلًا","selamat datang"],["جَزَاكَ اللَّهُ خَيْرًا","semoga Allah membalasmu dengan kebaikan"]],ex:[["شُكْرًا لَكَ","Terima kasih untukmu."],["مِنْ فَضْلِكَ، اِفْتَحِ الْبَابَ","Tolong, bukalah pintu."],["الصِّدْقُ أَدَبٌ حَسَنٌ","Kejujuran adalah adab yang baik."],["أَنَا آسِفٌ","Saya minta maaf."],["جَزَاكَ اللَّهُ خَيْرًا","Semoga Allah membalasmu dengan kebaikan."]],quiz:[q("شُكْرًا artinya…",["Terima kasih","Tolong","Permisi"],0,"شُكْرًا = terima kasih."),q("مِنْ فَضْلِكَ artinya…",["Tolong","Selamat pagi","Sampai jumpa"],0,"مِنْ فَضْلِكَ = tolong."),q("صِدْقٌ artinya…",["Kejujuran","Amanah","Hormat"],0,"صِدْقٌ = kejujuran."),q("أَمَانَةٌ artinya…",["Amanah","Kejujuran","Hadiah"],0,"أَمَانَةٌ = amanah."),q("حَسَنٌ artinya…",["Baik","Buruk","Besar"],0,"حَسَنٌ = baik."),q("أَنَا آسِفٌ artinya…",["Saya minta maaf","Saya senang","Saya pergi"],0,"آسِفٌ = menyesal / minta maaf."),q("أَهْلًا وَسَهْلًا artinya…",["Selamat datang","Sampai jumpa","Terima kasih"],0,"Ucapan penyambutan."),q("Kepada perempuan, 'semoga Allah membalasmu' adalah…",["جَزَاكِ اللَّهُ خَيْرًا","جَزَاكَ اللَّهُ خَيْرًا","جَزَاهُ اللَّهُ خَيْرًا"],0,"Akhiran كِ untuk perempuan."),q("جَزَاكَ اللَّهُ خَيْرًا diucapkan untuk…",["Mendoakan kebaikan","Meminta maaf","Menanyakan kabar"],0,"Doa balasan kebaikan.")]},
40:{goal:"Mengenal kosakata dasar ibadah dan kehidupan Muslim.",body:"Kosakata: صَلَاةٌ (shalat), صَوْمٌ (puasa), زَكَاةٌ (zakat), حَجٌّ (haji), وُضُوءٌ (wudhu), مَسْجِدٌ (masjid), الْقُرْآنُ (Al-Qur'an). Kata kerja: أُصَلِّي (saya shalat), أَصُومُ (saya berpuasa), أَقْرَأُ (saya membaca).",more:"<b>Catatan:</b> وُضُوءٌ (dengan dhammah pada و) berarti perbuatan berwudhu. Bagian ini hanya kosakata; hukum dan tata cara ibadah dipelajari kepada guru. <b>Kosakata tambahan:</b> مُسْلِمٌ (orang Muslim), إِمَامٌ (imam), أَذَانٌ (azan), قِبْلَةٌ (kiblat), سَجَّادَةٌ (sajadah). <b>Contoh:</b> الْإِمَامُ فِي الْمَسْجِدِ (imam itu di masjid), أَسْمَعُ الْأَذَانَ (saya mendengar azan).",vocab:[["صَلَاةٌ","shalat"],["صَوْمٌ","puasa"],["زَكَاةٌ","zakat"],["وُضُوءٌ","wudhu"],["أُصَلِّي","saya shalat"],["رَمَضَانُ","Ramadhan"],["مُسْلِمٌ","orang Muslim"],["إِمَامٌ","imam"],["أَذَانٌ","azan"],["قِبْلَةٌ","kiblat"],["سَجَّادَةٌ","sajadah"]],ex:[["أُصَلِّي فِي الْمَسْجِدِ","Saya shalat di masjid."],["أَقْرَأُ الْقُرْآنَ","Saya membaca Al-Qur'an."],["أَصُومُ فِي رَمَضَانَ","Saya berpuasa di bulan Ramadhan."],["الْإِمَامُ فِي الْمَسْجِدِ","Imam itu di masjid."],["أَسْمَعُ الْأَذَانَ","Saya mendengar azan."]],quiz:[q("صَلَاةٌ artinya…",["Shalat","Puasa","Zakat"],0,"صَلَاةٌ = shalat."),q("صَوْمٌ artinya…",["Puasa","Haji","Wudhu"],0,"صَوْمٌ = puasa."),q("زَكَاةٌ artinya…",["Zakat","Shalat","Masjid"],0,"زَكَاةٌ = zakat."),q("أُصَلِّي artinya…",["Saya shalat","Saya puasa","Saya membaca"],0,"أُصَلِّي = saya shalat."),q("وُضُوءٌ artinya…",["Wudhu","Haji","Masjid"],0,"وُضُوءٌ = wudhu."),q("أَذَانٌ artinya…",["Azan","Kiblat","Sajadah"],0,"أَذَانٌ = azan."),q("إِمَامٌ artinya…",["Imam","Pembeli","Dokter"],0,"إِمَامٌ = imam."),q("قِبْلَةٌ artinya…",["Kiblat","Masjid","Zakat"],0,"قِبْلَةٌ = arah kiblat."),q("أَسْمَعُ الْأَذَانَ artinya…",["Saya mendengar azan","Saya membaca azan","Saya shalat"],0,"أَسْمَعُ = saya mendengar.")]},
41:{goal:"Membaca teks Arab pendek dengan urutan yang benar.",body:"Langkah membaca: (1) baca judul (عُنْوَانٌ) dan seluruh teks sekilas, (2) baca kalimat per kalimat dengan harakat, (3) tandai kata yang belum dikenal, (4) pahami isi tiap kalimat. Teks latihan di bawah terdiri dari tiga kalimat tentang Ahmad.",more:"<b>Teks:</b> هٰذَا أَحْمَدُ. هُوَ طَالِبٌ فِي الْمَعْهَدِ. يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ. <b>Teks kedua:</b> هٰذِهِ عَائِشَةُ. هِيَ مُعَلِّمَةٌ فِي الْمَدْرَسَةِ. تَكْتُبُ عَلَى السَّبُّورَةِ. <b>Tebak makna:</b> bila bertemu kata baru, lihat akarnya dan konteks kalimat (lihat Modul 30), lalu cocokkan dengan kata yang sudah dikenal.",vocab:[["نَصٌّ","teks"],["عُنْوَانٌ","judul"],["فِقْرَةٌ","paragraf"],["الْعَرَبِيَّةُ","bahasa Arab"],["كَلِمَةٌ","kata"],["جُمْلَةٌ","kalimat"]],ex:[["هٰذَا أَحْمَدُ","Ini Ahmad."],["هُوَ طَالِبٌ فِي الْمَعْهَدِ","Dia seorang siswa di pesantren."],["يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ","Dia belajar bahasa Arab pada pagi hari."],["هٰذِهِ عَائِشَةُ","Ini Aisyah."],["هِيَ مُعَلِّمَةٌ فِي الْمَدْرَسَةِ","Dia seorang guru perempuan di sekolah."],["تَكْتُبُ عَلَى السَّبُّورَةِ","Dia menulis di papan tulis."]],quiz:[q("عُنْوَانٌ artinya…",["Judul","Paragraf","Kalimat"],0,"عُنْوَانٌ = judul."),q("فِقْرَةٌ artinya…",["Paragraf","Judul","Huruf"],0,"فِقْرَةٌ = paragraf."),q("هُوَ طَالِبٌ فِي الْمَعْهَدِ — Ahmad adalah…",["Siswa di pesantren","Guru di sekolah","Penjual di pasar"],0,"طَالِبٌ = siswa."),q("يَدْرُسُ الْعَرَبِيَّةَ فِي الصَّبَاحِ — Ahmad belajar pada…",["Pagi hari","Malam hari","Sore hari"],0,"الصَّبَاح = pagi."),q("Langkah pertama membaca teks adalah…",["Membaca judul dan teks sekilas","Langsung menerjemahkan semua","Menghafal semua kata"],0,"Mulai dengan gambaran umum."),q("Pada teks kedua, Aisyah adalah…",["Guru perempuan","Siswi","Penjual"],0,"مُعَلِّمَةٌ = guru perempuan."),q("تَكْتُبُ عَلَى السَّبُّورَةِ — Aisyah menulis di…",["Papan tulis","Buku","Meja"],0,"سَبُّورَةٌ = papan tulis."),q("كَلِمَةٌ artinya…",["Kata","Kalimat","Paragraf"],0,"كَلِمَةٌ = kata."),q("Untuk menebak kata baru, kita bisa melihat…",["Akar kata dan konteks kalimat","Hanya huruf pertama","Jumlah huruf"],0,"Akar dan konteks membantu menebak makna.")]},
42:{goal:"Memahami isi bacaan dengan menjawab pertanyaan tentang teks.",body:"Setelah membaca, temukan jawaban dengan kata tanya: مَنْ (siapa), مَاذَا (apa), أَيْنَ (di mana), مَتَى (kapan). Cari kata kuncinya di dalam teks, lalu jawab dengan kalimat sendiri.",more:"<b>Teks:</b> فَاطِمَةُ طَالِبَةٌ مُجْتَهِدَةٌ. تَذْهَبُ إِلَى الْمَكْتَبَةِ بَعْدَ الظُّهْرِ. تَقْرَأُ كِتَابًا جَدِيدًا. <b>Teks kedua:</b> خَالِدٌ يَذْهَبُ إِلَى السُّوقِ فِي الْمَسَاءِ. يَأْخُذُ حَقِيبَةً كَبِيرَةً. يَشْتَرِي خُبْزًا. <b>Contoh tanya jawab:</b> مَنْ يَذْهَبُ إِلَى السُّوقِ؟ خَالِدٌ. مَتَى يَذْهَبُ؟ فِي الْمَسَاءِ. مَاذَا يَشْتَرِي؟ خُبْزًا. Jawaban penuh: يَشْتَرِي خَالِدٌ خُبْزًا.",vocab:[["تَذْهَبُ","dia (pr) pergi"],["تَقْرَأُ","dia (pr) membaca"],["الظُّهْرُ","waktu zhuhur / siang"],["مَاذَا","apa"],["يَأْخُذُ","dia (lk) mengambil"],["يَشْتَرِي","dia (lk) membeli"]],ex:[["فَاطِمَةُ طَالِبَةٌ مُجْتَهِدَةٌ","Fatimah seorang siswi yang rajin."],["تَذْهَبُ إِلَى الْمَكْتَبَةِ بَعْدَ الظُّهْرِ","Dia pergi ke perpustakaan sesudah zhuhur."],["تَقْرَأُ كِتَابًا جَدِيدًا","Dia membaca sebuah buku baru."],["خَالِدٌ يَذْهَبُ إِلَى السُّوقِ فِي الْمَسَاءِ","Khalid pergi ke pasar pada sore hari."],["يَشْتَرِي خُبْزًا","Dia membeli roti."]],quiz:[q("تَذْهَبُ إِلَى الْمَكْتَبَةِ — Fatimah pergi ke…",["Perpustakaan","Pasar","Masjid"],0,"الْمَكْتَبَة = perpustakaan."),q("كِتَابًا جَدِيدًا artinya…",["Buku baru","Buku besar","Buku lama"],0,"جَدِيدًا = baru."),q("بَعْدَ الظُّهْرِ artinya…",["Sesudah zhuhur","Sebelum zhuhur","Pada malam"],0,"بَعْدَ = sesudah."),q("Kata tanya untuk menemukan pelaku adalah…",["مَنْ","أَيْنَ","مَتَى"],0,"مَنْ = siapa."),q("مُجْتَهِدَةٌ menjelaskan Fatimah sebagai…",["Rajin","Sakit","Besar"],0,"مُجْتَهِدَةٌ = rajin."),q("مَاذَا يَشْتَرِي خَالِدٌ؟ jawabannya…",["Roti","Susu","Buku"],0,"يَشْتَرِي خُبْزًا = membeli roti."),q("مَتَى يَذْهَبُ خَالِدٌ إِلَى السُّوقِ؟ jawabannya…",["Pada sore hari","Pada pagi hari","Pada malam hari"],0,"فِي الْمَسَاءِ = pada sore hari."),q("يَأْخُذُ حَقِيبَةً كَبِيرَةً — Khalid mengambil…",["Tas besar","Buku baru","Roti"],0,"حَقِيبَةٌ = tas; كَبِيرَةٌ = besar."),q("يَشْتَرِي artinya…",["Dia (lk) membeli","Dia (lk) menjual","Dia (lk) pergi"],0,"يَشْتَرِي = membeli.")]},
43:{goal:"Menerjemahkan kalimat Arab sederhana ke bahasa Indonesia.",body:"Langkah: (1) cari fi'il dan fa'il, (2) cari maf'ul bih, (3) terjemahkan keterangan tempat dan waktu, (4) rapikan menjadi kalimat Indonesia yang wajar. Jangan menerjemahkan kata demi kata jika hasilnya janggal.",more:"<b>Contoh pembedahan:</b> قَرَأَ (fi'il) الطَّالِبُ (fa'il) الْكِتَابَ (maf'ul) فِي الْمَكْتَبَةِ (tempat). <b>Penanda penerjemahan:</b> kata ber-ال umumnya menjadi '... itu', kata bertanwin menjadi 'sebuah ...'. Perhatikan waktu fi'il: madhi = sudah, mudhari' = sedang atau akan. <b>Ungkapan tetap:</b> كَيْفَ حَالُكَ؟ diterjemahkan 'apa kabar?', bukan kata demi kata.",vocab:[["تَرْجَمَةٌ","terjemahan"],["مَعْنَى","makna"],["حَالٌ","keadaan"],["فِعْلٌ","kata kerja (fi'il)"],["فَاعِلٌ","pelaku (fa'il)"]],ex:[["قَرَأَ الطَّالِبُ الْكِتَابَ فِي الْمَكْتَبَةِ","Siswa itu membaca buku di perpustakaan."],["ذَهَبَ الْوَلَدُ إِلَى الْبَيْتِ","Anak itu pergi ke rumah."],["الْكِتَابُ الْجَدِيدُ عَلَى الْمَكْتَبِ","Buku yang baru ada di atas meja."],["كَيْفَ حَالُكَ؟","Apa kabar?"]],quiz:[q("قَرَأَ الطَّالِبُ الْكِتَابَ artinya…",["Siswa itu membaca buku","Siswa itu menulis buku","Buku itu membaca siswa"],0,"Fi'il قَرَأَ = membaca."),q("ذَهَبَ الْوَلَدُ إِلَى الْبَيْتِ artinya…",["Anak itu pergi ke rumah","Anak itu keluar dari rumah","Rumah itu pergi"],0,"إِلَى = ke."),q("Langkah pertama menerjemahkan kalimat Arab adalah…",["Mencari fi'il dan fa'il","Menghafal semua kata","Menghapus harakat"],0,"Mulai dari inti kalimat."),q("أُصَلِّي فِي الْمَسْجِدِ artinya…",["Saya shalat di masjid","Saya pergi ke masjid","Saya membaca di masjid"],0,"أُصَلِّي = saya shalat."),q("أُمِّي فِي الْمَطْبَخِ artinya…",["Ibuku di dapur","Ayahku di kamar","Ibuku di taman"],0,"مَطْبَخٌ = dapur."),q("ذَهَبَتِ الْبِنْتُ إِلَى الْمَدْرَسَةِ artinya…",["Anak perempuan itu pergi ke sekolah","Anak laki-laki itu pergi ke sekolah","Sekolah itu besar"],0,"ذَهَبَتِ = fi'il madhi muannats."),q("كَتَبْتُ الدَّرْسَ artinya…",["Saya telah menulis pelajaran","Saya menulis pelajaran sekarang","Tulislah pelajaran"],0,"كَتَبْتُ = fi'il madhi, akhiran تُ = saya."),q("هُمْ يَدْرُسُونَ artinya…",["Mereka (lk) belajar","Dia belajar","Kami belajar"],0,"يَدْرُسُونَ = mereka laki-laki."),q("Kata ber-ال seperti الْكِتَابُ biasanya diterjemahkan…",["Buku itu","Sebuah buku","Buku-buku"],0,"ال = '... itu'.")]},
44:{goal:"Menerjemahkan kalimat Indonesia sederhana ke bahasa Arab.",body:"Langkah: (1) tentukan jenis kalimat (ismiyah atau fi'liyah), (2) pilih kosakata yang sudah dikenal, (3) cocokkan jenis dan jumlah, (4) beri harakat akhir yang tepat. Mulailah dari kalimat pendek.",more:"<b>Contoh:</b> 'Saya pergi ke pasar' menjadi أَذْهَبُ إِلَى السُّوقِ. Perhatikan jenis kata: 'rajin' untuk siswi menjadi مُجْتَهِدَةٌ. <b>Tanyakan dulu:</b> pelaku laki-laki atau perempuan, satu atau banyak, dan peristiwa sudah terjadi atau belum? Bahasa Indonesia tidak membedakan jenis, bahasa Arab membedakan. <b>Contoh:</b> 'Para siswa belajar di kelas' menjadi الطُّلَّابُ يَدْرُسُونَ فِي الْفَصْلِ.",vocab:[["أَذْهَبُ إِلَى السُّوقِ","saya pergi ke pasar"],["الطَّالِبَةُ مُجْتَهِدَةٌ","siswi itu rajin"],["الطُّلَّابُ يَدْرُسُونَ فِي الْفَصْلِ","para siswa belajar di kelas"],["جُمْلَةٌ","kalimat"],["الْبَيْتُ كَبِيرٌ","rumah itu besar"]],ex:[["أَذْهَبُ إِلَى السُّوقِ","Saya pergi ke pasar."],["الْمُعَلِّمُ يَقْرَأُ الْكِتَابَ","Guru itu membaca buku."],["أُمِّي تَذْهَبُ إِلَى السُّوقِ","Ibuku pergi ke pasar."],["الطُّلَّابُ يَدْرُسُونَ فِي الْفَصْلِ","Para siswa belajar di kelas."]],quiz:[q("'Saya pergi ke pasar' dalam bahasa Arab adalah…",["أَذْهَبُ إِلَى السُّوقِ","أَنَامُ فِي السُّوقِ","هُوَ فِي السُّوقِ"],0,"أَذْهَبُ = saya pergi."),q("'Siswi itu rajin' dalam bahasa Arab adalah…",["الطَّالِبَةُ مُجْتَهِدَةٌ","الطَّالِبَةُ مُجْتَهِدٌ","الطَّالِبُ مُجْتَهِدَةٌ"],0,"Subjek dan khabar sama-sama muannats."),q("'Guru itu membaca buku' yang benar…",["الْمُعَلِّمُ يَقْرَأُ الْكِتَابَ","الْمُعَلِّمُ يَقْرَأُ الْكِتَابُ","الْمُعَلِّمُ يَقْرَأُ الْكِتَابِ"],0,"Objek manshub: الْكِتَابَ."),q("Setelah memilih kosakata, langkah berikutnya adalah…",["Mencocokkan jenis dan jumlah","Menghapus harakat","Menerjemahkan kata demi kata"],0,"Cocokkan jenis dan jumlah."),q("'Rumah itu besar' dalam bahasa Arab adalah…",["الْبَيْتُ كَبِيرٌ","الْبَيْتُ كَبِيرَةٌ","بَيْتٌ الْكَبِيرُ"],0,"بَيْتٌ mudzakkar, jadi كَبِيرٌ."),q("'Dia (pr) membaca buku' dalam bahasa Arab adalah…",["هِيَ تَقْرَأُ الْكِتَابَ","هُوَ يَقْرَأُ الْكِتَابَ","هِيَ تَقْرَأُ الْكِتَابُ"],0,"Perempuan = تَقْرَأُ; objek manshub."),q("'Mereka (lk) belajar' dalam bahasa Arab adalah…",["هُمْ يَدْرُسُونَ","هِيَ تَدْرُسُ","أَنَا أَدْرُسُ"],0,"يَدْرُسُونَ = mereka laki-laki."),q("'Ibuku pergi ke pasar' dalam bahasa Arab adalah…",["أُمِّي تَذْهَبُ إِلَى السُّوقِ","أُمِّي يَذْهَبُ إِلَى السُّوقِ","أَبِي تَذْهَبُ إِلَى السُّوقِ"],0,"Ibu = muannats, fi'il memakai تَذْهَبُ."),q("Sebelum menerjemahkan ke Arab, hal pertama yang perlu ditentukan adalah…",["Jenis dan jumlah pelaku","Jumlah huruf","Panjang kalimat"],0,"Arab membedakan jenis dan jumlah.")]},
45:{goal:"Menulis paragraf pendek sederhana dalam bahasa Arab.",body:"Paragraf pendek terdiri dari pembuka (memperkenalkan diri atau topik), isi (2-3 kalimat kegiatan), dan penutup. Sambungkan kalimat dengan وَ (dan), ثُمَّ (kemudian), dan لَكِنْ (tetapi). Setelah menulis, periksa jenis, jumlah, harakat akhir, dan ejaan.",more:"<b>Contoh paragraf:</b> أَنَا طَالِبٌ. أَدْرُسُ فِي الْمَعْهَدِ. أَقْرَأُ الْقُرْآنَ فِي الصَّبَاحِ ثُمَّ أَذْهَبُ إِلَى الْفَصْلِ. <b>Latihan:</b> tulis tiga kalimat tentang kegiatanmu sendiri. <b>Contoh paragraf kedua:</b> أَنَا مُحَمَّدٌ. أَذْهَبُ إِلَى الْمَدْرَسَةِ فِي الصَّبَاحِ. أَدْرُسُ الْعَرَبِيَّةَ ثُمَّ أَقْرَأُ الْقُرْآنَ. أَنَامُ فِي اللَّيْلِ. <b>Pemilihan waktu fi'il:</b> pakai mudhari' untuk kebiasaan atau kegiatan rutin, madhi untuk peristiwa yang sudah terjadi.",vocab:[["لَكِنْ","tetapi"],["ثُمَّ","kemudian"],["وَ","dan"],["فِقْرَةٌ","paragraf"],["مُقَدِّمَةٌ","pembuka"],["خَاتِمَةٌ","penutup"]],ex:[["أَنَا طَالِبٌ","Saya seorang siswa."],["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."],["أَقْرَأُ ثُمَّ أَكْتُبُ","Saya membaca kemudian menulis."],["أَنَامُ فِي اللَّيْلِ وَأَدْرُسُ فِي الصَّبَاحِ","Saya tidur pada malam hari dan belajar pada pagi hari."]],quiz:[q("ثُمَّ artinya…",["Kemudian","Tetapi","Dan"],0,"ثُمَّ = kemudian."),q("لَكِنْ artinya…",["Tetapi","Karena","Atau"],0,"لَكِنْ = tetapi."),q("Susunan paragraf pendek adalah…",["Pembuka, isi, penutup","Hanya isi","Penutup lalu pembuka"],0,"Pembuka, isi, penutup."),q("Kalimat pembuka untuk memperkenalkan diri adalah…",["أَنَا طَالِبٌ","هُمْ طُلَّابٌ","هِيَ مُعَلِّمَةٌ"],0,"أَنَا = saya."),q("Setelah menulis, yang perlu diperiksa adalah…",["Jenis, jumlah, harakat akhir, ejaan","Hanya jumlah kata","Tidak perlu diperiksa"],0,"Periksa kesesuaian dan ejaan."),q("Untuk menulis kebiasaan harian, kita biasanya memakai fi'il…",["Mudhari'","Madhi","Amr"],0,"Mudhari' cocok untuk kegiatan rutin."),q("Kalimat penutup yang cocok pada paragraf kegiatan adalah…",["أَنَامُ فِي اللَّيْلِ","مَنْ هٰذَا؟","كَمْ ثَمَنُهُ؟"],0,"أَنَامُ فِي اللَّيْلِ = penutup kegiatan harian."),q("أَدْرُسُ الْعَرَبِيَّةَ ثُمَّ أَقْرَأُ الْقُرْآنَ artinya…",["Saya belajar bahasa Arab lalu membaca Al-Qur'an","Saya membaca Al-Qur'an lalu tidur","Saya pergi ke sekolah"],0,"ثُمَّ = kemudian."),q("Pada أَدْرُسُ الْعَرَبِيَّةَ, kata الْعَرَبِيَّةَ berkeadaan…",["Nashab (objek)","Rafa'","Jar"],0,"Maf'ul bih manshub.")]},
46:{goal:"Menulis pesan singkat dalam bahasa Arab.",body:"Pesan singkat terdiri dari salam, isi pesan, dan penutup. Panggil seseorang dengan يَا + nama (يَا أَحْمَدُ). Gunakan kalimat pendek dan kosakata yang sudah dikenal. Penutup yang umum: شُكْرًا dan مَعَ السَّلَامَةِ.",more:"<b>Contoh pesan:</b> السَّلَامُ عَلَيْكُمْ يَا أَحْمَدُ. أَيْنَ أَنْتَ الْآنَ؟ أَنَا فِي الْمَكْتَبَةِ. شُكْرًا. <b>Pesan kepada guru:</b> السَّلَامُ عَلَيْكُمْ يَا أُسْتَاذُ. أَنَا مَرِيضٌ الْيَوْمَ. لَا أَحْضُرُ الْيَوْمَ. شُكْرًا. Awali dengan salam dan panggilan hormat, sebutkan keadaan, lalu tutup dengan ucapan terima kasih. Kepada perempuan, pertanyaan menjadi أَيْنَ أَنْتِ الْآنَ؟",vocab:[["رِسَالَةٌ","pesan / surat"],["الْآنَ","sekarang"],["يَا","wahai (memanggil)"],["مَعَ السَّلَامَةِ","sampai jumpa"],["يَا أُسْتَاذُ","wahai Ustadz"],["أَحْضُرُ","saya hadir"]],ex:[["السَّلَامُ عَلَيْكُمْ يَا أَحْمَدُ","Salam sejahtera, wahai Ahmad."],["أَيْنَ أَنْتَ الْآنَ؟","Kamu di mana sekarang?"],["أَنَا فِي الْمَكْتَبَةِ، شُكْرًا","Saya di perpustakaan, terima kasih."],["يَا أُسْتَاذُ، أَنَا مَرِيضٌ الْيَوْمَ","Wahai Ustadz, saya sakit hari ini."],["لَا أَحْضُرُ الْيَوْمَ","Saya tidak hadir hari ini."]],quiz:[q("رِسَالَةٌ artinya…",["Pesan","Buku","Kelas"],0,"رِسَالَةٌ = pesan / surat."),q("الْآنَ artinya…",["Sekarang","Besok","Kemarin"],0,"الْآنَ = sekarang."),q("يَا أَحْمَدُ digunakan untuk…",["Memanggil Ahmad","Bertanya tentang Ahmad","Menolak Ahmad"],0,"يَا = wahai (memanggil)."),q("مَعَ السَّلَامَةِ digunakan sebagai…",["Penutup perpisahan","Salam pembuka","Kata tanya"],0,"Dipakai saat berpisah."),q("Susunan pesan singkat yang baik adalah…",["Salam, isi, penutup","Penutup, isi, salam","Hanya isi"],0,"Salam, isi, penutup."),q("لَا أَحْضُرُ الْيَوْمَ artinya…",["Saya tidak hadir hari ini","Saya hadir hari ini","Dia tidak hadir"],0,"لَا + mudhari' = tidak; الْيَوْمَ = hari ini."),q("يَا أُسْتَاذُ digunakan untuk…",["Memanggil guru","Menanyakan guru","Menolak guru"],0,"يَا = wahai (memanggil)."),q("Kepada perempuan, 'kamu di mana sekarang?' adalah…",["أَيْنَ أَنْتِ الْآنَ؟","أَيْنَ أَنْتَ الْآنَ؟","أَيْنَ هُوَ الْآنَ؟"],0,"أَنْتِ = kamu (pr)."),q("Pesan kepada guru sebaiknya diawali…",["Salam dan panggilan hormat","Langsung penutup","Kata tanya"],0,"Mulai dengan salam dan sapaan sopan.")]},
47:{goal:"Melakukan percakapan lanjutan dengan pertanyaan ya atau tidak.",body:"Pertanyaan ya atau tidak diawali هَلْ. Jawabannya نَعَمْ (ya) atau لَا (tidak), lalu ditambah kalimat singkat. Gunakan juga كُلَّ يَوْمٍ (setiap hari) untuk menyatakan kebiasaan.",more:"<b>Dialog:</b> هَلْ أَنْتَ طَالِبٌ؟ — نَعَمْ، أَنَا طَالِبٌ. Untuk menjawab tidak, awali dengan لَا. <b>Frekuensi:</b> دَائِمًا (selalu), أَحْيَانًا (kadang-kadang): أَقْرَأُ الْقُرْآنَ دَائِمًا. <b>هَلْ dengan fi'il madhi:</b> هَلْ ذَهَبْتَ إِلَى الْمَسْجِدِ؟ dijawab لَا، أَنَا فِي الْبَيْتِ (tidak, saya di rumah).",vocab:[["هَلْ","apakah"],["نَعَمْ","ya"],["لَا","tidak"],["كُلَّ يَوْمٍ","setiap hari"],["دَائِمًا","selalu"],["أَحْيَانًا","kadang-kadang"]],ex:[["هَلْ أَنْتَ طَالِبٌ؟","Apakah kamu seorang siswa?"],["نَعَمْ، أَنَا طَالِبٌ","Ya, saya seorang siswa."],["هَلْ تَدْرُسُ الْعَرَبِيَّةَ كُلَّ يَوْمٍ؟","Apakah kamu belajar bahasa Arab setiap hari?"],["أَقْرَأُ الْقُرْآنَ دَائِمًا","Saya selalu membaca Al-Qur'an."],["هَلْ ذَهَبْتَ إِلَى الْمَسْجِدِ؟ لَا، أَنَا فِي الْبَيْتِ","Apakah kamu pergi ke masjid? Tidak, saya di rumah."]],quiz:[q("هَلْ digunakan untuk…",["Pertanyaan ya atau tidak","Menanyakan tempat","Menanyakan harga"],0,"هَلْ = apakah."),q("نَعَمْ artinya…",["Ya","Tidak","Mungkin"],0,"نَعَمْ = ya."),q("لَا artinya…",["Tidak","Ya","Dan"],0,"لَا = tidak."),q("كُلَّ يَوْمٍ artinya…",["Setiap hari","Sepanjang malam","Kemarin"],0,"كُلَّ = setiap."),q("هَلْ أَنْتَ طَالِبٌ؟ artinya…",["Apakah kamu seorang siswa?","Siapa kamu?","Kamu dari mana?"],0,"هَلْ + kalimat = pertanyaan ya atau tidak."),q("دَائِمًا artinya…",["Selalu","Kadang-kadang","Tidak pernah"],0,"دَائِمًا = selalu."),q("أَحْيَانًا artinya…",["Kadang-kadang","Setiap hari","Sekarang"],0,"أَحْيَانًا = kadang-kadang."),q("هَلْ ذَهَبْتَ إِلَى الْمَسْجِدِ؟ artinya…",["Apakah kamu pergi ke masjid?","Di mana masjidnya?","Kapan kamu pergi?"],0,"هَلْ + fi'il madhi = apakah ... telah."),q("Jawaban singkat untuk 'tidak' adalah…",["لَا","نَعَمْ","هَلْ"],0,"لَا = tidak.")]},
48:{goal:"Memahami teks pendek bertema pendidikan Islam.",body:"Teks pendek bertema pendidikan memakai kosakata yang sudah dipelajari: ilmu, pesantren, guru, adab. Bacalah per kalimat, cari kata kunci, lalu rangkum maknanya dengan kata sendiri.",more:"<b>Teks:</b> الْمَعْهَدُ مَكَانٌ لِطَلَبِ الْعِلْمِ. يَدْرُسُ الطُّلَّابُ الْقُرْآنَ وَالْعَرَبِيَّةَ. يَحْتَرِمُ الطَّالِبُ مُعَلِّمَهُ. <b>Teks kedua:</b> الْعِلْمُ نُورٌ. الْمُعَلِّمُ يُعَلِّمُ الطُّلَّابَ. الطُّلَّابُ يَشْكُرُونَ مُعَلِّمَهُمْ. <b>Merangkum:</b> setelah membaca, tuliskan inti teks dalam satu kalimat dengan kata sendiri.",vocab:[["مَكَانٌ","tempat"],["طَلَبُ الْعِلْمِ","menuntut ilmu"],["يَحْتَرِمُ","dia menghormati"],["مُعَلِّمَهُ","gurunya"],["يُعَلِّمُ","dia (lk) mengajar"],["يَشْكُرُونَ","mereka (lk) berterima kasih"],["مُعَلِّمَهُمْ","guru mereka"]],ex:[["الْمَعْهَدُ مَكَانٌ لِطَلَبِ الْعِلْمِ","Pesantren adalah tempat menuntut ilmu."],["يَدْرُسُ الطُّلَّابُ الْقُرْآنَ وَالْعَرَبِيَّةَ","Para siswa belajar Al-Qur'an dan bahasa Arab."],["يَحْتَرِمُ الطَّالِبُ مُعَلِّمَهُ","Siswa itu menghormati gurunya."],["الْعِلْمُ نُورٌ","Ilmu adalah cahaya."],["الْمُعَلِّمُ يُعَلِّمُ الطُّلَّابَ","Guru itu mengajar para siswa."]],quiz:[q("مَكَانٌ artinya…",["Tempat","Waktu","Guru"],0,"مَكَانٌ = tempat."),q("طَلَبُ الْعِلْمِ artinya…",["Menuntut ilmu","Menulis buku","Membaca teks"],0,"طَلَبٌ = menuntut, عِلْمٌ = ilmu."),q("يَحْتَرِمُ artinya…",["Dia menghormati","Dia membaca","Dia pergi"],0,"يَحْتَرِمُ = menghormati."),q("مُعَلِّمَهُ artinya…",["Gurunya","Gurumu","Guruku"],0,"هُ = nya."),q("Menurut teks, pesantren adalah…",["Tempat menuntut ilmu","Tempat berbelanja","Tempat bermain"],0,"Sesuai kalimat pertama teks."),q("يُعَلِّمُ artinya…",["Dia (lk) mengajar","Dia (lk) belajar","Dia (lk) membaca"],0,"يُعَلِّمُ = mengajar; يَدْرُسُ = belajar."),q("مُعَلِّمَهُمْ artinya…",["Guru mereka","Guruku","Guru kami"],0,"هُمْ = mereka."),q("Pada الْمُعَلِّمُ يُعَلِّمُ الطُّلَّابَ, siapa yang mengajar?",["Guru","Para siswa","Orang tua"],0,"الْمُعَلِّمُ = fa'il (pelaku)."),q("Inti dari الْعِلْمُ نُورٌ adalah…",["Ilmu menerangi seperti cahaya","Ilmu itu berat","Ilmu itu mahal"],0,"نُورٌ = cahaya.")]},
49:{goal:"Menyusun proyek menulis bahasa Arab pendek.",body:"Proyek ini menggabungkan semua kemampuan. Langkah: (1) pilih topik (misalnya perkenalan diri atau kegiatan harian), (2) buat kerangka, (3) tulis 5 sampai 7 kalimat, (4) periksa jenis, jumlah, dan harakat, (5) bacakan dengan lantang kepada guru atau teman.",more:"<b>Kerangka perkenalan diri:</b> اسْمِي ... أَنَا مِنْ ... أَدْرُسُ فِي ... Ganti titik dengan data Anda sendiri, lalu tambahkan kegiatan sehari-hari. <b>Contoh kerangka lengkap (siswi):</b> اسْمِي فَاطِمَةُ. أَنَا طَالِبَةٌ. أَنَا مِنْ إِنْدُونِيسِيَا. أَدْرُسُ فِي الْمَعْهَدِ. أَقْرَأُ الْقُرْآنَ فِي الصَّبَاحِ. أَذْهَبُ إِلَى الْفَصْلِ ثُمَّ أَدْرُسُ الْعَرَبِيَّةَ. شُكْرًا. <b>Daftar periksa:</b> pembuka, asal, tempat belajar, kegiatan, penutup. Pastikan jenis kata sesuai (طَالِبٌ untuk laki-laki, طَالِبَةٌ untuk perempuan).",vocab:[["مَشْرُوعٌ","proyek"],["اسْمِي","namaku"],["أَنَا مِنْ","saya berasal dari"],["أَدْرُسُ فِي","saya belajar di"],["شُكْرًا","terima kasih"]],ex:[["اسْمِي أَحْمَدُ","Namaku Ahmad."],["أَنَا مِنْ إِنْدُونِيسِيَا","Saya berasal dari Indonesia."],["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."],["اسْمِي فَاطِمَةُ. أَنَا طَالِبَةٌ","Namaku Fatimah. Saya seorang siswi."],["أَقْرَأُ الْقُرْآنَ فِي الصَّبَاحِ","Saya membaca Al-Qur'an pada pagi hari."]],quiz:[q("مَشْرُوعٌ artinya…",["Proyek","Pelajaran","Tempat"],0,"مَشْرُوعٌ = proyek."),q("اسْمِي artinya…",["Namaku","Namamu","Namanya"],0,"ِي = milikku."),q("أَنَا مِنْ إِنْدُونِيسِيَا artinya…",["Saya berasal dari Indonesia","Saya pergi ke Indonesia","Saya di Indonesia"],0,"مِنْ = dari."),q("Langkah pertama proyek menulis adalah…",["Memilih topik","Membacakan hasil","Menghapus harakat"],0,"Mulai dari topik."),q("Sebelum membacakan hasil, kita perlu…",["Memeriksa jenis, jumlah, dan harakat","Menambah banyak kata sulit","Menghapus semua kalimat"],0,"Periksa dulu agar benar."),q("Untuk siswi, 'saya seorang siswi' adalah…",["أَنَا طَالِبَةٌ","أَنَا طَالِبٌ","هِيَ طَالِبٌ"],0,"Muannats memakai طَالِبَةٌ."),q("Urutan kerangka perkenalan yang baik adalah…",["Nama, asal, tempat belajar, kegiatan","Penutup, nama, kegiatan","Kegiatan saja"],0,"Dari yang paling umum ke yang rinci."),q("أَذْهَبُ إِلَى الْفَصْلِ ثُمَّ أَدْرُسُ الْعَرَبِيَّةَ artinya…",["Saya pergi ke kelas lalu belajar bahasa Arab","Saya belajar lalu pulang","Saya membaca buku"],0,"ثُمَّ = kemudian."),q("Kalimat penutup yang cocok adalah…",["شُكْرًا","مَا اسْمُكَ؟","كَمْ ثَمَنُهُ؟"],0,"شُكْرًا = terima kasih.")]},
50:{goal:"Mengukur pemahaman dari seluruh Akademi Bahasa dan memperoleh sertifikat internal.",body:"Ini evaluasi akhir. Kuis modul ini berisi 50 soal campuran yang mewakili tiap modul dari seluruh tahap, dengan urutan soal dan pilihan jawaban yang diacak setiap kali. Capai nilai minimal 80%. Sertifikat internal terbuka jika Modul 1 sampai 49 sudah ditandai selesai dan nilai kuis Modul 50 minimal 80%. Sertifikat bersifat internal aplikasi, bukan sertifikasi resmi.",more:"<b>Tips:</b> ulangi modul yang terasa sulit sebelum mengerjakan evaluasi.",vocab:[["تَقْيِيمٌ","evaluasi"],["شَهَادَةٌ","sertifikat"],["اِخْتِبَارٌ","ujian / tes"],["مُرَاجَعَةٌ","mengulang / meninjau ulang"],["نَجَاحٌ","keberhasilan"]],ex:[["هٰذَا تَقْيِيمٌ نِهَائِيٌّ","Ini evaluasi akhir."],["أُرَاجِعُ الدُّرُوسَ قَبْلَ الِاخْتِبَارِ","Saya mengulang pelajaran sebelum ujian."],["نَجَحَ الطَّالِبُ فِي الِاخْتِبَارِ","Siswa itu berhasil dalam ujian."]],quiz:[q("أَنَا artinya…",["Saya","Kami","Dia"],0,"أَنَا = saya."),q("الْبَيْتُ كَبِيرٌ termasuk…",["Jumlah ismiyah","Jumlah fi'liyah","Fi'il amr"],0,"Diawali isim."),q("اُكْتُبْ adalah fi'il…",["Amr","Madhi","Mudhari'"],0,"اُكْتُبْ = tulislah."),q("Mudhaf ilaih berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih majrur."),q("'Saya pergi ke sekolah' adalah…",["أَذْهَبُ إِلَى الْمَدْرَسَةِ","هُوَ فِي الْمَدْرَسَةِ","هِيَ تَنَامُ"],0,"أَذْهَبُ = saya pergi.")]},
20:{goal:"Menggabungkan pola yang sudah dipelajari untuk membuat kalimat.",body:"Gunakan pola fi'il + fa'il + maf'ul bih + keterangan tempat, atau mubtada + khabar. Sambungkan kalimat dengan وَ (dan) atau ثُمَّ (kemudian). Periksa kesesuaian jenis dan jumlah, lalu bacalah kalimat dengan lantang.",more:"<b>Langkah menyusun:</b> pilih pelaku, pilih fi'il dengan waktu yang tepat, tambahkan objek atau keterangan, lalu periksa harakat akhir. <b>Sambungan tanpa mengulang pelaku:</b> setelah وَ, pelaku yang sama cukup tersirat: ذَهَبَ الطَّالِبُ إِلَى الْمَكْتَبَةِ وَقَرَأَ كِتَابًا. Dua kalimat ismiyah juga bisa disambung: الْكِتَابُ جَدِيدٌ وَالْقَلَمُ قَدِيمٌ. <b>Daftar periksa:</b> (1) jenis dan jumlah sesuai, (2) fa'il marfu', (3) maf'ul bih manshub, (4) isim setelah harf jar majrur.",vocab:[["وَ","dan"],["ثُمَّ","kemudian"],["نَعَمْ","ya"],["لَا","tidak"],["مَكْتَبَةٌ","perpustakaan"]],ex:[["دَخَلَ الْمُعَلِّمُ الْفَصْلَ ثُمَّ جَلَسَ","Guru itu masuk kelas kemudian duduk."],["الطَّالِبَةُ تَكْتُبُ الدَّرْسَ وَالْوَلَدُ يَقْرَأُ","Siswi itu menulis pelajaran dan anak itu membaca."],["قَرَأَ الْوَلَدُ الْكِتَابَ فِي الْفَصْلِ","Anak itu membaca buku di kelas."],["ذَهَبَ الطَّالِبُ إِلَى الْمَكْتَبَةِ وَقَرَأَ كِتَابًا","Siswa itu pergi ke perpustakaan dan membaca sebuah buku."],["الْكِتَابُ جَدِيدٌ وَالْقَلَمُ قَدِيمٌ","Bukunya baru dan penanya lama."]],quiz:[q("ثُمَّ artinya…",["Kemudian","Dan","Tidak"],0,"ثُمَّ = kemudian."),q("نَعَمْ artinya…",["Tidak","Ya","Siapa"],1,"نَعَمْ = ya."),q("Urutan dasar jumlah fi'liyah adalah…",["Fi'il + fa'il + maf'ul","Maf'ul + fa'il + fi'il","Khabar + fi'il"],0,"Fi'il, fa'il, lalu maf'ul bih."),q("دَخَلَ الْمُعَلِّمُ الْفَصْلَ artinya…",["Guru itu masuk kelas","Guru itu keluar kelas","Guru itu membuka kelas"],0,"دَخَلَ = masuk."),q("Lengkapi: الطَّالِبَةُ ___ الدَّرْسَ",["يَكْتُبُ","تَكْتُبُ","نَكْتُبُ"],1,"Pelaku perempuan memakai تَكْتُبُ."),q("Pelaku قَرَأَ pada ذَهَبَ الطَّالِبُ إِلَى الْمَكْتَبَةِ وَقَرَأَ كِتَابًا adalah…",["الطَّالِبُ","الْمَكْتَبَةِ","كِتَابًا"],0,"Pelaku yang sama tersirat setelah وَ."),q("وَ artinya…",["Dan","Kemudian","Tidak"],0,"وَ = dan."),q("Untuk urutan kejadian (lalu), gunakan…",["ثُمَّ","لَا","نَعَمْ"],0,"ثُمَّ = kemudian."),q("الْكِتَابُ جَدِيدٌ وَالْقَلَمُ قَدِيمٌ terdiri dari…",["Dua kalimat ismiyah","Dua kalimat fi'liyah","Satu frasa"],0,"Dua pasang mubtada dan khabar.")]}
};

tan. Gunakan hari ini sebaik-baiknya tanpa menunda kebaikan.","Perintah yang baik berasal dari niat yang baik. Biasakan mengajak kepada kebaikan dengan kata-kata yang lembut.","Latihan membuat kalimat melatih ketekunan. Ketekunan kecil yang rutin lebih berharga daripada semangat besar yang sebentar.","Harakat akhir berubah menurut kedudukan kata. Belajarlah bersikap luwes sesuai keadaan tanpa meninggalkan prinsip yang benar.","Pokok kalimat harus kuat. Perkuat dasar ilmu dan akhlakmu sebelum mengejar hal-hal yang lebih tinggi.","Objek menerima dampak perbuatan. Latih dirimu menerima nasihat dengan lapang dada.","Kata setelah kata depan mengikuti aturannya. Belajarlah taat pada aturan yang baik dan menjaga adab dalam pergaulan.","Sifat memperindah yang disifati. Hiasi dirimu dengan sifat baik seperti jujur, sabar, dan rendah hati.","Kepemilikan menumbuhkan rasa tanggung jawab. Jagalah amanah yang dititipkan kepadamu, baik benda maupun kepercayaan.","Kata sambung 'yang' menyambungkan keterangan. Sambungkan juga ilmu dengan amal agar bermanfaat.","Ada perbuatan yang berdampak pada orang lain, ada yang tidak. Pilihlah perbuatan yang bermanfaat bagi sekitar.","Dari satu akar tumbuh banyak bentuk. Dari satu niat baik bisa lahir banyak kebaikan.","Satu akar kata berubah menjadi banyak bentuk. Semoga kita pun terus tumbuh menjadi pribadi yang lebih baik tanpa kehilangan akar yang kokoh.","Salam dan perkenalan membuka pintu persaudaraan. Mulailah pertemuan dengan wajah ramah dan sapaan yang baik.","Keluarga adalah tempat belajar adab yang pertama. Muliakan orang tuamu dengan ucapan dan perbuatan.","Pesantren dan sekolah adalah tempat menuntut ilmu. Hormati guru, jaga kebersihan, dan manfaatkan waktu belajar.","Waktu terus berjalan. Atur harianmu agar ada waktu untuk ibadah, belajar, dan istirahat.","Dalam jual beli, kejujuran sangat penting. Latih dirimu berkata benar dan tidak menipu.","Makan dan minum adalah nikmat. Mulailah dengan doa, makanlah secukupnya, dan syukuri rezeki.","Menjaga kebersihan dan kesehatan adalah bagian dari merawat nikmat. Biasakan hidup bersih dan teratur.","Setiap perjalanan butuh persiapan dan doa. Niatkan perjalananmu untuk kebaikan dan jagalah adab di jalan.","Akhlak yang baik terlihat dalam ucapan sehari-hari. Biasakan mengucapkan terima kasih, tolong, dan maaf.","Ibadah menjadi pusat kehidupan seorang Muslim. Perbaiki kualitas ibadahmu dan pelajari hukum-hukumnya dari guru yang terpercaya.","Membaca membuka wawasan. Bacalah dengan tenang, pelan-pelan, dan penuh perhatian.","Memahami berarti menyimak dengan sungguh-sungguh. Latih dirimu mendengarkan orang lain sebelum menjawab.","Menerjemahkan butuh ketelitian dan kejujuran. Sampaikan makna apa adanya tanpa menambah atau mengurangi.","Menyampaikan maksud dengan tepat adalah seni. Pilih kata yang baik dan jelas agar tidak menimbulkan salah paham.","Menulis melatih pikiran agar teratur. Tulislah hal-hal yang bermanfaat dan jauhi tulisan yang menyakiti.","Pesan yang sopan menjaga hubungan. Sebelum mengirim pesan, periksa isi dan adabnya.","Percakapan yang baik adalah yang saling mendengar. Jadilah pendengar yang baik sebelum menjadi pembicara.","Ilmu butuh adab. Hormati guru dan sumber ilmu, dan jangan merasa lebih pintar dari mereka.","Proyek yang selesai lahir dari konsistensi. Tetapkan target kecil setiap hari dan selesaikan sampai tuntas.","Evaluasi bukan akhir, melainkan awal perbaikan. Syukuri yang sudah dicapai, lalu teruslah belajar dan amalkan ilmu yang bermanfaat."];

const TUGAS=["Setiap anggota membuat 3 kalimat dengan fi'il قَرَأَ، كَتَبَ، ذَهَبَ, lalu saling memeriksa harakatnya.","Susun dialog perkenalan 6 baris, lalu peragakan berpasangan.","Tulis paragraf 5 kalimat tentang kegiatan harian, lalu bacakan bergantian.","Setiap anggota menyebut 5 kosakata dari satu modul beserta artinya."];
let K={t:0,d:null,rev:false,sw:false,sh:[],sc:[0,0],tm:null,left:180};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const poolV=()=>Object.values(C).filter(c=>c.vocab).flatMap(c=>c.vocab).filter(v=>v[0].length<20&&!/[؟]/.test(v[0]));
const poolS=m=>Object.values(C).filter(c=>c.ex).flatMap(c=>c.ex).filter(e=>e[0].split(' ').length>=m);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function kNew(){K.rev=false;K.sw=false;clearInterval(K.tm);K.tm=null;K.left=180;const t=KT[K.t][0];
 if(t==='vocab'||t==='tebak')K.d=pick(poolV());else if(t==='susun'){K.d=pick(poolS(3));K.sh=shuf(K.d[0].split(' '))}
 else if(t==='terjemah')K.d=pick(poolS(2));else if(t==='dialog')K.d=pick(DLG);else if(t==='diskusi')K.d=pick(DISK);else K.d=pick(TUGAS)}
function kolab(){if(!K.d)kNew();const t=KT[K.t][0],d=K.d;let b='';
 const btn=(l,f,c)=>`<button class='${c||'alt'}' style='width:100%' onclick='${f}'>${l}</button>`;
 if(t==='vocab')b=`<p>Pemain A menyebut arti ini, Pemain B menyebut kata Arabnya:</p><h2>${d[1]}</h2>${K.rev?`<div class='ar'>${d[0]}</div>`:''}`;
 else if(t==='tebak')b=`<p>Tebak artinya:</p><div class='ar'>${d[0]}</div><button class='alt' style='min-height:40px' onclick="say('${d[0]}')">🔊 Dengarkan</button>${K.rev?`<h2>${d[1]}</h2>`:''}`;
 else if(t==='susun')b=`<p>Susun kata-kata ini menjadi kalimat yang benar:</p><div class='ar'>${K.sh.join('  ·  ')}</div>${K.rev?`<div class='ar' style='color:#0b3d2e'>${d[0]}</div><p>${d[1]}</p>`:''}`;
 else if(t==='terjemah')b=`<p>Terjemahkan kalimat ini:</p><div class='ar'>${d[0]}</div>${K.rev?`<h3>${d[1]}</h3>`:''}`;
 else if(t==='dialog')b=`<p>Peragakan berpasangan. ${btn('Tukar peran','K.sw=!K.sw;render()')}</p><h3>${d[0]}</h3>`+d[1].map(l=>`<div style='margin:6px 0'><small><b>Pemain ${K.sw?(l[0]==='A'?'B':'A'):l[0]}</b></small><div class='ar'>${l[1]}</div>${K.rev?`<small>${l[2]}</small>`:''}</div>`).join('');
 else if(t==='diskusi')b=`<p style='line-height:1.9'>${wrapAr(d)}</p><h2 id='tm' style='text-align:center'>${fmt(K.left)}</h2>${btn('\u23f1 Mulai / Jeda 3 menit','tmToggle()','gold')}`;
 else b=`<p style='line-height:1.9'>${wrapAr(d)}</p>`;
 const needRev=['vocab','tebak','susun','terjemah'].includes(t)||t==='dialog';
 return `<div class='card'><h2>\ud83e\udd1d Ruang Kolaborasi</h2><small>Dimainkan bersama-sama di satu HP, bergantian antar pemain atau tim.</small></div>
 ${btn('\ud83c\udfb2 ACAK TANTANGAN','acak()','gold')}
 <div class='row' style='margin:8px 0'>${KT.map((x,i)=>`<button class='${i===K.t?'':'alt'}' style='flex:1 1 45%;font-size:.8em' onclick='chooseType(${i})'>${x[1]}</button>`).join('')}</div>
 <div class='card'><span class='tag'>${KT[K.t][1]}</span>${b}${needRev&&!K.rev?btn('Tampilkan jawaban','kShow()','gold'):''}${btn('Tantangan berikutnya','nextCh()')}</div>
 <div class='card'><b>Skor</b><div class='row'><div style='text-align:center'>Tim A<h2>${K.sc[0]}</h2><button onclick='kSc(0)'>+1</button></div><div style='text-align:center'>Tim B<h2>${K.sc[1]}</h2><button onclick='kSc(1)'>+1</button></div></div><button class='alt' onclick='K.sc=[0,0];render()'>Reset skor</button></div>`}
function acak(){let n=K.t;while(n===K.t)n=Math.floor(Math.random()*KT.length);K.t=n;kNew();render();window.scrollTo(0,0)}
function chooseType(i){K.t=i;kNew();render()}
function nextCh(){kNew();render()}
function kShow(){K.rev=true;render()}
function kSc(i){K.sc[i]++;render()}
function tmToggle(){if(K.tm){clearInterval(K.tm);K.tm=null}else{K.tm=setInterval(()=>{K.left--;const e=document.getElementById('tm');if(e)e.textContent=fmt(Math.max(0,K.left));if(K.left<=0){clearInterval(K.tm);K.tm=null;alert('Waktu habis!')}},1000)}}
/* ===== PETA ===== */
function peta(){
 const p=Math.round(doneN()/50*100),qz=Object.values(S.scores),b=Object.values(S.best);
 const B=[["Penjelajah Kosakata",doneN()>=1],["Perangkai Kalimat",doneN()>=3],["Sahabat Nahwu",doneN()>=5],["Ahli Mufradat",b.some(x=>x===100)],["Juara Evaluasi",b.filter(x=>x>=80).length>=3]];
 return `<div class="card"><h2>📈 Peta Kemajuan</h2><div class="bar"><i style="width:${p}%"></i></div><p>Progres ${p}% · Selesai: ${doneN()} · Belum: ${50-doneN()}</p><p>Kuis dikerjakan: ${qz.length} · Rata-rata: ${qz.length?Math.round(qz.reduce((a,b)=>a+b,0)/qz.length):"—"}%</p><p>Target harian: ${S.day.d===today()?S.day.n:0}/${S.goal}</p></div>
 <div class="card"><h3>Lencana</h3>${B.map(x=>`<span class="badge ${x[1]?'on':''}">${x[1]?"🏅":"🔒"} ${x[0]}</span>`).join("")}<br><small>Lencana: modul selesai (1/3/5), nilai 100%, dan tiga modul ≥80%.</small></div>
 ${certCard()}<div class="card"><h3>Riwayat belajar</h3>${S.hist.map(h=>`<div>• ${h}</div>`).join("")||"Belum ada."}</div>
 <div class="card"><h3>⭐ Favorit</h3>${Object.keys(S.fav).map(n=>`<button class="alt" onclick="go('mod',${n})">Modul ${n}</button>`).join(" ")||"Belum ada."}</div>`}
function set(){return `<div class="card"><h2>⚙️ Pengaturan</h2>
<button class="alt" onclick="S.big=!S.big;save();theme();render()">Huruf besar: ${S.big?"ON":"OFF"}</button><br>
<button class="alt" onclick="S.hc=!S.hc;save();theme();render()">Kontras tinggi: ${S.hc?"ON":"OFF"}</button><br>
<button class="alt" onclick="cycleRate()">Kecepatan suara: ${({0.6:'Lambat',0.8:'Sedang',1:'Normal'})[S.rate||0.8]||'Sedang'}</button> <button class="alt" onclick="alert('Suara terpasang: '+voiceInfo().all+', suara Arab: '+voiceInfo().ar);say('بِسْمِ اللَّهِ')">🔊 Tes suara</button><br>
<label>Target harian (aktivitas)</label><select onchange="S.goal=+this.value;save();render()">${[1,2,3,5].map(n=>`<option ${S.goal===n?"selected":""}>${n}</option>`).join("")}</select><br><br>
<button class="no" style="background:#c33" onclick="if(!CFD){CFD=1;toast('Tekan sekali lagi untuk menghapus semua progres.');setTimeout(()=>{CFD=0},5000)}else{CFD=0;S={done:{},fav:{},scores:{},hist:[],last:null,big:false,hc:false,goal:1,day:{d:'',n:0},best:{}};save();theme();render()}">Hapus Semua Progres</button></div>
${aiCard()}<div class="card"><small>Progres tersimpan di perangkat ini (localStorage). Untuk banyak pengguna, simpan di database server.</small></div>`}
window.onerror=(m)=>{app.insertAdjacentHTML("afterbegin",`<div class="err">Terjadi kesalahan: ${m}</div>`)};
theme();render();
</script></body></html>
