<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUGHAH CENDEKIA</title>
<link rel="icon" href="data:,">
<style>
:root{--g:#0b3d2e;--t:#1fa89a;--c:#f8f1df;--o:#c9a227;--w:#fff;--tx:#17302a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--tx);font:16px/1.55 system-ui,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.big{font-size:20px}
body.hc{--c:#fff;--tx:#000;--g:#000;--t:#005f56;--o:#7a5c00}
.ar{font-family:'Amiri','Scheherazade New','Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl;font-size:1.6em;line-height:2;text-align:right}
header.hd{background:#04301f!important;padding:0;border-bottom:3px solid #c9a227;box-shadow:0 4px 14px rgba(5,42,29,.35);line-height:0}
header.hd .hd-img{display:block;width:100%;max-width:720px;height:auto;margin:0 auto;aspect-ratio:1200/675;object-fit:cover}
header.hd .hd-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{padding:14px;max-width:760px;margin:auto;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:#fff;border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 3px 12px rgba(11,61,46,.12);border:1px solid rgba(201,162,39,.35)}
button{font:inherit;min-height:48px;padding:10px 16px;border:0;border-radius:14px;background:var(--t);color:#fff;font-weight:600;cursor:pointer;margin:3px 0}
button.gold{background:var(--o);color:#1b1b1b}button.alt{background:#e7efe9;color:var(--g)}
button.opt{display:block;width:100%;text-align:left;background:#f1f6f3;color:var(--tx);border:2px solid transparent}
button.ok{background:#c8f0d2;border-color:#2e9e55}button.no{background:#fbd0d0;border-color:#c33}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--g);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{flex:0 0 auto;min-width:76px;background:transparent;color:#d9efe6;font-size:.72em;padding:4px;margin:0}
nav button.on{background:var(--o);color:#111}
.bar{height:12px;background:#dfe9e3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--o))}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input,select,textarea{width:100%;font:inherit;padding:10px;border:2px solid #cfe0d6;border-radius:12px;background:#fff;color:var(--tx)}
.tag{display:inline-block;background:#fff3c4;color:#6b5200;border-radius:8px;padding:2px 8px;font-size:.8em}
.v{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #cfe0d6;gap:8px}
.badge{display:inline-block;margin:4px;padding:8px 12px;border-radius:20px;background:#e5e5e5;color:#777}.badge.on{background:var(--o);color:#111}
h2,h3{color:var(--g);margin:.4em 0}body.hc h2,body.hc h3{color:#000}
.cert-wrap{max-width:560px;margin:0 auto 12px;box-shadow:0 6px 22px rgba(11,61,46,.25);border-radius:6px;overflow:hidden}
@media print{nav,header,button,a.btnlink,.noprint{display:none!important}@page{margin:0}body{background:#fff;padding:0}main{padding:0;max-width:none;animation:none}.cert-wrap{max-width:none;margin:0;box-shadow:none;border-radius:0;text-align:center}.cert-wrap svg{width:auto!important;max-height:296mm;margin:0 auto}}
.ar{overflow-wrap:anywhere;max-width:100%}
#toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#0b3d2e;color:#fff;padding:12px 14px;border-radius:14px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:pre-wrap;font-size:.9em;display:none}
#lr:empty{display:none}
a.btnlink{display:inline-block;min-height:48px;padding:12px 16px;border-radius:14px;background:#25a85a;color:#fff;font-weight:600;text-decoration:none;margin:3px 0}
.err{background:#fde2e2;color:#7a1111;padding:10px;border-radius:10px}
</style></head><body>

1:{goal:"Mengenal 28 huruf hijaiyah dan membaca harakat dasar.",more:"<b>Bentuk huruf:</b> huruf berubah menurut posisinya (awal, tengah, akhir, atau sendiri), misalnya ب: بـ ـبـ ـب ب. <b>Huruf yang tidak bersambung</b> dengan huruf sesudahnya ada enam: ا د ذ ر ز و. <b>Tanwin</b> (ـً ـٍ ـٌ) adalah harakat ganda yang dibaca an, in, un. <b>Mad (bunyi panjang)</b> dibaca dua ketukan: alif setelah fathah (بَا = baa), ya sukun setelah kasrah (بِي = bii), wawu sukun setelah dhammah (بُو = buu). <b>Latihan:</b> baca كَتَبَ (ka-ta-ba), lalu baca dengan sukun: مَكْتَبٌ (mak-ta-bun).",body:"Huruf hijaiyah ada 28 dan dibaca dari kanan ke kiri. Harakat adalah tanda baca: fathah (garis miring di atas) dibaca 'a', kasrah (di bawah) dibaca 'i', dhammah (seperti wawu kecil) dibaca 'u', sukun (bulat kecil) berarti huruf mati, dan syaddah menandakan huruf dibaca dobel/ditekan.",

2:{goal:"Menguasai kosakata benda sehari-hari.",more:"<b>Tanpa dan dengan ال:</b> kata tanpa ال berarti 'sebuah ...' (كِتَابٌ = sebuah buku), dengan ال berarti '... itu' (الْكِتَابُ = buku itu). Saat ada ال, tanwin hilang. <b>Kelompokkan kosakata</b> agar mudah dihafal. Benda sekolah: كِتَابٌ، قَلَمٌ، مِسْطَرَةٌ (penggaris). Benda rumah: بَيْتٌ، بَابٌ، نَافِذَةٌ (jendela)، كُرْسِيٌّ (kursi)، طَاوِلَةٌ (meja). Alam: مَاءٌ، شَمْسٌ (matahari)، قَمَرٌ (bulan).",body:"Mulailah dari benda yang terlihat di sekitar. Kebanyakan kata benda ditulis dengan tanwin (ـٌ) bila belum ditentukan, misalnya كِتَابٌ 'sebuah buku'.",

3:{goal:"Mengenal kata ganti (dhamir) dan penggunaannya.",more:"<b>Daftar lengkap dhamir terpisah:</b> أَنَا (saya), نَحْنُ (kami/kita), أَنْتَ (kamu lk), أَنْتِ (kamu pr), أَنْتُمَا (kalian berdua), أَنْتُمْ (kalian lk), أَنْتُنَّ (kalian pr), هُوَ (dia lk), هِيَ (dia pr), هُمَا (mereka berdua), هُمْ (mereka lk), هُنَّ (mereka pr). <b>Dhamir yang menempel</b> di akhir kata menunjukkan kepemilikan: كِتَابِي (bukuku), كِتَابُكَ (bukumu), كِتَابُهُ (bukunya). Perhatikan: أَنْتَ dan أَنْتِ hanya berbeda pada harakat akhir.",body:"Dhamir menggantikan orang. Bahasa Arab membedakan laki-laki (mudzakkar) dan perempuan (muannats), serta tunggal dan jamak.",

4:{goal:"Memahami isim (kata benda) dan ciri-cirinya.",more:"<b>Nakirah dan ma'rifah:</b> isim nakirah bersifat umum dan biasanya bertanwin (رَجُلٌ = seorang laki-laki). Isim ma'rifah bersifat tertentu: memakai ال (الرَّجُلُ = laki-laki itu), nama diri (مُحَمَّدٌ), atau dhamir. <b>Jenis isim:</b> mudzakkar (كِتَابٌ) dan muannats yang sering berakhiran ta marbuthah (مَدْرَسَةٌ، طَالِبَةٌ). <b>Ciri isim:</b> bisa bertanwin, bisa diberi ال, bisa didahului huruf jar, dan bisa menjadi mubtada atau fa'il.",body:"Isim adalah kata yang menunjukkan nama orang, benda, tempat, atau sifat tanpa terikat waktu. Ciri umumnya: bertanwin, diawali alif-lam (ال), atau didahului huruf jar.",

5:{goal:"Memahami fi'il (kata kerja) dan tiga bentuk dasarnya.",more:"<b>Akar kata:</b> kebanyakan fi'il berakar tiga huruf; dari ك-ت-ب lahir كَتَبَ (madhi), يَكْتُبُ (mudhari'), اُكْتُبْ (amr). <b>Ciri fi'il:</b> bisa didahului قَدْ (sudah) atau سَـ/سَوْفَ (akan), dan fi'il madhi bisa berakhiran ta ta'nits sukun (كَتَبَتْ = dia pr telah menulis). <b>Awalan mudhari':</b> أ ن ي ت menunjukkan pelaku: أَكْتُبُ (saya menulis), نَكْتُبُ (kami menulis), يَكْتُبُ (dia lk menulis), تَكْتُبُ (kamu atau dia pr menulis).",body:"Fi'il adalah kata yang menunjukkan perbuatan dan terikat waktu. Madhi = lampau (كَتَبَ), mudhari' = sekarang/akan datang (يَكْتُبُ), amr = perintah (اُكْتُبْ).",

6:{goal:"Menggunakan kata tunjuk untuk menunjuk benda dekat dan jauh.",body:"Isim isyarah menunjuk sesuatu. Untuk benda dekat: هٰذَا (laki-laki/mudzakkar) dan هٰذِهِ (perempuan/muannats). Untuk benda jauh: ذٰلِكَ (mudzakkar) dan تِلْكَ (muannats). Pilih sesuai jenis benda yang ditunjuk.",more:"<b>Dua benda:</b> هٰذَانِ (dua benda mudzakkar) dan هَاتَانِ (dua benda muannats). <b>Dengan ال:</b> bila kata sesudahnya memakai ال, hasilnya frasa: هٰذَا الْكِتَابُ = buku ini. Tanpa ال, hasilnya kalimat utuh: هٰذَا كِتَابٌ = ini sebuah buku. <b>Jamak:</b> هٰؤُلَاءِ (mereka ini) dan أُولٰئِكَ (mereka itu) untuk manusia jamak: هٰؤُلَاءِ طُلَّابٌ = mereka ini para siswa. Untuk jamak benda mati, pakai هٰذِهِ: هٰذِهِ كُتُبٌ = ini buku-buku. <b>Kesesuaian:</b> isim isyarah mengikuti jenis benda yang ditunjuk: هٰذَا الْقَلَمُ (mudzakkar), هٰذِهِ الْمَدْرَسَةُ (muannats).",vocab:[["هٰذَا","ini (mudzakkar)"],["هٰذِهِ","ini (muannats)"],["ذٰلِكَ","itu (mudzakkar)"],["تِلْكَ","itu (muannats)"],["هٰؤُلَاءِ","mereka ini (jamak)"],["هٰذَانِ","ini (dua, mudzakkar)"],["هَاتَانِ","ini (dua, muannats)"],["أُولٰئِكَ","mereka itu (jamak)"]],ex:[["هٰذَا قَلَمٌ","Ini sebuah pena."],["هٰذِهِ مَدْرَسَةٌ","Ini sebuah sekolah."],["ذٰلِكَ بَيْتٌ","Itu sebuah rumah."],["هٰذَا الْكِتَابُ جَدِيدٌ","Buku ini baru."],["تِلْكَ حَقِيبَةٌ","Itu sebuah tas."],["هٰؤُلَاءِ طُلَّابٌ","Mereka ini para siswa."],["هٰذِهِ الْمَدْرَسَةُ كَبِيرَةٌ","Sekolah ini besar."],["هٰذِهِ كُتُبٌ","Ini buku-buku."]],quiz:[q("هٰذَا artinya…",["Ini (mudzakkar)","Itu (muannats)","Mereka"],0,"هٰذَا = ini untuk mudzakkar."),q("Untuk benda perempuan yang dekat, gunakan…",["هٰذَا","هٰذِهِ","ذٰلِكَ"],1,"هٰذِهِ = ini (muannats)."),q("ذٰلِكَ digunakan untuk benda yang…",["Dekat","Jauh","Banyak saja"],1,"ذٰلِكَ = itu (jauh)."),q("تِلْكَ artinya…",["Itu (muannats)","Ini (mudzakkar)","Dia"],0,"تِلْكَ = itu untuk muannats."),q("Pilih yang tepat: ___ قَلَمٌ (Ini pena)",["هٰذِهِ","هٰذَا","تِلْكَ"],1,"قَلَمٌ mudzakkar, jadi هٰذَا."),q("هٰذَا الْكِتَابُ artinya…",["Buku ini","Ini sebuah buku","Buku itu"],0,"Isim isyarah + isim ber-ال = frasa: buku ini."),q("هٰذَا كِتَابٌ artinya…",["Ini sebuah buku","Buku ini","Buku itu"],0,"Tanpa ال pada kata kedua, kalimatnya utuh: ini sebuah buku."),q("Pilih yang tepat: ___ حَقِيبَةٌ (Itu sebuah tas)",["تِلْكَ","ذٰلِكَ","هٰذَا"],0,"حَقِيبَةٌ muannats dan jauh, jadi تِلْكَ."),q("أُولٰئِكَ artinya…",["Mereka itu","Mereka ini","Itu (muannats)"],0,"أُولٰئِكَ = mereka itu (jauh, jamak)."),q("هٰذِهِ الْمَدْرَسَةُ كَبِيرَةٌ artinya…",["Sekolah ini besar","Ini sebuah sekolah","Sekolah itu kecil"],0,"Isim isyarah + kata ber-ال = frasa, lalu khabar: sekolah ini besar."),q("Pilih yang tepat: ___ طُلَّابٌ (Mereka ini para siswa)",["هٰؤُلَاءِ","هٰذَا","ذٰلِكَ"],0,"Jamak manusia dekat = هٰؤُلَاءِ."),q("Untuk jamak benda mati (misalnya كُتُبٌ), isim isyarah yang dipakai…",["هٰذِهِ","هٰذَا","هٰذَانِ"],0,"Jamak benda mati diperlakukan sebagai muannats tunggal: هٰذِهِ كُتُبٌ.")]},
7:{goal:"Mengenal kata tanya dan cara membuat pertanyaan sederhana.",body:"Istifham adalah kata tanya yang biasanya ada di awal kalimat. Jawaban diawali dengan jawaban langsung, misalnya مَا هٰذَا؟ dijawab هٰذَا قَلَمٌ.",more:"<b>Orang dan benda:</b> مَنْ untuk orang (siapa), مَا untuk benda (apa). Kata tanya biasanya ada di awal kalimat dan tidak mengubah susunan kata sesudahnya: أَيْنَ الْكِتَابُ؟ (di mana bukunya?). Pertanyaan ya atau tidak memakai هَلْ (lihat Modul 47). <b>Kata tanya majemuk:</b> kata tanya bisa didahului harf jar: مِنْ أَيْنَ؟ (dari mana?), إِلَى أَيْنَ؟ (ke mana?). <b>Bedakan:</b> مَنْ هٰذَا؟ menanyakan orang (jawab: هٰذَا مُحَمَّدٌ), sedangkan مَا هٰذَا؟ menanyakan benda (jawab: هٰذَا قَلَمٌ). Jawaban singkat cukup menyebut bagian yang ditanyakan.",vocab:[["مَا","apa"],["مَنْ","siapa"],["أَيْنَ","di mana"],["مَتَى","kapan"],["كَيْفَ","bagaimana"],["كَمْ","berapa"],["لِمَاذَا","mengapa"],["مَاذَا","apa (sebelum kata kerja)"],["مِنْ أَيْنَ","dari mana"],["إِلَى أَيْنَ","ke mana"]],ex:[["مَا هٰذَا؟","Apa ini?"],["مَنْ هُوَ؟","Siapa dia?"],["أَيْنَ الْكِتَابُ؟","Di mana bukunya?"],["كَيْفَ حَالُكَ؟","Apa kabarmu?"],["مَتَى تَذْهَبُ؟","Kapan kamu pergi?"],["مَنْ هٰذَا؟","Siapa ini?"],["مِنْ أَيْنَ أَنْتَ؟","Kamu dari mana?"],["إِلَى أَيْنَ تَذْهَبُ؟","Ke mana kamu pergi?"]],quiz:[q("مَنْ artinya…",["Apa","Siapa","Kapan"],1,"مَنْ = siapa."),q("أَيْنَ artinya…",["Di mana","Mengapa","Berapa"],0,"أَيْنَ = di mana."),q("Untuk menanyakan jumlah, gunakan…",["كَمْ","مَتَى","مَا"],0,"كَمْ = berapa."),q("كَيْفَ artinya…",["Bagaimana","Kapan","Siapa"],0,"كَيْفَ = bagaimana."),q("لِمَاذَا digunakan untuk menanyakan…",["Alasan","Waktu","Tempat"],0,"لِمَاذَا = mengapa (alasan)."),q("مَتَى تَذْهَبُ؟ artinya…",["Kapan kamu pergi?","Ke mana kamu pergi?","Siapa yang pergi?"],0,"مَتَى = kapan."),q("Untuk menanyakan orang digunakan…",["مَنْ","مَا","كَمْ"],0,"مَنْ = siapa (orang), مَا = apa (benda)."),q("مَا هٰذَا؟ dijawab dengan…",["هٰذَا قَلَمٌ","نَعَمْ","أَنَا طَالِبٌ"],0,"Pertanyaan tentang benda dijawab dengan menyebut bendanya."),q("مِنْ أَيْنَ أَنْتَ؟ artinya…",["Kamu dari mana?","Kamu ke mana?","Siapa kamu?"],0,"مِنْ = dari, أَيْنَ = di mana, jadi: dari mana."),q("إِلَى أَيْنَ تَذْهَبُ؟ artinya…",["Ke mana kamu pergi?","Dari mana kamu datang?","Kapan kamu pergi?"],0,"إِلَى = ke, أَيْنَ = di mana."),q("Untuk menanyakan 'Siapa ini?' (seseorang), gunakan…",["مَنْ هٰذَا؟","مَا هٰذَا؟","كَمْ هٰذَا؟"],0,"Orang ditanyakan dengan مَنْ."),q("مَنْ هٰذَا؟ paling tepat dijawab…",["هٰذَا مُحَمَّدٌ","هٰذَا قَلَمٌ","فِي الْبَيْتِ"],0,"Pertanyaan tentang orang dijawab dengan menyebut orangnya.")]},
8:{goal:"Mengenal huruf jar dan pengaruhnya pada kata sesudahnya.",body:"Harf jar adalah kata depan. Isim sesudahnya menjadi majrur, ditandai kasrah di akhir kata, misalnya فِي الْبَيْتِ (di dalam rumah).",more:"<b>Pola:</b> harf jar + isim: فِي الْمَدْرَسَةِ (di sekolah), مِنَ الْبَيْتِ (dari rumah), عَلَى الْمَكْتَبِ (di atas meja). <b>Catatan:</b> مِنْ menjadi مِنَ sebelum ال agar tidak bertemu dua sukun. Isim nakirah setelah harf jar bertanwin kasrah: فِي بَيْتٍ (di sebuah rumah). <b>Harf jar satu huruf:</b> بِ (dengan, memakai) dan لِ (untuk, milik) menempel pada kata sesudahnya: بِالْقَلَمِ (dengan pena), لِلطَّالِبِ (untuk siswa itu). Bila لِ bertemu ال, alif pada ال hilang: لِ + الطَّالِبِ = لِلطَّالِبِ. Kata sesudahnya tetap majrur (kasrah).",vocab:[["فِي","di / di dalam"],["مِنْ","dari"],["إِلَى","ke"],["عَلَى","di atas / pada"],["عَنْ","tentang / dari"],["حَقِيبَةٌ","tas"],["مَكْتَبٌ","meja tulis / kantor"],["كُرْسِيٌّ","kursi"],["بِ","dengan / memakai"],["لِ","untuk / milik"]],ex:[["الْكِتَابُ فِي الْحَقِيبَةِ","Bukunya di dalam tas."],["ذَهَبَ إِلَى الْمَدْرَسَةِ","Ia pergi ke sekolah."],["الْقَلَمُ عَلَى الْمَكْتَبِ","Pena itu di atas meja."],["جَاءَ الطَّالِبُ مِنَ الْبَيْتِ","Siswa itu datang dari rumah."],["كَتَبَ بِالْقَلَمِ","Ia menulis dengan pena."],["هٰذَا الْكِتَابُ لِلطَّالِبِ","Buku ini milik siswa itu."],["هٰذِهِ هَدِيَّةٌ لِلْمُعَلِّمِ","Ini hadiah untuk guru itu."]],quiz:[q("إِلَى artinya…",["Dari","Ke","Di atas"],1,"إِلَى = ke."),q("مِنْ artinya…",["Dari","Ke","Di dalam"],0,"مِنْ = dari."),q("فِي artinya…",["Di atas","Di dalam","Tentang"],1,"فِي = di/di dalam."),q("Isim setelah harf jar berharakat akhir…",["Kasrah","Fathah","Sukun"],0,"Isim setelah harf jar majrur (kasrah)."),q("عَلَى artinya…",["Di atas","Dari","Mengapa"],0,"عَلَى = di atas/pada."),q("مِنَ الْبَيْتِ artinya…",["Dari rumah","Ke rumah","Di dalam rumah"],0,"مِنْ = dari, dan menjadi مِنَ sebelum ال."),q("Pilih yang tepat: الْقَلَمُ ___ الْمَكْتَبِ (di atas meja)",["عَلَى","مِنْ","عَنْ"],0,"عَلَى = di atas."),q("بِالْقَلَمِ artinya…",["Dengan pena","Dari pena","Di atas pena"],0,"بِ = dengan; الْقَلَمِ majrur."),q("لِ pada لِلْمُعَلِّمِ bermakna…",["Untuk / milik","Dari","Tentang"],0,"لِ = untuk atau milik."),q("Pilih yang tepat: كَتَبَ ___ الْقَلَمِ (Ia menulis dengan pena)",["بِ","فِي","إِلَى"],0,"Alat dinyatakan dengan بِ."),q("لِ + الطَّالِبِ ditulis…",["لِلطَّالِبِ","لِالطَّالِبِ","لَالطَّالِبِ"],0,"Alif ال hilang setelah لِ: لِلطَّالِبِ.")]},
9:{goal:"Memakai kata sifat dan lawan katanya.",body:"Kata sifat (na'at) diletakkan setelah kata yang disifati dan menyesuaikan jenisnya: بَيْتٌ كَبِيرٌ (rumah besar), مَدْرَسَةٌ كَبِيرَةٌ (sekolah besar). Hafalkan sepasang lawan kata sekaligus.",more:"<b>Kesesuaian lengkap:</b> kata sifat mengikuti jenis, jumlah, i'rab, dan ma'rifah atau nakirah (lihat Modul 25): بَيْتٌ كَبِيرٌ (rumah besar), الْبَيْتُ الْكَبِيرُ (rumah yang besar itu). <b>Bedakan:</b> الْبَيْتُ كَبِيرٌ = rumah itu besar (kalimat). Hafalkan lawan kata berpasangan: جَدِيدٌ ≠ قَدِيمٌ, طَوِيلٌ ≠ قَصِيرٌ. <b>Membentuk muannats:</b> kata sifat muannats umumnya diberi ta marbuthah: كَبِيرٌ menjadi كَبِيرَةٌ, جَدِيدٌ menjadi جَدِيدَةٌ. Pasangan baru untuk dihafal: قَرِيبٌ ≠ بَعِيدٌ (dekat ≠ jauh), نَظِيفٌ ≠ وَسِخٌ (bersih ≠ kotor). <b>Frasa atau kalimat:</b> tanpa ال pada sifat dan tanpa pemisah (بَيْتٌ كَبِيرٌ) adalah frasa; bila keduanya ber-ال (الْبَيْتُ الْكَبِيرُ) tetap frasa; bila hanya kata pertama ber-ال (الْبَيْتُ كَبِيرٌ) menjadi kalimat.",vocab:[["كَبِيرٌ","besar"],["صَغِيرٌ","kecil"],["طَوِيلٌ","panjang / tinggi"],["قَصِيرٌ","pendek"],["جَدِيدٌ","baru"],["قَدِيمٌ","lama"],["سَهْلٌ","mudah"],["صَعْبٌ","sulit"],["جَمِيلٌ","indah / cantik"],["ثَقِيلٌ","berat"],["خَفِيفٌ","ringan"],["قَرِيبٌ","dekat"],["بَعِيدٌ","jauh"],["نَظِيفٌ","bersih"],["وَسِخٌ","kotor"],["غُرْفَةٌ","kamar"]],ex:[["بَيْتٌ كَبِيرٌ","Rumah yang besar."],["مَدْرَسَةٌ جَدِيدَةٌ","Sekolah yang baru."],["الْبَيْتُ الْكَبِيرُ جَمِيلٌ","Rumah yang besar itu indah."],["الْحَقِيبَةُ ثَقِيلَةٌ","Tas itu berat."],["الْمَدْرَسَةُ بَعِيدَةٌ","Sekolah itu jauh."],["غُرْفَةٌ نَظِيفَةٌ","Sebuah kamar yang bersih."],["الْبَيْتُ قَرِيبٌ","Rumah itu dekat."]],quiz:[q("Lawan kata كَبِيرٌ adalah…",["صَغِيرٌ","جَدِيدٌ","سَهْلٌ"],0,"كَبِيرٌ (besar) >< صَغِيرٌ (kecil)."),q("جَدِيدٌ artinya…",["Lama","Baru","Sulit"],1,"جَدِيدٌ = baru."),q("Lawan kata سَهْلٌ adalah…",["صَعْبٌ","قَصِيرٌ","قَدِيمٌ"],0,"سَهْلٌ (mudah) >< صَعْبٌ (sulit)."),q("قَصِيرٌ artinya…",["Panjang","Pendek","Besar"],1,"قَصِيرٌ = pendek."),q("Kata sifat diletakkan…",["Sebelum yang disifati","Sesudah yang disifati","Di akhir paragraf"],1,"Na'at diletakkan setelah man'ut."),q("جَمِيلٌ artinya…",["Indah","Berat","Pendek"],0,"جَمِيلٌ = indah / cantik."),q("الْحَقِيبَةُ ثَقِيلَةٌ artinya…",["Tas itu berat","Tas itu baru","Tas itu kecil"],0,"ثَقِيلَةٌ = berat, muannats mengikuti حَقِيبَةٌ."),q("Lawan kata ثَقِيلٌ adalah…",["خَفِيفٌ","كَبِيرٌ","قَدِيمٌ"],0,"ثَقِيلٌ (berat) >< خَفِيفٌ (ringan)."),q("Lawan kata قَرِيبٌ adalah…",["بَعِيدٌ","نَظِيفٌ","قَدِيمٌ"],0,"قَرِيبٌ (dekat) >< بَعِيدٌ (jauh)."),q("نَظِيفٌ artinya…",["Bersih","Kotor","Jauh"],0,"نَظِيفٌ = bersih."),q("Pilih yang tepat: غُرْفَةٌ ___ (Sebuah kamar yang bersih)",["نَظِيفَةٌ","نَظِيفٌ","نَظِيفُونَ"],0,"غُرْفَةٌ muannats, sifatnya muannats."),q("الْبَيْتُ الْكَبِيرُ termasuk…",["Frasa (rumah yang besar)","Kalimat (rumah itu besar)","Pertanyaan"],0,"Kedua kata ber-ال = frasa."),q("الْبَيْتُ كَبِيرٌ termasuk…",["Kalimat (rumah itu besar)","Frasa (rumah yang besar)","Pertanyaan"],0,"Kata pertama ber-ال, kedua tanwin = kalimat.")]},
10:{goal:"Menyusun kalimat sederhana dari kosakata yang sudah dipelajari.",body:"Ada dua pola dasar. Kalimat ismiyah dimulai dengan isim: الْبَيْتُ كَبِيرٌ. Kalimat fi'liyah dimulai dengan fi'il: ذَهَبَ مُحَمَّدٌ إِلَى الْمَدْرَسَةِ.",more:"<b>Langkah:</b> (1) tentukan pelaku atau topik, (2) pilih pola ismiyah atau fi'liyah, (3) cocokkan jenis kata (mudzakkar atau muannats), (4) tambahkan keterangan tempat dengan harf jar. Contoh: الطَّالِبُ فِي الْفَصْلِ (ismiyah), ذَهَبَ الطَّالِبُ إِلَى الْفَصْلِ (fi'liyah). <b>Kesesuaian fi'il:</b> bila pelakunya muannats, fi'il diberi ت: ذَهَبَتِ الطَّالِبَةُ إِلَى الْمَكْتَبَةِ. Bila fi'il mendahului pelaku jamak, fi'il tetap tunggal: جَلَسَ الطُّلَّابُ فِي الْفَصْلِ. <b>Perbandingan:</b> الطَّالِبُ ذَهَبَ (ismiyah, menekankan pelaku) dan ذَهَبَ الطَّالِبُ (fi'liyah, menekankan perbuatan).",vocab:[["جُمْلَةٌ","kalimat"],["طَالِبٌ","siswa"],["مُعَلِّمٌ","guru"],["فَصْلٌ","kelas"],["فِي الْفَصْلِ","di kelas"],["إِلَى الْبَيْتِ","ke rumah"],["مَكْتَبَةٌ","perpustakaan"],["جَلَسَ","telah duduk"]],ex:[["الْكِتَابُ جَدِيدٌ","Bukunya baru."],["ذَهَبَ الطَّالِبُ إِلَى الْفَصْلِ","Siswa itu pergi ke kelas."],["الْمُعَلِّمُ فِي الْفَصْلِ","Guru itu ada di kelas."],["الْمَدْرَسَةُ كَبِيرَةٌ","Sekolah itu besar."],["ذَهَبَتِ الطَّالِبَةُ إِلَى الْمَكْتَبَةِ","Siswi itu pergi ke perpustakaan."],["جَلَسَ الطُّلَّابُ فِي الْفَصْلِ","Para siswa duduk di kelas."]],quiz:[q("Kalimat yang dimulai dengan isim disebut…",["Ismiyah","Fi'liyah","Istifham"],0,"Dimulai isim = jumlah ismiyah."),q("Kalimat yang dimulai dengan fi'il disebut…",["Ismiyah","Fi'liyah","Isyarah"],1,"Dimulai fi'il = jumlah fi'liyah."),q("الْكِتَابُ جَدِيدٌ artinya…",["Bukunya baru","Bukunya besar","Ia membaca buku"],0,"Buku itu baru."),q("ذَهَبَ الطَّالِبُ إِلَى الْفَصْلِ termasuk…",["Ismiyah","Fi'liyah","Pertanyaan"],1,"Dimulai dengan fi'il ذَهَبَ."),q("Pilih yang tepat: هٰذِهِ ___ (ini sekolah)",["كِتَابٌ","مَدْرَسَةٌ","قَلَمٌ"],1,"هٰذِهِ untuk muannats, مَدْرَسَةٌ muannats."),q("الطَّالِبُ فِي الْفَصْلِ termasuk…",["Ismiyah","Fi'liyah","Pertanyaan"],0,"Diawali isim الطَّالِبُ."),q("Pilih yang tepat: الْمَدْرَسَةُ ___ (Sekolah itu besar)",["كَبِيرَةٌ","كَبِيرٌ","كَبِيرُونَ"],0,"مَدْرَسَةٌ muannats, sifatnya muannats."),q("Susunan yang benar untuk 'Guru itu pergi ke rumah':",["ذَهَبَ الْمُعَلِّمُ إِلَى الْبَيْتِ","إِلَى الْبَيْتِ الْمُعَلِّمُ ذَهَبَ","الْبَيْتِ ذَهَبَ إِلَى الْمُعَلِّمُ"],0,"Pola fi'liyah: fi'il + fa'il + keterangan."),q("Pilih yang tepat: ___ الطَّالِبَةُ إِلَى الْمَكْتَبَةِ (Siswi itu pergi ke perpustakaan)",["ذَهَبَتْ","ذَهَبَ","ذَهَبُوا"],0,"Pelaku muannats, fi'il diberi ت: ذَهَبَتْ (ذَهَبَتِ sebelum ال)."),q("جَلَسَ الطُّلَّابُ فِي الْفَصْلِ termasuk…",["Fi'liyah","Ismiyah","Pertanyaan"],0,"Diawali fi'il جَلَسَ."),q("Fi'il yang mendahului pelaku jamak bentuknya…",["Tetap tunggal","Selalu jamak","Selalu muannats"],0,"Fi'il di depan fa'il jamak tetap tunggal: جَلَسَ الطُّلَّابُ."),q("مَكْتَبَةٌ artinya…",["Perpustakaan","Meja tulis","Kelas"],0,"مَكْتَبَةٌ = perpustakaan; مَكْتَبٌ = meja tulis/kantor.")]},
11:{goal:"Memahami jumlah ismiyah (kalimat yang diawali isim).",body:"Jumlah ismiyah dimulai dengan isim dan terdiri dari dua unsur: mubtada (yang dibicarakan) dan khabar (keterangannya). Keduanya marfu', ditandai dhammah atau tanwin dhammah. Mubtada biasanya isim ma'rifah (tertentu), sedangkan khabar boleh nakirah. Contoh: الْبَيْتُ كَبِيرٌ = rumah itu besar.",more:"<b>Pola:</b> mubtada + khabar. Kalimat ismiyah tidak memakai kata 'adalah' dalam bahasa Arab, jadi الطَّالِبُ مُجْتَهِدٌ langsung berarti 'siswa itu rajin'. <b>Bentuk khabar:</b> khabar bisa berupa kata sifat (الْبَيْتُ كَبِيرٌ), isim biasa (هُوَ مُعَلِّمٌ), atau harf jar dan majrur (الْكِتَابُ عَلَى الْمَكْتَبِ). Mubtada juga boleh berupa dhamir terpisah: هُوَ مُعَلِّمٌ = dia seorang guru. <b>Ma'rifah dan nakirah:</b> mubtada ber-ال (ma'rifah), khabar biasanya tanwin (nakirah): الطَّالِبُ مُجْتَهِدٌ. Bila keduanya ber-ال, bacaannya berubah menjadi frasa, bukan kalimat.",vocab:[["جُمْلَةٌ اِسْمِيَّةٌ","kalimat nominal"],["مُبْتَدَأٌ","yang dibicarakan (subjek)"],["خَبَرٌ","keterangan / predikat"],["مَرْفُوعٌ","berharakat dhammah"],["مُجْتَهِدٌ","rajin"],["هُوَ مُعَلِّمٌ","dia seorang guru"]],ex:[["الْمَدْرَسَةُ جَدِيدَةٌ","Sekolah itu baru."],["الطَّالِبُ مُجْتَهِدٌ","Siswa itu rajin."],["مُحَمَّدٌ فِي الْفَصْلِ","Muhammad ada di kelas."],["هُوَ مُعَلِّمٌ","Dia seorang guru."],["الْكِتَابُ عَلَى الْمَكْتَبِ","Buku itu di atas meja."]],quiz:[q("Jumlah ismiyah adalah kalimat yang diawali…",["Fi'il","Isim","Huruf jar"],1,"Ismiyah = diawali isim."),q("Dua unsur utama jumlah ismiyah adalah…",["Fi'il dan fa'il","Mubtada dan khabar","Na'at dan man'ut"],1,"Mubtada dan khabar."),q("الْبَيْتُ كَبِيرٌ artinya…",["Rumah itu besar","Ia pergi ke rumah","Rumah baru"],0,"الْبَيْتُ = rumah itu, كَبِيرٌ = besar."),q("Mubtada biasanya berupa isim yang…",["Ma'rifah (tertentu)","Selalu jamak","Selalu fi'il"],0,"Mubtada umumnya ma'rifah."),q("Harakat akhir mubtada dan khabar (tunggal) adalah…",["Dhammah / tanwin dhammah","Fathah","Kasrah"],0,"Keduanya marfu' (dhammah)."),q("Mubtada pada هُوَ مُعَلِّمٌ adalah…",["هُوَ","مُعَلِّمٌ","Tidak ada"],0,"هُوَ (dhamir) berfungsi sebagai mubtada; مُعَلِّمٌ khabarnya."),q("Khabar pada الْكِتَابُ عَلَى الْمَكْتَبِ adalah…",["عَلَى الْمَكْتَبِ","الْكِتَابُ","Tidak ada"],0,"Harf jar dan majrur bisa menjadi khabar."),q("الطَّالِبُ مُجْتَهِدٌ artinya…",["Siswa itu rajin","Siswa yang rajin","Siswa itu pergi"],0,"Mubtada ber-ال + khabar tanwin = kalimat: siswa itu rajin."),q("Dalam kalimat ismiyah bahasa Arab, kata 'adalah'…",["Tidak dipakai","Wajib ditulis","Ditulis di awal"],0,"Cukup mubtada + khabar, tanpa kata 'adalah'.")]},
12:{goal:"Memahami mubtada dan khabar serta kesesuaian keduanya.",body:"Khabar harus sesuai dengan mubtada dalam jenis (mudzakkar atau muannats) dan jumlah. Mubtada mudzakkar memakai khabar mudzakkar, mubtada muannats memakai khabar muannats (biasanya berakhiran ta marbuthah). Khabar juga boleh berupa harf jar dan majrur, seperti فِي الْحَقِيبَةِ.",more:"<b>Contoh kesesuaian:</b> الْوَلَدُ مُجْتَهِدٌ (anak lk rajin), الْبِنْتُ مُجْتَهِدَةٌ (anak pr rajin). <b>Catatan:</b> untuk jamak benda mati, khabar memakai muannats tunggal (lihat Modul 15). <b>Khabar berupa keterangan tempat:</b> الْكِتَابُ فِي الْحَقِيبَةِ (bukunya di dalam tas). <b>Kesesuaian jumlah:</b> mubtada mutsanna memakai khabar mutsanna: الطَّالِبَانِ مُجْتَهِدَانِ (dua siswa itu rajin). Mubtada jamak manusia memakai khabar jamak: الْمُعَلِّمُونَ نَشِيطُونَ (para guru itu aktif). Sedangkan jamak benda mati memakai khabar muannats tunggal: الْكُتُبُ جَدِيدَةٌ.",vocab:[["وَلَدٌ","anak laki-laki"],["بِنْتٌ","anak perempuan"],["مُجْتَهِدَةٌ","rajin (perempuan)"],["نَشِيطٌ","aktif (laki-laki)"],["نَشِيطَةٌ","aktif (perempuan)"],["مُجْتَهِدَانِ","rajin (dua orang)"],["مُجْتَهِدُونَ","rajin (jamak lk)"],["نَشِيطُونَ","aktif (jamak lk)"]],ex:[["الْمُعَلِّمَةُ نَشِيطَةٌ","Guru perempuan itu aktif."],["الْبِنْتُ مُجْتَهِدَةٌ","Anak perempuan itu rajin."],["الْكِتَابُ فِي الْحَقِيبَةِ","Bukunya di dalam tas."],["الطَّالِبَانِ مُجْتَهِدَانِ","Dua siswa itu rajin."],["الْمُعَلِّمُونَ نَشِيطُونَ","Para guru itu aktif."]],quiz:[q("Pada الطَّالِبَةُ مُجْتَهِدَةٌ, khabarnya adalah…",["الطَّالِبَةُ","مُجْتَهِدَةٌ","Tidak ada"],1,"مُجْتَهِدَةٌ adalah khabar."),q("Khabar harus sesuai dengan mubtada dalam…",["Jenis dan jumlah","Warna","Panjang kata"],0,"Sesuai jenis dan jumlah."),q("مُجْتَهِدَةٌ digunakan untuk…",["Laki-laki","Perempuan","Jamak laki-laki"],1,"Ta marbuthah menandakan muannats."),q("Contoh khabar berupa harf jar dan majrur adalah…",["الْكِتَابُ فِي الْحَقِيبَةِ","ذَهَبَ الْوَلَدُ","اُكْتُبْ"],0,"فِي الْحَقِيبَةِ menjadi khabar."),q("Pilih yang benar: الْمُعَلِّمَةُ ___",["نَشِيطٌ","نَشِيطَةٌ","نَشِيطُونَ"],1,"Mubtada muannats, khabar muannats."),q("Pilih yang benar: الطَّالِبَانِ ___",["مُجْتَهِدَانِ","مُجْتَهِدٌ","مُجْتَهِدَةٌ"],0,"Mubtada mutsanna, khabar mutsanna."),q("Pilih yang benar: الْمُعَلِّمُونَ ___",["نَشِيطُونَ","نَشِيطٌ","نَشِيطَةٌ"],0,"Mubtada jamak mudzakkar salim, khabar jamak."),q("Pilih yang benar: الْكُتُبُ ___",["جَدِيدَةٌ","جَدِيدُونَ","جَدِيدٌ"],0,"Jamak benda mati memakai muannats tunggal."),q("مُجْتَهِدُونَ digunakan untuk…",["Jamak laki-laki","Dua orang","Perempuan tunggal"],0,"Akhiran ـُونَ = jamak mudzakkar salim.")]},
13:{goal:"Memahami jumlah fi'liyah (kalimat yang diawali fi'il).",body:"Jumlah fi'liyah dimulai dengan fi'il, lalu fa'il (pelaku) yang marfu'. Kadang ada maf'ul bih (objek) dan keterangan. Jika pelakunya perempuan, fi'il madhi diberi ta ta'nits sukun: جَلَسَتِ الطَّالِبَةُ. Fi'il tetap bentuk tunggal meski fa'il-nya jamak: ذَهَبَ الطُّلَّابُ.",more:"<b>Bandingkan:</b> الطَّالِبُ ذَهَبَ (ismiyah, diawali isim) dan ذَهَبَ الطَّالِبُ (fi'liyah, diawali fi'il). Artinya sama-sama 'siswa itu pergi', tetapi jenis kalimatnya berbeda. <b>Ta ta'nits:</b> bila fa'il ber-ال, ت diberi kasrah agar tidak bertemu dua sukun: جَلَسَتِ الطَّالِبَةُ. Bila fa'il tidak ber-ال, ت tetap sukun: خَرَجَتْ فَاطِمَةُ مِنَ الْبَيْتِ. <b>Fa'il jamak:</b> fi'il tetap tunggal: ذَهَبَ الطُّلَّابُ إِلَى الْمَسْجِدِ.",vocab:[["جَلَسَ","telah duduk"],["دَخَلَ","telah masuk"],["خَرَجَ","telah keluar"],["فَتَحَ","telah membuka"],["فَاعِلٌ","pelaku"],["ذَهَبَ","telah pergi"],["كَتَبَ","telah menulis"]],ex:[["جَلَسَ الْمُعَلِّمُ","Guru itu telah duduk."],["دَخَلَ الطَّالِبُ الْفَصْلَ","Siswa itu masuk kelas."],["جَلَسَتِ الطَّالِبَةُ","Siswi itu telah duduk."],["خَرَجَتْ فَاطِمَةُ مِنَ الْبَيْتِ","Fatimah keluar dari rumah."],["ذَهَبَ الطُّلَّابُ إِلَى الْمَسْجِدِ","Para siswa pergi ke masjid."]],quiz:[q("Jumlah fi'liyah diawali dengan…",["Isim","Fi'il","Harf"],1,"Fi'liyah diawali fi'il."),q("جَلَسَ الْمُعَلِّمُ artinya…",["Guru itu duduk","Guru itu masuk","Guru itu baru"],0,"جَلَسَ = duduk."),q("Pelaku dalam jumlah fi'liyah disebut…",["Fa'il","Khabar","Mubtada"],0,"Pelaku = fa'il."),q("Jika pelakunya perempuan, fi'il madhi diberi…",["Ta ta'nits sukun (ـَتْ)","Tanwin","Syaddah"],0,"Contoh: جَلَسَتِ الطَّالِبَةُ."),q("دَخَلَ artinya…",["Keluar","Masuk","Membuka"],1,"دَخَلَ = masuk."),q("Pilih yang tepat: ___ فَاطِمَةُ مِنَ الْبَيْتِ (Fatimah keluar dari rumah)",["خَرَجَتْ","خَرَجَ","خَرَجُوا"],0,"Fa'il muannats, fi'il diberi ta ta'nits sukun."),q("Pada جَلَسَتِ الطَّالِبَةُ, ت berkasrah karena…",["Bertemu ال (menghindari dua sukun)","Fa'il-nya jamak","Fi'ilnya mudzakkar"],0,"ت sukun bertemu sukun pada ال sehingga dikasrah."),q("ذَهَبَ الطُّلَّابُ berarti…",["Para siswa pergi","Siswa itu pergi","Siswi pergi"],0,"Fi'il tunggal untuk fa'il jamak."),q("كَتَبَ artinya…",["Telah menulis","Telah membaca","Telah duduk"],0,"كَتَبَ = menulis.")]},
14:{goal:"Mengenali fi'il, fa'il, dan maf'ul bih dalam satu kalimat.",body:"Pola dasar: fi'il + fa'il + maf'ul bih. Fa'il adalah pelaku dan marfu' (dhammah). Maf'ul bih adalah objek yang dikenai perbuatan dan manshub (fathah). Contoh: فَتَحَ الْوَلَدُ الْبَابَ = anak itu membuka pintu; الْوَلَدُ fa'il (dhammah), الْبَابَ maf'ul bih (fathah).",more:"<b>Cara menemukan:</b> tanyakan 'siapa yang melakukan?' untuk fa'il, dan 'apa yang dikenai?' untuk maf'ul bih. <b>Maf'ul bih nakirah:</b> bila objek tidak ber-ال, ia bertanwin fathah: قَرَأَ الطَّالِبُ كِتَابًا = siswa itu membaca sebuah buku. Dengan ال: قَرَأَ الطَّالِبُ الْكِتَابَ = siswa itu membaca buku itu. <b>Urutan tetap:</b> fi'il, fa'il, lalu maf'ul bih.",vocab:[["شَرِبَ","telah minum"],["مَفْعُولٌ بِهِ","objek"],["مَنْصُوبٌ","berharakat fathah"],["فَتَحَ","telah membuka"],["قَرَأَ","telah membaca"],["كَتَبَ","telah menulis"],["دَرْسٌ","pelajaran"]],ex:[["فَتَحَ الْوَلَدُ الْبَابَ","Anak itu membuka pintu."],["قَرَأَ الطَّالِبُ الْكِتَابَ","Siswa itu membaca buku."],["شَرِبَ مُحَمَّدٌ الْمَاءَ","Muhammad minum air."],["قَرَأَ الطَّالِبُ كِتَابًا","Siswa itu membaca sebuah buku."],["كَتَبَ الْمُعَلِّمُ الدَّرْسَ","Guru itu menulis pelajaran."]],quiz:[q("Fa'il berharakat akhir…",["Dhammah","Fathah","Kasrah"],0,"Fa'il marfu' (dhammah)."),q("Maf'ul bih berharakat akhir…",["Dhammah","Fathah","Kasrah"],1,"Maf'ul bih manshub (fathah)."),q("Fa'il dalam فَتَحَ الْوَلَدُ الْبَابَ adalah…",["الْوَلَدُ","الْبَابَ","فَتَحَ"],0,"الْوَلَدُ yang membuka."),q("Maf'ul bih dalam kalimat itu adalah…",["الْبَابَ","الْوَلَدُ","فَتَحَ"],0,"الْبَابَ yang dibuka."),q("شَرِبَ مُحَمَّدٌ الْمَاءَ artinya…",["Muhammad minum air","Muhammad pergi","Muhammad membaca"],0,"شَرِبَ = minum, الْمَاءَ = air."),q("Maf'ul bih pada قَرَأَ الطَّالِبُ كِتَابًا adalah…",["كِتَابًا","الطَّالِبُ","قَرَأَ"],0,"كِتَابًا manshub (tanwin fathah)."),q("Pilih yang tepat: كَتَبَ الْمُعَلِّمُ ___ (Guru itu menulis pelajaran itu)",["الدَّرْسَ","الدَّرْسُ","الدَّرْسِ"],0,"Maf'ul bih manshub: fathah."),q("Tanda manshub untuk isim nakirah tunggal adalah…",["Tanwin fathah","Tanwin dhammah","Tanwin kasrah"],0,"Contoh: كِتَابًا."),q("Fa'il pada كَتَبَ الْمُعَلِّمُ الدَّرْسَ adalah…",["الْمُعَلِّمُ","الدَّرْسَ","كَتَبَ"],0,"الْمُعَلِّمُ yang menulis (marfu').")]},
15:{goal:"Membedakan mufrad (satu), mutsanna (dua), dan jamak (tiga atau lebih).",body:"Mufrad untuk satu: طَالِبٌ. Mutsanna untuk dua, akhiran ـَانِ (rafa') atau ـَيْنِ (nashab/jar): طَالِبَانِ. Jamak untuk tiga atau lebih: jamak mudzakkar salim berakhiran ـُونَ (rafa') / ـِينَ (nashab/jar), jamak muannats salim berakhiran ـَاتٌ, dan jamak taksir (tidak beraturan) seperti كِتَابٌ menjadi كُتُبٌ.",more:"<b>Tips:</b> jamak taksir harus dihafal satu per satu, sedangkan jamak salim mengikuti pola akhiran yang tetap. <b>Penting:</b> jamak benda mati (bukan manusia) diperlakukan sebagai muannats tunggal, sehingga sifat dan khabarnya muannats tunggal: الْكُتُبُ جَدِيدَةٌ (bukan جَدِيدُونَ). <b>Setelah harf jar atau sebagai objek:</b> mutsanna menjadi ـَيْنِ dan jamak mudzakkar salim menjadi ـِينَ: الْكِتَابُ لِلطَّالِبَيْنِ (buku itu untuk dua siswa), الْكِتَابُ لِلْمُعَلِّمِينَ (buku itu untuk para guru). Jamak muannats salim memakai kasrah pada keadaan jar dan nashab: مِنَ الْمُعَلِّمَاتِ (dari para guru perempuan).",vocab:[["طَالِبٌ","seorang siswa"],["طَالِبَانِ","dua siswa"],["طُلَّابٌ","para siswa (jamak taksir)"],["مُعَلِّمُونَ","para guru (jamak salim lk)"],["مُعَلِّمَاتٌ","para guru perempuan"],["كُتُبٌ","buku-buku"],["طَالِبَيْنِ","dua siswa (jar/nashab)"],["مُعَلِّمِينَ","para guru (jar/nashab)"]],ex:[["هٰذَانِ طَالِبَانِ","Ini dua orang siswa."],["الْمُعَلِّمُونَ فِي الْفَصْلِ","Para guru ada di kelas."],["الْكُتُبُ جَدِيدَةٌ","Buku-buku itu baru."],["الْكِتَابُ لِلطَّالِبَيْنِ","Buku itu untuk dua siswa."],["الْكِتَابُ لِلْمُعَلِّمِينَ","Buku itu untuk para guru."]],quiz:[q("Mutsanna menunjukkan jumlah…",["Satu","Dua","Tiga atau lebih"],1,"Mutsanna = dua."),q("طَالِبَانِ artinya…",["Satu siswa","Dua siswa","Banyak siswa"],1,"Akhiran ـَانِ = dua."),q("Jamak mudzakkar salim (rafa') berakhiran…",["ـُونَ","ـَاتٌ","ـَانِ"],0,"Contoh: مُعَلِّمُونَ."),q("Jamak muannats salim berakhiran…",["ـَاتٌ","ـُونَ","ـَيْنِ"],0,"Contoh: مُعَلِّمَاتٌ."),q("Jamak taksir dari كِتَابٌ adalah…",["كُتُبٌ","كِتَابَانِ","كِتَابُونَ"],0,"كُتُبٌ = buku-buku."),q("Setelah harf jar, 'para guru' ditulis…",["لِلْمُعَلِّمِينَ","لِلْمُعَلِّمُونَ","لِلْمُعَلِّمَانِ"],0,"Jar: jamak mudzakkar salim berakhiran ـِينَ."),q("لِلطَّالِبَيْنِ artinya…",["Untuk dua siswa","Untuk para siswa","Untuk seorang siswa"],0,"ـَيْنِ = mutsanna (jar/nashab)."),q("Mufrad dari مُعَلِّمَاتٌ adalah…",["مُعَلِّمَةٌ","مُعَلِّمٌ","مُعَلِّمَانِ"],0,"مُعَلِّمَةٌ (guru perempuan)."),q("Pada keadaan rafa', mutsanna berakhiran…",["ـَانِ","ـَيْنِ","ـُونَ"],0,"Rafa': ـَانِ; jar/nashab: ـَيْنِ.")]},
16:{goal:"Membedakan isim mudzakkar dan muannats serta mengubahnya.",body:"Isim mudzakkar untuk laki-laki atau benda bergender maskulin, muannats untuk perempuan atau benda bergender feminin. Ciri muannats yang paling umum adalah ta marbuthah (ـَةٌ): طَالِبٌ menjadi طَالِبَةٌ, مُعَلِّمٌ menjadi مُعَلِّمَةٌ, كَبِيرٌ menjadi كَبِيرَةٌ. Sebagian kata muannats tidak memakai ta marbuthah, misalnya أُمٌّ (ibu).",more:"<b>Ingat:</b> kata sifat dan khabar harus mengikuti jenis kata yang diterangkan: مَدْرَسَةٌ كَبِيرَةٌ, bukan مَدْرَسَةٌ كَبِيرٌ. <b>Muannats tanpa ta marbuthah:</b> sebagian kata muannats secara makna tidak berakhiran ة, misalnya شَمْسٌ (matahari), يَدٌ (tangan), عَيْنٌ (mata). Sifat dan khabarnya tetap muannats: الشَّمْسُ جَمِيلَةٌ. Anggota tubuh yang berpasangan umumnya muannats. <b>Membalik:</b> untuk membuat mudzakkar dari muannats, buang ta marbuthah: مُعَلِّمَةٌ menjadi مُعَلِّمٌ.",vocab:[["أَبٌ","ayah"],["أُمٌّ","ibu"],["أَخٌ","saudara laki-laki"],["أُخْتٌ","saudara perempuan"],["مُعَلِّمَةٌ","guru perempuan"],["شَمْسٌ","matahari (muannats)"],["يَدٌ","tangan (muannats)"],["عَيْنٌ","mata (muannats)"]],ex:[["الْأَبُ مُعَلِّمٌ وَالْأُمُّ مُعَلِّمَةٌ","Ayah seorang guru dan ibu seorang guru."],["هٰذَا أَخٌ وَهٰذِهِ أُخْتٌ","Ini saudara laki-laki dan ini saudara perempuan."],["الْمَدْرَسَةُ كَبِيرَةٌ","Sekolah itu besar."],["الشَّمْسُ جَمِيلَةٌ","Matahari itu indah."],["الْيَدُ نَظِيفَةٌ","Tangan itu bersih."]],quiz:[q("Ciri muannats yang paling umum adalah…",["Ta marbuthah (ـَةٌ)","Tanwin","Sukun"],0,"Ta marbuthah menandakan muannats."),q("Bentuk muannats dari طَالِبٌ adalah…",["طَالِبَةٌ","طَالِبَانِ","طُلَّابٌ"],0,"Tambahkan ta marbuthah."),q("أُمٌّ artinya…",["Ayah","Ibu","Saudari"],1,"أُمٌّ = ibu."),q("Pilih yang benar: مَدْرَسَةٌ ___",["كَبِيرٌ","كَبِيرَةٌ","كَبِيرُونَ"],1,"Muannats memakai sifat muannats."),q("أُخْتٌ artinya…",["Saudara laki-laki","Saudara perempuan","Ibu"],1,"أُخْتٌ = saudara perempuan."),q("Pilih yang benar: الشَّمْسُ ___",["جَمِيلَةٌ","جَمِيلٌ","جَمِيلُونَ"],0,"شَمْسٌ muannats, sifatnya muannats."),q("Bentuk mudzakkar dari مُعَلِّمَةٌ adalah…",["مُعَلِّمٌ","مُعَلِّمَانِ","مُعَلِّمَاتٌ"],0,"Buang ta marbuthah."),q("Kata muannats yang tidak berakhiran ة adalah…",["يَدٌ","مَدْرَسَةٌ","طَالِبَةٌ"],0,"يَدٌ (tangan) muannats secara makna."),q("الْيَدُ نَظِيفَةٌ artinya…",["Tangan itu bersih","Mata itu bersih","Rumah itu bersih"],0,"يَدٌ = tangan, نَظِيفَةٌ = bersih (muannats).")]},
17:{goal:"Mengenal kata kerja madhi dan perubahannya menurut pelaku.",body:"Fi'il madhi menunjukkan perbuatan yang sudah terjadi. Akhirnya berubah menurut pelaku. Dari كَتَبَ: كَتَبَ (dia lk), كَتَبَتْ (dia pr), كَتَبْتَ (kamu lk), كَتَبْتِ (kamu pr), كَتَبْتُ (saya), كَتَبْنَا (kami), كَتَبُوا (mereka lk).",more:"<b>Perhatikan:</b> كَتَبْتَ dan كَتَبْتِ hanya berbeda pada harakat huruf ت, yaitu fathah untuk laki-laki dan kasrah untuk perempuan. <b>Bentuk lain:</b> كَتَبْتَ (kamu lk), كَتَبْتُمْ (kalian lk), كَتَبَا (mereka berdua lk), dan كَتَبْنَ (mereka pr). Alif sesudah wawu pada كَتَبُوا tidak dibaca. <b>Kesesuaian:</b> fi'il madhi mengikuti pelakunya bila pelaku ada di depan: الْبَنَاتُ كَتَبْنَ الدَّرْسَ (para anak perempuan telah menulis pelajaran).",vocab:[["كَتَبَ","dia (lk) telah menulis"],["كَتَبَتْ","dia (pr) telah menulis"],["كَتَبْتُ","saya telah menulis"],["كَتَبْنَا","kami telah menulis"],["كَتَبُوا","mereka (lk) telah menulis"],["كَتَبْتُمْ","kalian (lk) telah menulis"],["كَتَبْنَ","mereka (pr) telah menulis"],["كَتَبَا","mereka berdua (lk) telah menulis"]],ex:[["كَتَبْتُ الدَّرْسَ","Saya telah menulis pelajaran."],["ذَهَبْنَا إِلَى الْمَسْجِدِ","Kami telah pergi ke masjid."],["قَرَأَتْ هِيَ الْكِتَابَ","Dia (pr) telah membaca buku."],["ذَهَبْتَ إِلَى الْمَسْجِدِ","Kamu (lk) telah pergi ke masjid."],["الْبَنَاتُ كَتَبْنَ الدَّرْسَ","Para anak perempuan telah menulis pelajaran."]],quiz:[q("كَتَبْتُ artinya…",["Saya telah menulis","Kami telah menulis","Dia telah menulis"],0,"Akhiran تُ = saya."),q("كَتَبْنَا artinya…",["Saya telah menulis","Kami telah menulis","Mereka telah menulis"],1,"Akhiran نَا = kami."),q("كَتَبَتْ digunakan untuk…",["Dia (pr)","Dia (lk)","Kamu (lk)"],0,"Ta sukun = dia perempuan."),q("Akhiran تِ pada كَتَبْتِ menunjukkan…",["Kamu (pr)","Kamu (lk)","Saya"],0,"Kasrah pada ت = kamu perempuan."),q("كَتَبُوا artinya…",["Mereka (lk) telah menulis","Ia menulis","Tulislah"],0,"Akhiran وا = mereka laki-laki."),q("كَتَبْنَ artinya…",["Mereka (pr) telah menulis","Kami telah menulis","Kamu (pr) telah menulis"],0,"Akhiran نَ = mereka perempuan; نَا = kami."),q("كَتَبْتُمْ ditujukan kepada…",["Kalian (lk)","Satu laki-laki","Saya"],0,"Akhiran تُمْ = kalian laki-laki."),q("Alif pada akhir كَتَبُوا…",["Tidak dibaca","Dibaca panjang","Diganti ya"],0,"Alif setelah wawu jamak tidak dibaca."),q("ذَهَبْتَ artinya…",["Kamu (lk) telah pergi","Kamu (pr) telah pergi","Saya telah pergi"],0,"تَ (fathah) = kamu laki-laki.")]},
18:{goal:"Mengenal kata kerja mudhari' (sekarang dan akan datang).",body:"Fi'il mudhari' diawali salah satu huruf أ ن ي ت. Contoh dari كَتَبَ: أَكْتُبُ (saya menulis), نَكْتُبُ (kami menulis), يَكْتُبُ (dia lk), تَكْتُبُ (kamu lk atau dia pr), تَكْتُبِينَ (kamu pr), يَكْتُبُونَ (mereka lk). Mudhari' menunjukkan perbuatan sekarang atau akan datang.",more:"<b>Pasangan madhi dan mudhari':</b> ذَهَبَ - يَذْهَبُ, قَرَأَ - يَقْرَأُ, دَرَسَ - يَدْرُسُ. <b>Masa depan:</b> awalan سَـ atau kata سَوْفَ di depan mudhari' berarti akan: سَأَذْهَبُ = saya akan pergi, سَوْفَ يَكْتُبُ = dia akan menulis. <b>Penolakan:</b> لَا di depan mudhari' berarti tidak: لَا أَذْهَبُ = saya tidak pergi. <b>Dia perempuan:</b> هِيَ تَقْرَأُ (awalan ت).",vocab:[["أَذْهَبُ","saya pergi"],["يَدْرُسُ","dia (lk) belajar"],["يَقْرَأُ","dia (lk) membaca"],["نَكْتُبُ","kami menulis"],["يَذْهَبُونَ","mereka (lk) pergi"],["سَأَذْهَبُ","saya akan pergi"],["سَوْفَ","akan"],["لَا أَذْهَبُ","saya tidak pergi"]],ex:[["أَنَا أَذْهَبُ إِلَى الْمَدْرَسَةِ","Saya pergi ke sekolah."],["هُمْ يَذْهَبُونَ إِلَى الْمَسْجِدِ","Mereka (lk) pergi ke masjid."],["نَحْنُ نَدْرُسُ الْعَرَبِيَّةَ","Kami belajar bahasa Arab."],["سَأَذْهَبُ إِلَى الْمَدْرَسَةِ","Saya akan pergi ke sekolah."],["هِيَ تَقْرَأُ الْكِتَابَ","Dia (pr) membaca buku."],["لَا أَذْهَبُ إِلَى السُّوقِ","Saya tidak pergi ke pasar."]],quiz:[q("أَذْهَبُ artinya…",["Saya pergi","Kami pergi","Dia pergi"],0,"Awalan أ = saya."),q("Awalan نـ pada mudhari' berarti…",["Kami","Saya","Mereka"],0,"Awalan ن = kami."),q("يَدْرُسُونَ artinya…",["Mereka (lk) belajar","Dia belajar","Kami belajar"],0,"Akhiran ونَ = mereka laki-laki."),q("تَكْتُبِينَ ditujukan kepada…",["Perempuan","Laki-laki","Banyak orang"],0,"Akhiran ينَ = kamu perempuan."),q("Mudhari' menunjukkan waktu…",["Lampau","Sekarang atau akan datang","Hanya perintah"],1,"Mudhari' = kini atau akan datang."),q("سَيَكْتُبُ artinya…",["Dia (lk) akan menulis","Dia (lk) telah menulis","Dia (lk) tidak menulis"],0,"سَـ + mudhari' = akan."),q("لَا أَذْهَبُ artinya…",["Saya tidak pergi","Saya akan pergi","Kami pergi"],0,"لَا + mudhari' = tidak."),q("Awalan apa yang dipakai untuk 'dia (pr)' pada هِيَ ___ الْكِتَابَ?",["تـ","يـ","نـ"],0,"Dia perempuan memakai awalan ت."),q("سَوْفَ يَذْهَبُ artinya…",["Dia akan pergi","Dia telah pergi","Pergilah"],0,"سَوْفَ = akan.")]},
19:{goal:"Mengenal kata kerja amr (perintah) dan cara membentuknya.",body:"Fi'il amr adalah perintah. Dari mudhari' yang ditujukan kepada lawan bicara (تَكْتُبُ), buang awalan ت dan akhiri dengan sukun; jika awalnya sukun, tambahkan hamzah di depan: اُكْتُبْ (tulislah), اِفْتَحْ (bukalah), اُدْخُلْ (masuklah), اِجْلِسْ (duduklah). Untuk perempuan tambahkan ـِي: اُكْتُبِي.",more:"<b>Harakat hamzah:</b> ikuti huruf ketiga mudhari'. Jika dhammah (يَدْخُلُ) maka اُدْخُلْ, jika fathah atau kasrah (يَفْتَحُ، يَجْلِسُ) maka اِفْتَحْ، اِجْلِسْ. <b>Catatan:</b> sebelum kata ber-ال, akhir amr diberi kasrah agar tidak bertemu dua sukun: اِقْرَأِ الْكِتَابَ, اُدْخُلِ الْفَصْلَ. <b>Untuk banyak orang:</b> tambahkan ـُوا: اُكْتُبُوا (tulislah, kalian lk), dan ـَا untuk dua orang: اُكْتُبَا. <b>Larangan:</b> لَا + mudhari' bersukun berarti jangan: لَا تَكْتُبْ (jangan menulis), لَا تَجْلِسْ (jangan duduk).",vocab:[["اُكْتُبْ","tulislah"],["اِقْرَأْ","bacalah"],["اُدْخُلْ","masuklah"],["اِذْهَبْ","pergilah"],["اِجْلِسْ","duduklah"],["اُكْتُبِي","tulislah (untuk perempuan)"],["اُكْتُبُوا","tulislah (kalian lk)"],["لَا تَكْتُبْ","jangan menulis"],["لَا تَجْلِسْ","jangan duduk"]],ex:[["اِقْرَأِ الْكِتَابَ","Bacalah buku itu."],["اُدْخُلِ الْفَصْلَ","Masuklah ke kelas."],["اِجْلِسْ يَا مُحَمَّدُ","Duduklah, wahai Muhammad."],["اُكْتُبُوا الدَّرْسَ","Tulislah pelajaran itu (kalian lk)."],["لَا تَجْلِسْ هُنَا","Jangan duduk di sini."]],quiz:[q("Fi'il amr menunjukkan…",["Perintah","Masa lampau","Pertanyaan"],0,"Amr = perintah."),q("اِقْرَأْ artinya…",["Bacalah","Tulislah","Pergilah"],0,"اِقْرَأْ = bacalah."),q("اُدْخُلْ artinya…",["Keluarlah","Masuklah","Duduklah"],1,"اُدْخُلْ = masuklah."),q("اِذْهَبْ artinya…",["Pergilah","Bacalah","Bukalah"],0,"اِذْهَبْ = pergilah."),q("اُكْتُبِي ditujukan kepada…",["Laki-laki","Perempuan","Banyak laki-laki"],1,"Akhiran ـِي = perempuan."),q("لَا تَذْهَبْ artinya…",["Jangan pergi","Pergilah","Saya tidak pergi"],0,"لَا + mudhari' bersukun = larangan."),q("اُكْتُبُوا ditujukan kepada…",["Banyak laki-laki","Satu perempuan","Dua orang"],0,"Akhiran ـُوا = banyak laki-laki."),q("Bentuk amr untuk kalian (lk) dari يَدْخُلُونَ adalah…",["اُدْخُلُوا","اُدْخُلْ","اُدْخُلِي"],0,"Banyak laki-laki: tambah ـُوا."),q("اُكْتُبَا ditujukan kepada…",["Dua orang","Satu laki-laki","Satu perempuan"],0,"Akhiran ـَا = dua orang.")]},
21:{goal:"Memahami arti i'rab dan tiga keadaan dasarnya.",body:"I'rab adalah perubahan harakat akhir kata sesuai kedudukannya dalam kalimat. Ada tiga keadaan dasar: rafa' (dhammah ـُ), nashab (fathah ـَ), dan jar (kasrah ـِ). Contoh pada kata الطَّالِبُ: جَاءَ الطَّالِبُ (rafa'), رَأَيْتُ الطَّالِبَ (nashab), ذَهَبْتُ إِلَى الطَّالِبِ (jar).",more:"<b>Intinya:</b> huruf kata tidak berubah, yang berubah hanya harakat akhirnya. Tidak semua kata berubah dengan cara yang sama; pelajari satu keadaan per satu. <b>Tanwin ikut berubah:</b> pada isim nakirah, rafa' = tanwin dhammah (ـٌ), nashab = tanwin fathah (ـً), jar = tanwin kasrah (ـٍ): جَاءَ طَالِبٌ، رَأَيْتُ طَالِبًا، ذَهَبْتُ إِلَى طَالِبٍ. <b>Ringkasan kedudukan:</b> fa'il, mubtada, khabar = rafa'; maf'ul bih = nashab; setelah harf jar dan mudhaf ilaih = jar.",vocab:[["رَفْعٌ","rafa' (dhammah)"],["نَصْبٌ","nashab (fathah)"],["جَرٌّ","jar (kasrah)"],["جَاءَ","telah datang"],["رَأَى","telah melihat"],["طَالِبٌ","siswa (tanwin dhammah, rafa')"],["طَالِبًا","siswa (tanwin fathah, nashab)"],["طَالِبٍ","siswa (tanwin kasrah, jar)"]],ex:[["جَاءَ الطَّالِبُ","Siswa itu datang."],["رَأَيْتُ الطَّالِبَ","Saya melihat siswa itu."],["ذَهَبْتُ إِلَى الطَّالِبِ","Saya pergi kepada siswa itu."],["جَاءَ طَالِبٌ","Seorang siswa datang."],["رَأَيْتُ طَالِبًا","Saya melihat seorang siswa."],["ذَهَبْتُ إِلَى طَالِبٍ","Saya pergi kepada seorang siswa."]],quiz:[q("I'rab adalah perubahan…",["Harakat akhir kata","Huruf pertama kata","Arti kata"],0,"I'rab = perubahan harakat akhir sesuai kedudukan."),q("Tanda rafa' dasar adalah…",["Dhammah","Fathah","Kasrah"],0,"Rafa' = dhammah."),q("Tanda nashab dasar adalah…",["Dhammah","Fathah","Kasrah"],1,"Nashab = fathah."),q("Tanda jar dasar adalah…",["Dhammah","Fathah","Kasrah"],2,"Jar = kasrah."),q("الطَّالِبَ pada رَأَيْتُ الطَّالِبَ berkeadaan…",["Rafa'","Nashab","Jar"],1,"Sebagai objek, harakatnya fathah (nashab)."),q("Pada جَاءَ الطَّالِبُ, kata الطَّالِبُ berkeadaan…",["Rafa'","Nashab","Jar"],0,"Sebagai fa'il (pelaku), harakatnya dhammah (rafa')."),q("Pada ذَهَبْتُ إِلَى الطَّالِبِ, kata الطَّالِبِ berkeadaan…",["Jar","Rafa'","Nashab"],0,"Setelah harf jar, harakatnya kasrah (jar)."),q("Pada الْبَابُ جَدِيدٌ, kata الْبَابُ berkeadaan…",["Rafa'","Nashab","Jar"],0,"Mubtada marfu' (dhammah)."),q("Pada رَأَيْتُ طَالِبًا, kata طَالِبًا berkeadaan…",["Nashab","Rafa'","Jar"],0,"Objek nakirah: tanwin fathah (nashab)."),q("Tanwin kasrah (ـٍ) menandakan…",["Jar","Rafa'","Nashab"],0,"Jar nakirah = tanwin kasrah."),q("Pada فِي بَيْتٍ, kata بَيْتٍ berkeadaan…",["Jar","Rafa'","Nashab"],0,"Setelah harf jar = majrur."),q("Yang berubah pada i'rab adalah…",["Harakat akhir kata","Huruf-huruf kata","Urutan kata"],0,"Huruf tetap, harakat akhir yang berubah.")]},
22:{goal:"Mengenali kata-kata yang berkeadaan rafa' (marfu'at) dasar.",body:"Yang berkeadaan rafa' pada tahap dasar: mubtada, khabar, dan fa'il. Tanda aslinya dhammah. Pada mutsanna, rafa' ditandai alif (ـَانِ), dan pada jamak mudzakkar salim ditandai wawu (ـُونَ).",more:"<b>Contoh:</b> الْمُعَلِّمُ حَاضِرٌ (mubtada dan khabar rafa'), جَاءَ الْوَلَدُ (fa'il rafa'). <b>Jamak muannats salim:</b> rafa' tetap dengan dhammah: الْمُعَلِّمَاتُ حَاضِرَاتٌ (para guru perempuan hadir). <b>Cara cepat menemukan marfu':</b> tanyakan 'siapa yang melakukan?' (fa'il) atau 'siapa yang dibicarakan?' (mubtada); jawabannya marfu'. Pada mutsanna dan jamak mudzakkar salim, perhatikan akhiran, bukan dhammah.",vocab:[["حَاضِرٌ","hadir"],["غَائِبٌ","tidak hadir"],["حَاضِرَانِ","dua orang hadir"],["حَاضِرُونَ","mereka (lk) hadir"],["حَاضِرَةٌ","hadir (perempuan)"],["حَاضِرَاتٌ","hadir (jamak pr)"]],ex:[["الْمُعَلِّمُ حَاضِرٌ","Guru itu hadir."],["الطَّالِبَانِ حَاضِرَانِ","Kedua siswa itu hadir."],["الْمُعَلِّمُونَ حَاضِرُونَ","Para guru itu hadir."],["الْمُعَلِّمَاتُ حَاضِرَاتٌ","Para guru perempuan itu hadir."],["جَاءَ الطَّالِبَانِ","Kedua siswa itu datang."]],quiz:[q("Tanda rafa' asli adalah…",["Dhammah","Fathah","Kasrah"],0,"Rafa' = dhammah."),q("Fa'il berkeadaan…",["Rafa'","Nashab","Jar"],0,"Fa'il selalu marfu'."),q("Mubtada dan khabar berkeadaan…",["Rafa'","Nashab","Jar"],0,"Keduanya marfu'."),q("Rafa' pada mutsanna ditandai…",["Alif (ـَانِ)","Ya (ـَيْنِ)","Kasrah"],0,"Mutsanna rafa' dengan alif."),q("Rafa' pada jamak mudzakkar salim ditandai…",["Wawu (ـُونَ)","Ya (ـِينَ)","Fathah"],0,"Jamak mudzakkar salim rafa' dengan wawu."),q("Pada الطَّالِبَانِ حَاضِرَانِ, kata الطَّالِبَانِ berkeadaan…",["Rafa'","Nashab","Jar"],0,"Mubtada mutsanna, rafa' dengan alif."),q("Pada جَاءَ الْمُعَلِّمُونَ, kata الْمُعَلِّمُونَ berkeadaan…",["Rafa'","Nashab","Jar"],0,"Fa'il jamak mudzakkar salim, rafa' dengan wawu."),q("Pilih yang benar: الْوَلَدُ ___ (anak itu hadir)",["حَاضِرٌ","حَاضِرًا","حَاضِرٍ"],0,"Khabar marfu' (tanwin dhammah)."),q("Pada جَاءَ الطَّالِبَانِ, kata الطَّالِبَانِ adalah…",["Fa'il, rafa' dengan alif","Maf'ul bih, nashab","Majrur"],0,"Pelaku mutsanna: rafa' dengan alif."),q("Rafa' pada jamak muannats salim ditandai…",["Dhammah","Wawu","Alif"],0,"Contoh: الْمُعَلِّمَاتُ."),q("Pilih yang benar: الطَّالِبَانِ ___",["حَاضِرَانِ","حَاضِرٌ","حَاضِرَةٌ"],0,"Mubtada mutsanna, khabar mutsanna rafa' dengan alif."),q("Pilih yang benar: الْمُعَلِّمَاتُ ___",["حَاضِرَاتٌ","حَاضِرُونَ","حَاضِرٌ"],0,"Mubtada jamak muannats, khabar jamak muannats.")]},
23:{goal:"Mengenali kata-kata yang berkeadaan nashab (manshubat) dasar.",body:"Pada tahap dasar, yang manshub antara lain maf'ul bih dan isim setelah إِنَّ (sesungguhnya). Tanda aslinya fathah. Pada mutsanna dan jamak mudzakkar salim, nashab ditandai ya (ـَيْنِ dan ـِينَ).",more:"<b>Contoh:</b> قَرَأْتُ الْكِتَابَ (maf'ul bih manshub), إِنَّ الْعِلْمَ نُورٌ (الْعِلْمَ manshub, khabarnya نُورٌ tetap rafa'). <b>Jamak muannats salim:</b> nashab memakai kasrah, bukan fathah: رَأَيْتُ الْمُعَلِّمَاتِ (saya melihat para guru perempuan). <b>Pola إِنَّ:</b> isim إِنَّ manshub dan khabarnya marfu': إِنَّ الطَّالِبَ مُجْتَهِدٌ. Pada nakirah, tanda nashab adalah tanwin fathah: رَأَيْتُ كِتَابًا.",vocab:[["إِنَّ","sesungguhnya"],["عِلْمٌ","ilmu"],["نُورٌ","cahaya"],["مُعَلِّمِينَ","para guru (nashab/jar)"],["رَأَيْتُ كِتَابًا","saya melihat sebuah buku"]],ex:[["قَرَأْتُ الْكِتَابَ","Saya telah membaca buku itu."],["إِنَّ الْعِلْمَ نُورٌ","Sesungguhnya ilmu adalah cahaya."],["رَأَيْتُ الْمُعَلِّمِينَ","Saya melihat para guru."],["رَأَيْتُ الْمُعَلِّمَاتِ","Saya melihat para guru perempuan."],["إِنَّ الطَّالِبَ مُجْتَهِدٌ","Sesungguhnya siswa itu rajin."]],quiz:[q("Tanda nashab asli adalah…",["Fathah","Dhammah","Kasrah"],0,"Nashab = fathah."),q("Maf'ul bih berkeadaan…",["Nashab","Rafa'","Jar"],0,"Objek = manshub."),q("Isim setelah إِنَّ berkeadaan…",["Nashab","Rafa'","Jar"],0,"Isim إِنَّ manshub."),q("إِنَّ artinya…",["Sesungguhnya","Kemudian","Dan"],0,"إِنَّ = sesungguhnya."),q("Nashab pada jamak mudzakkar salim ditandai…",["Ya (ـِينَ)","Wawu (ـُونَ)","Alif (ـَانِ)"],0,"Nashab dan jar jamak salim dengan ya."),q("Pada رَأَيْتُ الْمُعَلِّمَ, kata الْمُعَلِّمَ berkeadaan…",["Nashab","Rafa'","Jar"],0,"Maf'ul bih manshub (fathah)."),q("Pada إِنَّ الْعِلْمَ نُورٌ, kata نُورٌ berkeadaan…",["Rafa'","Nashab","Jar"],0,"Khabar إِنَّ tetap marfu'."),q("Akhiran ـَيْنِ pada رَأَيْتُ الطَّالِبَيْنِ menunjukkan…",["Mutsanna nashab","Jamak mudzakkar rafa'","Mutsanna rafa'"],0,"Mutsanna nashab dan jar memakai ya (ـَيْنِ)."),q("Nashab pada jamak muannats salim ditandai…",["Kasrah","Fathah","Wawu"],0,"Jamak muannats salim: nashab dengan kasrah."),q("Pilih yang benar: إِنَّ ___ مُجْتَهِدٌ",["الطَّالِبَ","الطَّالِبُ","الطَّالِبِ"],0,"Setelah إِنَّ, isimnya manshub."),q("Tanda nashab pada isim nakirah tunggal adalah…",["Tanwin fathah","Tanwin dhammah","Tanwin kasrah"],0,"Contoh: كِتَابًا.")]},
24:{goal:"Mengenali kata-kata yang berkeadaan jar (majrurat) dasar.",body:"Yang majrur pada tahap dasar: isim setelah harf jar (فِي، مِنْ، إِلَى، عَلَى) dan isim kedua dalam susunan kepemilikan (mudhaf ilaih). Tanda aslinya kasrah.",more:"<b>Contoh:</b> فِي الْبَيْتِ (di rumah), كِتَابُ الطَّالِبِ (buku siswa itu). Susunan kedua akan dibahas lebih dalam di Modul 26. <b>Catatan:</b> مَعَ (bersama) sebenarnya zharf (isim), bukan harf jar, tetapi kata sesudahnya tetap majrur sebagai mudhaf ilaih: مَعَ الْمُعَلِّمِ. <b>Mutsanna dan jamak salim:</b> tanda jar adalah ya: ذَهَبْتُ إِلَى الطَّالِبَيْنِ (kepada dua siswa), جَلَسْتُ مَعَ الْمُعَلِّمِينَ (bersama para guru). <b>Nakirah:</b> tanwin kasrah: فِي بَيْتٍ كَبِيرٍ (di sebuah rumah yang besar), sifatnya ikut majrur.",vocab:[["مَعَ","bersama"],["مَجْرُورٌ","berharakat kasrah"],["كِتَابُ الطَّالِبِ","buku siswa itu"],["بَيْتٍ","rumah (tanwin kasrah, jar)"],["فِي الْبَيْتِ","di rumah"],["إِلَى الْمَدْرَسَةِ","ke sekolah"]],ex:[["ذَهَبْتُ إِلَى الْمَدْرَسَةِ","Saya pergi ke sekolah."],["جَلَسْتُ مَعَ الْمُعَلِّمِ","Saya duduk bersama guru itu."],["كِتَابُ الطَّالِبِ جَدِيدٌ","Buku siswa itu baru."],["جَلَسْتُ مَعَ الْمُعَلِّمِينَ","Saya duduk bersama para guru."],["فِي بَيْتٍ كَبِيرٍ","Di sebuah rumah yang besar."]],quiz:[q("Isim setelah harf jar berkeadaan…",["Jar","Rafa'","Nashab"],0,"Majrur setelah harf jar."),q("Tanda jar asli adalah…",["Kasrah","Fathah","Dhammah"],0,"Jar = kasrah."),q("مَعَ artinya…",["Bersama","Dari","Ke"],0,"مَعَ = bersama."),q("كِتَابُ الطَّالِبِ artinya…",["Buku siswa itu","Siswa itu membaca","Di buku"],0,"Kata kedua majrur karena kepemilikan."),q("Pada فِي الْبَيْتِ, kata الْبَيْتِ adalah…",["Majrur","Marfu'","Manshub"],0,"Setelah فِي, majrur."),q("Pada فِي الْمَدْرَسَةِ, kata الْمَدْرَسَةِ berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Setelah فِي, majrur (kasrah)."),q("Pada كِتَابُ الطَّالِبِ, kata الطَّالِبِ berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih selalu majrur."),q("Pilih yang benar: ذَهَبَ الْوَلَدُ إِلَى ___",["الْبَيْتِ","الْبَيْتُ","الْبَيْتَ"],0,"Setelah إِلَى, majrur (kasrah)."),q("Tanda jar pada jamak mudzakkar salim adalah…",["Ya (ـِينَ)","Wawu (ـُونَ)","Alif"],0,"Jar dan nashab memakai ya."),q("Pada جَلَسْتُ مَعَ الْمُعَلِّمِينَ, kata الْمُعَلِّمِينَ berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih setelah مَعَ: majrur."),q("Pilih yang benar: ذَهَبْتُ إِلَى ___ (dua siswa)",["الطَّالِبَيْنِ","الطَّالِبَانِ","الطَّالِبُونَ"],0,"Mutsanna jar: ـَيْنِ."),q("Pada فِي بَيْتٍ كَبِيرٍ, kata كَبِيرٍ…",["Ikut majrur","Marfu'","Manshub"],0,"Sifat mengikuti i'rab man'ut.")]},
25:{goal:"Memahami na'at (sifat) dan man'ut (yang disifati).",body:"Na'at menerangkan man'ut dan mengikutinya dalam empat hal: harakat i'rab, jenis (mudzakkar/muannats), jumlah, serta ma'rifah/nakirah. Contoh: جَاءَ الطَّالِبُ الْمُجْتَهِدُ (siswa yang rajin datang); رَأَيْتُ الطَّالِبَ الْمُجْتَهِدَ (nashab keduanya).",more:"<b>Bedakan:</b> الطَّالِبُ الْمُجْتَهِدُ = 'siswa yang rajin' (frasa), الطَّالِبُ مُجْتَهِدٌ = 'siswa itu rajin' (kalimat). <b>Nakirah dan jamak benda mati:</b> طَالِبٌ مُجْتَهِدٌ (seorang siswa yang rajin, frasa nakirah), رَأَيْتُ طَالِبَةً مُجْتَهِدَةً (nashab keduanya). Jamak benda mati disifati dengan muannats tunggal: الْكُتُبُ الْجَدِيدَةُ (buku-buku yang baru). Pada jar: فِي الْبَيْتِ الْكَبِيرِ (di rumah yang besar).",vocab:[["نَعْتٌ","sifat"],["مَنْعُوتٌ","yang disifati"],["الْمُجْتَهِدُ","yang rajin"],["الْكُتُبُ الْجَدِيدَةُ","buku-buku yang baru"],["الْمَدْرَسَةُ الْكَبِيرَةُ","sekolah yang besar"],["الطَّالِبُ الْمُجْتَهِدُ","siswa yang rajin"]],ex:[["جَاءَ الطَّالِبُ الْمُجْتَهِدُ","Siswa yang rajin telah datang."],["رَأَيْتُ الطَّالِبَ الْمُجْتَهِدَ","Saya melihat siswa yang rajin."],["ذَهَبْتُ إِلَى الْمَدْرَسَةِ الْكَبِيرَةِ","Saya pergi ke sekolah yang besar."],["الْكُتُبُ الْجَدِيدَةُ عَلَى الْمَكْتَبِ","Buku-buku yang baru ada di atas meja."],["رَأَيْتُ طَالِبَةً مُجْتَهِدَةً","Saya melihat seorang siswi yang rajin."]],quiz:[q("Man'ut adalah…",["Yang disifati","Sifatnya","Kata kerja"],0,"Man'ut = yang disifati."),q("Na'at mengikuti man'ut dalam…",["I'rab, jenis, jumlah, ma'rifah/nakirah","Hanya jenis","Tidak ada"],0,"Empat hal itu."),q("الْبِنْتُ الْمُجْتَهِدَةُ artinya…",["Anak perempuan yang rajin","Anak laki-laki rajin","Guru yang aktif"],0,"Na'at muannats mengikuti man'ut muannats."),q("الطَّالِبُ مُجْتَهِدٌ berarti…",["Siswa itu rajin (kalimat)","Siswa yang rajin (frasa)","Siswa-siswa"],0,"Tanpa ال pada kata kedua = kalimat."),q("Pilih yang benar: رَأَيْتُ الطَّالِبَ ___",["الْمُجْتَهِدَ","الْمُجْتَهِدُ","الْمُجْتَهِدِ"],0,"Mengikuti man'ut yang manshub."),q("Pilih yang benar: الْكُتُبُ ___ (buku-buku yang baru)",["الْجَدِيدَةُ","الْجَدِيدُونَ","الْجَدِيدُ"],0,"Jamak benda mati: sifat muannats tunggal."),q("Pada رَأَيْتُ طَالِبَةً مُجْتَهِدَةً, kata مُجْتَهِدَةً berkeadaan…",["Nashab","Rafa'","Jar"],0,"Mengikuti man'ut yang manshub."),q("Pilih yang benar: فِي الْبَيْتِ ___ (di rumah yang besar)",["الْكَبِيرِ","الْكَبِيرُ","الْكَبِيرَ"],0,"Sifat mengikuti man'ut yang majrur."),q("جَاءَ طَالِبٌ مُجْتَهِدٌ termasuk…",["Nakirah (seorang siswa yang rajin)","Ma'rifah","Pertanyaan"],0,"Tanpa ال = nakirah.")]},
26:{goal:"Memahami idhafah (susunan kepemilikan).",body:"Idhafah terdiri dari mudhaf (kata pertama) dan mudhaf ilaih (kata kedua). Mudhaf tidak bertanwin dan tidak memakai ال, harakat akhirnya mengikuti kedudukannya dalam kalimat. Mudhaf ilaih selalu majrur (kasrah). Contoh: كِتَابُ الطَّالِبِ = buku siswa itu.",more:"<b>Dengan dhamir:</b> كِتَابُهُ (bukunya) juga idhafah; dhamir هُ berfungsi sebagai mudhaf ilaih. <b>Perhatikan:</b> katakan بَيْتُ الْمُعَلِّمِ, bukan الْبَيْتُ الْمُعَلِّمِ. <b>Dhamir kepemilikan:</b> كِتَابِي (bukuku), كِتَابُكَ (bukumu lk), كِتَابُهُ (bukunya lk), كِتَابُهَا (bukunya pr), كِتَابُنَا (buku kami). <b>Berantai:</b> idhafah bisa disambung: بَابُ بَيْتِ الْمُعَلِّمِ (pintu rumah guru itu); kata terakhir saja yang memakai ال, dan semua mudhaf ilaih majrur. Mudhaf mengikuti kedudukannya: فِي بَيْتِ الْمُعَلِّمِ (mudhaf ikut majrur karena فِي).",vocab:[["مُضَافٌ","kata pertama idhafah"],["مُضَافٌ إِلَيْهِ","kata kedua idhafah"],["حَقِيبَةُ الْوَلَدِ","tas anak itu"],["بَابُ الْمَدْرَسَةِ","pintu sekolah"],["كِتَابُهَا","bukunya (pr)"],["كِتَابُنَا","buku kami"]],ex:[["بَيْتُ الْمُعَلِّمِ كَبِيرٌ","Rumah guru itu besar."],["بَابُ الْمَدْرَسَةِ جَدِيدٌ","Pintu sekolah itu baru."],["حَقِيبَةُ الْوَلَدِ جَدِيدَةٌ","Tas anak itu baru."],["بَابُ بَيْتِ الْمُعَلِّمِ جَدِيدٌ","Pintu rumah guru itu baru."],["فِي حَقِيبَةِ الْوَلَدِ كِتَابٌ","Di tas anak itu ada sebuah buku."]],quiz:[q("Idhafah terdiri dari…",["Mudhaf dan mudhaf ilaih","Fi'il dan fa'il","Mubtada dan khabar"],0,"Dua unsur: mudhaf dan mudhaf ilaih."),q("Mudhaf tidak boleh memakai…",["ال dan tanwin","Dhammah","Fathah"],0,"Mudhaf tanpa ال dan tanwin."),q("Mudhaf ilaih berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih selalu majrur."),q("بَابُ الْمَدْرَسَةِ artinya…",["Pintu sekolah","Sekolah besar","Ke sekolah"],0,"Pintu milik sekolah."),q("Pilih yang benar: بَيْتُ ___",["الْمُعَلِّمِ","الْمُعَلِّمُ","الْمُعَلِّمَ"],0,"Mudhaf ilaih majrur (kasrah)."),q("كِتَابُهَا artinya…",["Bukunya (pr)","Bukunya (lk)","Buku kami"],0,"هَا = milik dia perempuan."),q("Pada بَابُ بَيْتِ الْمُعَلِّمِ, kata الْمُعَلِّمِ berkeadaan…",["Majrur","Marfu'","Manshub"],0,"Mudhaf ilaih majrur."),q("Pada فِي بَيْتِ الْمُعَلِّمِ, kata بَيْتِ majrur karena…",["Didahului فِي","Menjadi fa'il","Menjadi objek"],0,"Mudhaf mengikuti kedudukannya: setelah harf jar = majrur."),q("Dalam idhafah, kata yang memakai ال adalah…",["Mudhaf ilaih (kata terakhir)","Mudhaf","Keduanya wajib"],0,"Mudhaf tidak ber-ال; kata terakhir boleh ber-ال.")]},
27:{goal:"Mengenal isim maushul (kata sambung 'yang').",body:"Isim maushul menyambung kata dengan keterangan (shilah). Bentuknya menyesuaikan jenis dan jumlah: الَّذِي (yang, mudzakkar), الَّتِي (yang, muannats), الَّذِينَ (yang, jamak mudzakkar), اللَّاتِي (yang, jamak muannats). Setelah isim maushul biasanya ada kalimat sebagai shilah.",more:"<b>Contoh:</b> الطَّالِبُ الَّذِي دَرَسَ (siswa yang belajar). Kata sebelum isim maushul memakai ال (ma'rifah). <b>Dua orang:</b> اللَّذَانِ (mudzakkar) dan اللَّتَانِ (muannats): الطَّالِبَانِ اللَّذَانِ حَضَرَا. <b>Jamak benda mati:</b> memakai الَّتِي: الْكُتُبُ الَّتِي قَرَأْتُهَا (buku-buku yang telah saya baca). <b>Dhamir penghubung:</b> bila isim maushul menjadi objek, shilah memuat dhamir yang kembali ke kata itu: الْكِتَابُ الَّذِي قَرَأْتُهُ (buku yang telah saya baca).",vocab:[["الَّذِي","yang (mudzakkar)"],["الَّتِي","yang (muannats)"],["الَّذِينَ","yang (jamak mudzakkar)"],["اللَّاتِي","yang (jamak muannats)"],["اللَّذَانِ","yang (dua, mudzakkar)"],["اللَّتَانِ","yang (dua, muannats)"]],ex:[["جَاءَ الطَّالِبُ الَّذِي دَرَسَ","Siswa yang belajar telah datang."],["هٰذِهِ الْبِنْتُ الَّتِي قَرَأَتِ الْكِتَابَ","Ini anak perempuan yang telah membaca buku."],["الطُّلَّابُ الَّذِينَ يَدْرُسُونَ مُجْتَهِدُونَ","Para siswa yang belajar itu rajin."],["هٰذَا الْكِتَابُ الَّذِي قَرَأْتُهُ","Ini buku yang telah saya baca."],["الطَّالِبَانِ اللَّذَانِ حَضَرَا مُجْتَهِدَانِ","Dua siswa yang hadir itu rajin."]],quiz:[q("الَّذِي artinya…",["Yang","Ini","Siapa"],0,"الَّذِي = yang."),q("Untuk muannats tunggal digunakan…",["الَّتِي","الَّذِي","الَّذِينَ"],0,"الَّتِي = yang (muannats)."),q("الَّذِينَ digunakan untuk…",["Jamak mudzakkar","Muannats tunggal","Mudzakkar tunggal"],0,"الَّذِينَ = jamak mudzakkar."),q("Setelah isim maushul biasanya ada…",["Shilah (kalimat penjelas)","Huruf jar saja","Tanwin"],0,"Shilah menjelaskan isim maushul."),q("Pilih yang benar: الْمُعَلِّمَةُ ___ جَلَسَتْ",["الَّتِي","الَّذِي","الَّذِينَ"],0,"Guru perempuan memakai الَّتِي."),q("اللَّذَانِ digunakan untuk…",["Dua orang mudzakkar","Banyak laki-laki","Satu perempuan"],0,"اللَّذَانِ = yang (dua, mudzakkar)."),q("Untuk jamak benda mati, isim maushul yang dipakai…",["الَّتِي","الَّذِينَ","اللَّذَانِ"],0,"Jamak benda mati diperlakukan sebagai muannats tunggal."),q("Pilih yang benar: الطَّالِبَانِ ___ حَضَرَا",["اللَّذَانِ","الَّذِي","الَّتِي"],0,"Dua laki-laki = اللَّذَانِ."),q("الْكِتَابُ الَّذِي قَرَأْتُهُ artinya…",["Buku yang telah saya baca","Buku itu baru","Saya membaca buku"],0,"Shilah: قَرَأْتُهُ (saya telah membacanya).")]},
28:{goal:"Membedakan fi'il lazim dan fi'il muta'addi.",body:"Fi'il lazim tidak membutuhkan objek: جَلَسَ (duduk), ذَهَبَ (pergi), نَامَ (tidur), حَضَرَ (hadir). Fi'il muta'addi membutuhkan objek (maf'ul bih): كَتَبَ الدَّرْسَ, قَرَأَ الْكِتَابَ, فَتَحَ الْبَابَ.",more:"<b>Tips:</b> tanyakan 'melakukan apa?'. Jika jawabannya ada (menulis apa? menulis pelajaran), fi'il itu muta'addi. Beberapa fi'il bisa lazim dengan harf jar, misalnya ذَهَبَ إِلَى. <b>Lazim dengan harf jar:</b> fi'il lazim sering diikuti harf jar dan majrur yang bukan objek: خَرَجَ الطَّالِبُ مِنَ الْفَصْلِ (siswa itu keluar dari kelas). Frasa مِنَ الْفَصْلِ majrur, bukan maf'ul bih. <b>Muta'addi:</b> أَكَلَ الْوَلَدُ الْخُبْزَ (anak itu makan roti), objeknya manshub.",vocab:[["نَامَ","telah tidur"],["حَضَرَ","telah hadir"],["لَازِمٌ","tidak butuh objek"],["مُتَعَدٍّ","butuh objek"],["أَكَلَ","telah makan"],["خُبْزٌ","roti"],["خَرَجَ","telah keluar"]],ex:[["نَامَ الْوَلَدُ","Anak itu telah tidur."],["فَتَحَ الْوَلَدُ الْبَابَ","Anak itu membuka pintu."],["ذَهَبَ الطَّالِبُ إِلَى الْمَدْرَسَةِ","Siswa itu pergi ke sekolah."],["أَكَلَ الْوَلَدُ الْخُبْزَ","Anak itu makan roti."],["خَرَجَ الطَّالِبُ مِنَ الْفَصْلِ","Siswa itu keluar dari kelas."]],quiz:[q("Fi'il lazim adalah fi'il yang…",["Tidak butuh objek","Butuh objek","Selalu perintah"],0,"Lazim tidak membutuhkan maf'ul bih."),q("نَامَ termasuk…",["Lazim","Muta'addi","Amr"],0,"Tidur tidak butuh objek."),q("كَتَبَ termasuk…",["Muta'addi","Lazim","Isim"],0,"Menulis butuh objek."),q("فَتَحَ membutuhkan…",["Maf'ul bih","Khabar","Na'at"],0,"Membuka sesuatu = ada objek."),q("جَلَسَ artinya…",["Duduk","Membuka","Membaca"],0,"جَلَسَ = duduk (lazim)."),q("أَكَلَ termasuk…",["Muta'addi","Lazim","Amr"],0,"Makan sesuatu = butuh objek."),q("خَرَجَ termasuk…",["Lazim","Muta'addi","Isim"],0,"Keluar tidak butuh objek."),q("Pada خَرَجَ الطَّالِبُ مِنَ الْفَصْلِ, مِنَ الْفَصْلِ adalah…",["Harf jar dan majrur (bukan objek)","Maf'ul bih","Fa'il"],0,"Objek harus manshub tanpa harf jar."),q("Pilih yang benar: أَكَلَ الْوَلَدُ ___",["الْخُبْزَ","الْخُبْزُ","الْخُبْزِ"],0,"Maf'ul bih manshub.")]},
29:{goal:"Mengenal sharaf (perubahan bentuk kata) dan wazan dasar.",body:"Sharaf mempelajari perubahan bentuk kata dari satu akar. Akar ك-ت-ب membentuk banyak kata dengan pola (wazan) berbeda: كَاتِبٌ (penulis, pola فَاعِلٌ), مَكْتُوبٌ (yang ditulis, pola مَفْعُولٌ), مَكْتَبٌ (tempat menulis, pola مَفْعَلٌ).",more:"<b>Contoh pola فَاعِلٌ:</b> قَارِئٌ (pembaca), ذَاهِبٌ (yang pergi), دَارِسٌ (yang belajar). <b>Pola tempat:</b> مَفْعَلَةٌ menunjukkan tempat: مَكْتَبَةٌ (tempat buku = perpustakaan), مَدْرَسَةٌ (tempat belajar). <b>Isim fa'il muannats:</b> tambah ta marbuthah: كَاتِبَةٌ (penulis perempuan), قَارِئَةٌ (pembaca perempuan). Mengenali akar akan memudahkan menebak arti kata baru.",vocab:[["كَاتِبٌ","penulis"],["مَكْتُوبٌ","yang ditulis"],["مَكْتَبٌ","tempat menulis / meja tulis / kantor"],["قَارِئٌ","pembaca"],["ذَاهِبٌ","yang pergi"],["كَاتِبَةٌ","penulis (pr)"],["قَارِئَةٌ","pembaca (pr)"],["مَكْتَبَةٌ","perpustakaan"]],ex:[["الْكَاتِبُ فِي الْمَكْتَبِ","Penulis itu ada di kantor."],["الدَّرْسُ مَكْتُوبٌ","Pelajaran itu tertulis."],["الْقَارِئُ مُجْتَهِدٌ","Pembaca itu rajin."],["الْكَاتِبَةُ فِي الْمَكْتَبَةِ","Penulis perempuan itu ada di perpustakaan."],["الْقَارِئَةُ مُجْتَهِدَةٌ","Pembaca perempuan itu rajin."]],quiz:[q("Sharaf mempelajari…",["Perubahan bentuk kata","Harakat akhir kalimat","Tanda baca"],0,"Sharaf = bentuk kata; nahwu = harakat akhir."),q("كَاتِبٌ artinya…",["Penulis","Yang ditulis","Tempat menulis"],0,"كَاتِبٌ = penulis."),q("مَكْتُوبٌ artinya…",["Yang ditulis","Penulis","Menulis"],0,"Pola مَفْعُولٌ = objek."),q("Akar kata dari كَاتِبٌ adalah…",["ك-ت-ب","ق-ر-أ","د-ر-س"],0,"Akar ك-ت-ب."),q("قَارِئٌ artinya…",["Pembaca","Yang dibaca","Penulis"],0,"قَارِئٌ = pembaca."),q("Pola فَاعِلٌ menunjukkan…",["Pelaku","Objek","Tempat"],0,"فَاعِلٌ = isim fa'il (pelaku)."),q("Pola مَفْعُولٌ menunjukkan…",["Yang dikenai perbuatan","Pelaku","Waktu"],0,"مَفْعُولٌ = isim maf'ul (objek)."),q("ذَاهِبٌ artinya…",["Yang pergi","Yang ditulis","Tempat menulis"],0,"ذَاهِبٌ = pelaku perbuatan pergi."),q("كَاتِبَةٌ artinya…",["Penulis (pr)","Penulis (lk)","Yang ditulis"],0,"Isim fa'il + ta marbuthah = pelaku perempuan."),q("Pola مَفْعَلَةٌ pada مَكْتَبَةٌ menunjukkan…",["Tempat","Pelaku","Objek"],0,"مَكْتَبَةٌ = tempat buku."),q("Akar kata مَدْرَسَةٌ adalah…",["د-ر-س","ك-ت-ب","ق-ر-أ"],0,"مَدْرَسَةٌ = tempat belajar, akar د-ر-س."),q("Isim fa'il dari ذَهَبَ adalah…",["ذَاهِبٌ","مَذْهُوبٌ","ذَهَابٌ"],0,"Pola فَاعِلٌ: ذَاهِبٌ.")]},
30:{goal:"Melihat satu akar kata berubah menjadi beberapa bentuk.",body:"Satu akar bisa menghasilkan bentuk madhi, mudhari', amr, isim fa'il (pelaku), isim maf'ul (objek), dan mashdar (kata benda perbuatan). Dari akar ك-ت-ب: كَتَبَ, يَكْتُبُ, اُكْتُبْ, كَاتِبٌ, مَكْتُوبٌ, كِتَابَةٌ (kegiatan menulis).",more:"<b>Contoh akar د-ر-س:</b> دَرَسَ, يَدْرُسُ, اُدْرُسْ, دَارِسٌ, مَدْرُوسٌ, دِرَاسَةٌ. <b>Akar ف-ت-ح:</b> فَتَحَ, يَفْتَحُ, اِفْتَحْ, فَاتِحٌ (pembuka), مَفْتُوحٌ (terbuka), فَتْحٌ (pembukaan). <b>Mashdar:</b> bentuknya tidak mengikuti satu pola tetap, jadi hafalkan satu per satu: كِتَابَةٌ، دِرَاسَةٌ، قِرَاءَةٌ، فَتْحٌ.",vocab:[["كِتَابَةٌ","menulis (kegiatan)"],["دِرَاسَةٌ","belajar (kegiatan)"],["مَصْدَرٌ","kata benda perbuatan"],["مُفِيدٌ","bermanfaat"],["مُهِمٌّ","penting"],["مَفْتُوحٌ","terbuka"],["فَاتِحٌ","pembuka"],["قِرَاءَةٌ","membaca (kegiatan)"]],ex:[["الْكِتَابَةُ مُفِيدَةٌ","Menulis itu bermanfaat."],["الدِّرَاسَةُ مُهِمَّةٌ","Belajar itu penting."],["الطَّالِبُ كَاتِبٌ","Siswa itu seorang penulis."],["الْبَابُ مَفْتُوحٌ","Pintu itu terbuka."],["الْقِرَاءَةُ مُفِيدَةٌ","Membaca itu bermanfaat."]],quiz:[q("كِتَابَةٌ termasuk…",["Mashdar","Isim fa'il","Fi'il amr"],0,"Mashdar = nama perbuatan."),q("مَكْتُوبٌ termasuk…",["Isim maf'ul","Isim fa'il","Fi'il madhi"],0,"Pola مَفْعُولٌ."),q("كَاتِبٌ termasuk…",["Isim fa'il","Isim maf'ul","Mashdar"],0,"Pola فَاعِلٌ = pelaku."),q("Dari akar د-ر-س, bentuk 'yang belajar' adalah…",["دَارِسٌ","مَدْرُوسٌ","دِرَاسَةٌ"],0,"دَارِسٌ = pelaku belajar."),q("دِرَاسَةٌ artinya…",["Belajar (kegiatan)","Pelajar","Yang dipelajari"],0,"Mashdar = kegiatan belajar."),q("Mashdar dari akar د-ر-س adalah…",["دِرَاسَةٌ","دَارِسٌ","مَدْرُوسٌ"],0,"دِرَاسَةٌ = nama perbuatan belajar."),q("مَدْرُوسٌ artinya…",["Yang dipelajari","Pelajar","Belajar (kegiatan)"],0,"Pola مَفْعُولٌ = objek."),q("الدِّرَاسَةُ مُهِمَّةٌ artinya…",["Belajar itu penting","Pelajar itu rajin","Ia belajar"],0,"دِرَاسَةٌ = belajar (kegiatan), مُهِمَّةٌ = penting."),q("مَفْتُوحٌ termasuk…",["Isim maf'ul","Isim fa'il","Mashdar"],0,"Pola مَفْعُولٌ."),q("Mashdar dari قَرَأَ adalah…",["قِرَاءَةٌ","قَارِئٌ","مَقْرُوءٌ"],0,"قِرَاءَةٌ = kegiatan membaca."),q("الْبَابُ مَفْتُوحٌ artinya…",["Pintu itu terbuka","Pintu itu baru","Ia membuka pintu"],0,"مَفْتُوحٌ = terbuka (yang dibuka)."),q("Mashdar bahasa Arab…",["Bentuknya perlu dihafal satu per satu","Selalu sama polanya","Selalu berakhiran ة"],0,"Ada banyak pola mashdar, misalnya فَتْحٌ dan كِتَابَةٌ.")]},
31:{goal:"Memperkenalkan diri dan menyapa dalam Bahasa Arab.",body:"Percakapan perkenalan diawali salam: السَّلَامُ عَلَيْكُمْ, dijawab وَعَلَيْكُمُ السَّلَامُ. Lalu tanyakan nama (مَا اسْمُكَ؟), asal (مِنْ أَيْنَ أَنْتَ؟), dan kabar (كَيْفَ حَالُكَ؟).",more:"<b>Kepada perempuan:</b> ganti akhiran كَ menjadi كِ, misalnya مَا اسْمُكِ؟, كَيْفَ حَالُكِ؟, مِنْ أَيْنَ أَنْتِ؟ <b>Salam waktu:</b> صَبَاحُ الْخَيْرِ (selamat pagi) dijawab صَبَاحُ النُّورِ; مَسَاءُ الْخَيْرِ (selamat sore/malam) dijawab مَسَاءُ النُّورِ. <b>Menjawab kabar:</b> الْحَمْدُ لِلَّهِ (segala puji bagi Allah) lalu بِخَيْرٍ. <b>Terima kasih:</b> شُكْرًا dijawab عَفْوًا (sama-sama).",vocab:[["مَرْحَبًا","halo / selamat datang"],["اسْمِي","namaku"],["مِنْ أَيْنَ أَنْتَ؟","kamu (lk) dari mana?"],["كَيْفَ حَالُكَ؟","apa kabarmu (lk)?"],["بِخَيْرٍ","baik-baik saja"],["صَبَاحُ الْخَيْرِ","selamat pagi"],["صَبَاحُ النُّورِ","selamat pagi (jawaban)"],["مَسَاءُ الْخَيْرِ","selamat sore / malam"],["الْحَمْدُ لِلَّهِ","segala puji bagi Allah"],["شُكْرًا","terima kasih"],["عَفْوًا","sama-sama"]],ex:[["السَّلَامُ عَلَيْكُمْ","Semoga keselamatan atas kalian."],["مَا اسْمُكَ؟ اسْمِي أَحْمَدُ","Siapa namamu? Namaku Ahmad."],["مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنْ إِنْدُونِيسِيَا","Kamu dari mana? Saya dari Indonesia."],["كَيْفَ حَالُكَ؟ أَنَا بِخَيْرٍ","Apa kabarmu? Saya baik-baik saja."],["صَبَاحُ الْخَيْرِ. صَبَاحُ النُّورِ","Selamat pagi. Selamat pagi (jawaban)."],["كَيْفَ حَالُكَ؟ الْحَمْدُ لِلَّهِ بِخَيْرٍ","Apa kabarmu? Alhamdulillah baik."],["شُكْرًا. عَفْوًا","Terima kasih. Sama-sama."]],quiz:[q("Jawaban salam السَّلَامُ عَلَيْكُمْ adalah…",["وَعَلَيْكُمُ السَّلَامُ","مَا اسْمُكَ","كَتَبَ"],0,"Dijawab وَعَلَيْكُمُ السَّلَامُ."),q("مَا اسْمُكَ؟ artinya…",["Siapa namamu?","Kamu dari mana?","Apa kabar?"],0,"مَا = apa, اسْمُكَ = namamu."),q("مِنْ أَيْنَ أَنْتَ؟ artinya…",["Kamu dari mana?","Kamu siapa?","Kamu kapan?"],0,"أَيْنَ = di mana."),q("بِخَيْرٍ artinya…",["Baik-baik saja","Sakit","Besar"],0,"بِخَيْرٍ = baik-baik saja."),q("Kepada perempuan, 'namamu' adalah…",["اسْمُكِ","اسْمُكَ","اسْمُهُ"],0,"Akhiran كِ untuk perempuan."),q("Jawaban صَبَاحُ الْخَيْرِ adalah…",["صَبَاحُ النُّورِ","مَسَاءُ الْخَيْرِ","شُكْرًا"],0,"Salam pagi dijawab صَبَاحُ النُّورِ."),q("شُكْرًا dijawab dengan…",["عَفْوًا","مَرْحَبًا","بِخَيْرٍ"],0,"عَفْوًا = sama-sama."),q("الْحَمْدُ لِلَّهِ artinya…",["Segala puji bagi Allah","Selamat pagi","Terima kasih"],0,"Ucapan syukur, sering dipakai menjawab kabar."),q("مَسَاءُ الْخَيْرِ digunakan pada waktu…",["Sore atau malam","Pagi","Siang saja"],0,"مَسَاءٌ = sore.")]},
32:{goal:"Menyebut anggota keluarga dan bagian rumah.",body:"Anggota keluarga: أَبٌ, أُمٌّ, أَخٌ, أُخْتٌ, جَدٌّ (kakek), جَدَّةٌ (nenek). Bagian rumah: غُرْفَةٌ (kamar), مَطْبَخٌ (dapur), حَدِيقَةٌ (taman). Untuk 'milikku', tambahkan ِي: أَبِي, أُمِّي, أَخِي, أُخْتِي.",more:"<b>Pola kalimat:</b> orang + فِي + tempat, misalnya أُمِّي فِي الْمَطْبَخِ. <b>Keluarga besar:</b> عَمٌّ (paman dari ayah), خَالٌ (paman dari ibu), ابْنٌ (anak laki-laki). <b>Idhafah ruangan:</b> غُرْفَةُ النَّوْمِ (kamar tidur), dengan dhamir: أَخِي (saudaraku), خَالِي (paman dari ibuku).",vocab:[["أُسْرَةٌ","keluarga"],["جَدٌّ","kakek"],["جَدَّةٌ","nenek"],["غُرْفَةٌ","kamar"],["مَطْبَخٌ","dapur"],["حَدِيقَةٌ","taman"],["عَمٌّ","paman (dari ayah)"],["خَالٌ","paman (dari ibu)"],["ابْنٌ","anak laki-laki"],["غُرْفَةُ النَّوْمِ","kamar tidur"]],ex:[["أُمِّي فِي الْمَطْبَخِ","Ibuku di dapur."],["جَدِّي فِي الْحَدِيقَةِ","Kakekku di taman."],["هٰذِهِ غُرْفَتِي","Ini kamarku."],["أَخِي فِي غُرْفَةِ النَّوْمِ","Saudaraku ada di kamar tidur."],["خَالِي مُعَلِّمٌ","Pamanku (dari ibu) seorang guru."]],quiz:[q("جَدٌّ artinya…",["Kakek","Nenek","Ayah"],0,"جَدٌّ = kakek."),q("مَطْبَخٌ artinya…",["Dapur","Kamar","Taman"],0,"مَطْبَخٌ = dapur."),q("أُمِّي artinya…",["Ibuku","Ibumu","Ibunya"],0,"ِي = milikku."),q("غُرْفَةٌ artinya…",["Kamar","Rumah","Pintu"],0,"غُرْفَةٌ = kamar."),q("جَدَّةٌ artinya…",["Nenek","Kakek","Ibu"],0,"جَدَّةٌ = nenek."),q("خَالٌ artinya…",["Paman dari ibu","Paman dari ayah","Kakek"],0,"خَالٌ = saudara laki-laki ibu."),q("عَمٌّ artinya…",["Paman dari ayah","Paman dari ibu","Anak laki-laki"],0,"عَمٌّ = saudara laki-laki ayah."),q("غُرْفَةُ النَّوْمِ artinya…",["Kamar tidur","Dapur","Taman"],0,"Idhafah: kamar (untuk) tidur."),q("أَخِي artinya…",["Saudaraku (lk)","Saudaramu","Saudarinya"],0,"ِي = milikku.")]},
33:{goal:"Menyebut tempat dan benda di sekolah dan pesantren.",body:"Kosakata: مَعْهَدٌ (pesantren/institut), فَصْلٌ (kelas), سَبُّورَةٌ (papan tulis), مَكْتَبَةٌ (perpustakaan), مَسْجِدٌ (masjid), دَرْسٌ (pelajaran). Perhatikan مَكْتَبٌ (meja/kantor) dan مَكْتَبَةٌ (perpustakaan) mirip tetapi artinya berbeda.",more:"<b>Pola yang berguna:</b> أَدْرُسُ فِي + tempat (saya belajar di ...), أَنَا طَالِبٌ فِي + tempat. <b>Orang di sekolah:</b> أُسْتَاذٌ (guru/ustadz), مُدِيرٌ (kepala sekolah / direktur). <b>Tempat:</b> سَاحَةٌ (halaman). <b>Idhafah:</b> مَكْتَبُ الْمُدِيرِ (kantor kepala sekolah), dan قَرِيبٌ مِنَ + tempat berarti dekat dari ...",vocab:[["مَعْهَدٌ","pesantren / institut"],["فَصْلٌ","kelas"],["سَبُّورَةٌ","papan tulis"],["مَكْتَبَةٌ","perpustakaan"],["دَرْسٌ","pelajaran"],["أُسْتَاذٌ","guru / ustadz"],["مُدِيرٌ","kepala sekolah / direktur"],["سَاحَةٌ","halaman"]],ex:[["أَدْرُسُ فِي الْمَعْهَدِ","Saya belajar di pesantren."],["الْمَكْتَبَةُ كَبِيرَةٌ","Perpustakaan itu besar."],["الطُّلَّابُ فِي الْفَصْلِ","Para siswa ada di kelas."],["الْأُسْتَاذُ فِي الْفَصْلِ","Ustadz itu ada di kelas."],["مَكْتَبُ الْمُدِيرِ قَرِيبٌ مِنَ الْمَسْجِدِ","Kantor kepala sekolah dekat dari masjid."]],quiz:[q("مَكْتَبَةٌ artinya…",["Perpustakaan","Meja tulis","Papan tulis"],0,"مَكْتَبَةٌ = perpustakaan."),q("فَصْلٌ artinya…",["Kelas","Pesantren","Masjid"],0,"فَصْلٌ = kelas."),q("سَبُّورَةٌ artinya…",["Papan tulis","Pensil","Buku"],0,"سَبُّورَةٌ = papan tulis."),q("أَدْرُسُ فِي الْمَعْهَدِ artinya…",["Saya belajar di pesantren","Saya pergi ke pasar","Dia membaca buku"],0,"أَدْرُسُ = saya belajar."),q("دَرْسٌ artinya…",["Pelajaran","Kelas","Guru"],0,"دَرْسٌ = pelajaran."),q("مُدِيرٌ artinya…",["Kepala sekolah / direktur","Siswa","Penjual"],0,"مُدِيرٌ = pengelola/kepala."),q("مَكْتَبُ الْمُدِيرِ artinya…",["Kantor kepala sekolah","Perpustakaan","Kelas"],0,"Idhafah: kantor milik direktur."),q("سَاحَةٌ artinya…",["Halaman","Dapur","Papan tulis"],0,"سَاحَةٌ = halaman."),q("قَرِيبٌ مِنَ الْمَسْجِدِ artinya…",["Dekat dari masjid","Jauh dari masjid","Di dalam masjid"],0,"قَرِيبٌ = dekat.")]},
34:{goal:"Menyebut waktu dan kegiatan sehari-hari.",body:"Waktu: صَبَاحٌ (pagi), ظُهْرٌ (siang), مَسَاءٌ (sore), لَيْلٌ (malam), يَوْمٌ (hari). Kegiatan: أَذْهَبُ (saya pergi), أَدْرُسُ (saya belajar), أَنَامُ (saya tidur). Gunakan فِي untuk 'pada': فِي الصَّبَاحِ (pada pagi hari).",more:"<b>Menanyakan jam:</b> كَمِ السَّاعَةُ؟ (jam berapa?). Jawab: السَّاعَةُ الْوَاحِدَةُ (jam satu), السَّاعَةُ الثَّانِيَةُ (jam dua). <b>Hari dalam sepekan:</b> الْأَحَدُ (Ahad/Minggu), الِاثْنَيْنِ (Senin), الثُّلَاثَاءُ (Selasa), الْأَرْبِعَاءُ (Rabu), الْخَمِيسُ (Kamis), الْجُمُعَةُ (Jumat), السَّبْتُ (Sabtu). Untuk 'pada hari ...' gunakan يَوْمَ + hari: يَوْمَ الْجُمُعَةِ. Tanyakan: مَا الْيَوْمُ؟ (hari apa ini?).",vocab:[["صَبَاحٌ","pagi"],["مَسَاءٌ","sore"],["لَيْلٌ","malam"],["يَوْمٌ","hari"],["أَنَامُ","saya tidur"],["الْيَوْمُ","hari ini"],["الْأَحَدُ","Ahad / Minggu"],["الْخَمِيسُ","Kamis"],["الْجُمُعَةُ","Jumat"]],ex:[["أَذْهَبُ إِلَى الْمَدْرَسَةِ فِي الصَّبَاحِ","Saya pergi ke sekolah pada pagi hari."],["أَدْرُسُ فِي الْمَسَاءِ","Saya belajar pada sore hari."],["أَنَامُ فِي اللَّيْلِ","Saya tidur pada malam hari."],["أَذْهَبُ إِلَى الْمَسْجِدِ يَوْمَ الْجُمُعَةِ","Saya pergi ke masjid pada hari Jumat."],["الْيَوْمُ يَوْمُ الْخَمِيسِ","Hari ini hari Kamis."]],quiz:[q("صَبَاحٌ artinya…",["Pagi","Malam","Siang"],0,"صَبَاحٌ = pagi."),q("لَيْلٌ artinya…",["Malam","Pagi","Hari"],0,"لَيْلٌ = malam."),q("أَنَامُ artinya…",["Saya tidur","Saya makan","Saya pergi"],0,"أَنَامُ = saya tidur."),q("كَمِ السَّاعَةُ؟ artinya…",["Jam berapa?","Di mana?","Siapa?"],0,"كَمِ السَّاعَةُ = jam berapa."),q("فِي الصَّبَاحِ artinya…",["Pada pagi hari","Dari pagi","Ke pagi"],0,"فِي = pada/di."),q("الْجُمُعَةُ artinya…",["Jumat","Kamis","Sabtu"],0,"الْجُمُعَةُ = hari Jumat."),q("الْخَمِيسُ artinya…",["Kamis","Rabu","Senin"],0,"الْخَمِيسُ = Kamis."),q("مَا الْيَوْمُ؟ artinya…",["Hari apa ini?","Jam berapa?","Di mana?"],0,"الْيَوْمُ = hari ini."),q("يَوْمَ الْجُمُعَةِ artinya…",["Pada hari Jumat","Dari Jumat","Ke Jumat"],0,"يَوْمَ + hari = pada hari ...")]},
35:{goal:"Berbelanja dan menawar dengan kalimat sederhana.",body:"Kosakata pasar: سُوقٌ (pasar), بَائِعٌ (penjual), ثَمَنٌ (harga), رَخِيصٌ (murah), غَالٍ (mahal). Ungkapan: بِكَمْ هٰذَا؟ (berapa harga ini?), أُرِيدُ (saya ingin), خُذْ (ambillah).",more:"<b>Contoh dialog:</b> pembeli: بِكَمْ هٰذَا الْكِتَابُ؟ penjual menjawab dengan harga, lalu pembeli: هٰذَا غَالٍ أَوْ هٰذَا رَخِيصٌ. <b>Menanyakan harga:</b> كَمْ ثَمَنُهُ؟ (berapa harganya?), dengan jawaban ثَمَنُهُ رَخِيصٌ (harganya murah). <b>Menolak:</b> لَا أُرِيدُ هٰذَا (saya tidak mau ini). <b>Pembeli:</b> زَبُونٌ (pembeli / pelanggan).",vocab:[["سُوقٌ","pasar"],["بَائِعٌ","penjual"],["ثَمَنٌ","harga"],["رَخِيصٌ","murah"],["غَالٍ","mahal"],["أُرِيدُ","saya ingin"],["كَمْ ثَمَنُهُ؟","berapa harganya?"],["ثَمَنُهُ رَخِيصٌ","harganya murah"],["زَبُونٌ","pembeli"]],ex:[["بِكَمْ هٰذَا الْكِتَابُ؟","Berapa harga buku ini?"],["هٰذَا رَخِيصٌ","Ini murah."],["أُرِيدُ قَلَمًا","Saya ingin sebuah pena."],["كَمْ ثَمَنُهُ؟","Berapa harganya?"],["لَا أُرِيدُ هٰذَا","Saya tidak mau ini."]],quiz:[q("بِكَمْ هٰذَا؟ artinya…",["Berapa harga ini?","Ini apa?","Ini milik siapa?"],0,"بِكَمْ = dengan harga berapa."),q("رَخِيصٌ artinya…",["Murah","Mahal","Besar"],0,"رَخِيصٌ = murah."),q("غَالٍ artinya…",["Mahal","Murah","Baru"],0,"غَالٍ = mahal."),q("أُرِيدُ artinya…",["Saya ingin","Saya pergi","Saya tahu"],0,"أُرِيدُ = saya ingin."),q("سُوقٌ artinya…",["Pasar","Sekolah","Rumah"],0,"سُوقٌ = pasar."),q("كَمْ ثَمَنُهُ؟ artinya…",["Berapa harganya?","Di mana pasarnya?","Siapa penjualnya?"],0,"ثَمَنٌ = harga, هُ = nya."),q("لَا أُرِيدُ هٰذَا artinya…",["Saya tidak mau ini","Saya ingin ini","Ini murah"],0,"لَا + mudhari' = tidak."),q("ثَمَنُهُ رَخِيصٌ artinya…",["Harganya murah","Harganya mahal","Ia pergi ke pasar"],0,"رَخِيصٌ = murah."),q("زَبُونٌ artinya…",["Pembeli","Penjual","Pasar"],0,"زَبُونٌ = pembeli/pelanggan.")]},
